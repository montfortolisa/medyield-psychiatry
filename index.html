ognitive slowing, with ventricular enlargement out of proportion to cortical atrophy, indicate normal pressure hydrocephalus, a potentially reversible cause of dementia. Gait usually appears first and responds best to treatment. A high-volume lumbar tap test (or external lumbar drainage) with gait assessment before and after helps select patients for a ventriculoperitoneal shunt.","why":["Cholinesterase inhibitors do not treat this reversible condition.","Correct: removing 30 to 50 mL of cerebrospinal fluid and reassessing gait predicts the response to a shunt.","His gait problem is not parkinsonism, and levodopa does not help.","Memantine does not treat this reversible condition.","Apathy here is part of the condition, not a depressive disorder."],"dsm":"DSM-5-TR Major or mild neurocognitive disorder due to another medical condition: criteria for neurocognitive disorder, with evidence from history, examination or tests that the disorder is a direct effect of another medical condition.","icd":"ICD-11 6D85 Dementia due to diseases classified elsewhere, with normal pressure hydrocephalus coded from the nervous system chapter. Criteria are similar to DSM-5-TR.","refs":"Japanese guidelines for idiopathic normal pressure hydrocephalus, 3rd ed. (2021); Relkin et al., Neurosurgery (2005).","check":"","review":"pending"},{"id":"psy2-s4-17","subj":"Psychiatry","sec":"Neurocognitive disorders","topic":"Dementias","stem":"A 63-year-old woman is brought to the hospital because of rapidly worsening memory and behavior over 10 weeks. She now needs help to dress, cannot hold a conversation and has frequent sudden jerks of her arms, especially when startled. She has also become unsteady on her feet. There is no family history of neurological disease. An EEG shows periodic sharp wave complexes. Diffusion-weighted MRI shows high signal in the cortex and caudate nuclei.","question":"Which of the following is the most likely underlying mechanism?","options":["Aggregation of alpha-synuclein","Expanded CAG repeats in HTT","Extracellular amyloid-beta plaques","Hyperphosphorylated tau tangles","Misfolded prion protein"],"answer":4,"explanation":"Rapidly progressive dementia over weeks to months with myoclonus, ataxia, periodic sharp wave complexes on EEG, cortical and basal ganglia changes on diffusion-weighted MRI indicate; a positive CSF RT-QuIC assay confirms sporadic Creutzfeldt-Jakob disease. Misfolded prion protein (PrPSc), rich in beta-pleated sheets, converts normal alpha-helical PrPC, causing spongiform change. Most patients die within a year. There is no treatment, and instruments need special decontamination.","why":["Alpha-synuclein causes Lewy body disease and Parkinson disease.","Huntington disease progresses over years, with chorea and a family history.","Amyloid-beta plaques cause Alzheimer disease, which progresses over years.","Tau tangles are seen in Alzheimer disease and some frontotemporal dementias, progressing over years.","Correct: Creutzfeldt-Jakob disease is caused by misfolded prion protein (PrPSc) that converts normal prion protein."],"dsm":"DSM-5-TR Major neurocognitive disorder due to prion disease: criteria for major neurocognitive disorder, insidious onset with rapid progression, motor features such as myoclonus or ataxia, or biomarker evidence.","icd":"ICD-11 6D85 Dementia due to diseases classified elsewhere, with the prion disease coded from the nervous system chapter (Creutzfeldt-Jakob disease). Criteria are similar to DSM-5-TR.","refs":"CDC diagnostic criteria for sporadic Creutzfeldt-Jakob disease (2018).","check":"","review":"pending"},{"id":"psy2-s4-18","subj":"Psychiatry","sec":"Other adult disorders","topic":"Somatic symptom disorders","stem":"A 31-year-old nurse is admitted for the fourth time in 6 months with episodes of sweating, shaking and confusion. During this episode, her blood glucose is 38 mg/dL. Plasma insulin is markedly elevated, while C-peptide and proinsulin are low. A sulfonylurea screen is negative. A CT scan of the abdomen is normal. She has had many investigations at 3 hospitals and appears calm and eager to undergo more tests. She is not seeking time off work, compensation or drugs, and her symptoms are causing her to lose income. She denies taking any medications.","question":"Which of the following is the most likely diagnosis?","options":["Factitious disorder imposed on self","Illness anxiety disorder","Insulinoma","Malingering","Somatic symptom disorder"],"answer":0,"explanation":"High insulin with low C-peptide during hypoglycemia means insulin has been injected, because pancreatic insulin is released with C-peptide. Deliberate falsification of illness without an obvious external reward, often in health workers, indicates factitious disorder imposed on self. Management is a non-punitive, supportive confrontation by a consistent team, one primary physician and avoidance of unnecessary procedures. Malingering differs in having external goals.","why":["Correct: deliberate, deceptive self-administration of insulin, without an obvious external reward, to take on the sick role.","Illness anxiety disorder is worry about illness, without deliberately produced signs.","An insulinoma produces raised C-peptide and proinsulin along with insulin.","Malingering requires an external incentive, which she does not have.","In somatic symptom disorder, symptoms are not deliberately produced."],"dsm":"DSM-5-TR Factitious disorder imposed on self: Criterion A (falsification of physical or psychological signs or symptoms, or induction of injury or disease, associated with deception), B (presenting oneself as ill or injured), C (deceptive behavior evident without obvious external rewards), D (not better explained by another mental disorder).","icd":"ICD-11 6D50 Factitious disorder imposed on self. Criteria are closely similar to DSM-5-TR.","refs":"Yates and Feldman, 'Factitious disorder: a systematic review of 455 cases in the professional literature', General Hospital Psychiatry (2016).","check":"","review":"pending"},{"id":"psy2-s4-19","subj":"Psychiatry","sec":"Other adult disorders","topic":"Eating disorders","stem":"A 12-year-old boy is brought to his physician because he has lost 6 kg (13 lb) over 8 months. The problem began after he choked on a fish bone at a family meal. Since then he has eaten only soups, yogurt and oatmeal and refuses solid food, fearing he will choke again. He says he wants to gain weight and is unhappy about looking thin. He does not vomit or exercise excessively. His BMI is at the 4th percentile for age. Examination shows no abnormalities. Upper endoscopy and a barium swallow are normal.","question":"Which of the following is the most likely diagnosis?","options":["Anorexia nervosa","Avoidant/restrictive food intake disorder","Bulimia nervosa","Other specified feeding or eating disorder","Rumination disorder"],"answer":1,"explanation":"Avoidant/restrictive food intake disorder is restricted eating leading to weight loss, nutritional deficiency, dependence on supplements or impaired functioning, without disturbed body image. It can be driven by low interest in food, aversion to sensory features or fear of consequences such as choking or vomiting. Medical causes must be excluded. Treatment is CBT with graded exposure to feared foods, family involvement and nutritional rehabilitation.","why":["Anorexia nervosa involves fear of weight gain or a disturbed body image, which he does not have.","Correct: food avoidance due to fear of choking, with significant weight loss, and no concern about body shape or weight.","He has no binge eating or compensatory behaviors.","This category is used only when criteria for a specific feeding or eating disorder are not met.","Rumination disorder is repeated regurgitation of food."],"dsm":"DSM-5-TR Avoidant/restrictive food intake disorder: Criterion A (eating disturbance with significant weight loss, nutritional deficiency, dependence on supplements or impaired functioning), B (not due to lack of food or cultural practice), C (not during anorexia or bulimia nervosa and no disturbed body image), D (not explained by a medical condition).","icd":"ICD-11 6B83 Avoidant-restrictive food intake disorder. Criteria are closely similar to DSM-5-TR.","refs":"American Psychiatric Association practice guideline for the treatment of patients with eating disorders (2023).","check":"","review":"pending"},{"id":"psy2-s4-20","subj":"Psychiatry","sec":"Other adult disorders","topic":"Sleep-wake disorders","stem":"A 52-year-old woman comes to her physician because of difficulty falling asleep for the past year. Most evenings, while sitting or lying down, she has an uncomfortable creeping feeling deep in her legs and an urge to move them. Walking or stretching relieves it, but it returns when she rests. Her husband says she kicks her legs during sleep. She has heavy menstrual periods. She takes no medications. Neurological examination is normal. Hemoglobin is 11.8 g/dL and serum ferritin is 30 ng/mL. Serum creatinine and TSH are normal.","question":"Which of the following is the most appropriate initial treatment?","options":["Clonazepam","Levodopa-carbidopa","Oral ferrous sulfate","Pramipexole","Zolpidem"],"answer":2,"explanation":"An urge to move the legs with unpleasant sensations, worse at rest and in the evening and relieved by movement, is restless legs syndrome. Iron deficiency is a major treatable cause; replace iron when ferritin is 75 ng/mL or less, orally or intravenously. Gabapentinoids are now the preferred first-line drugs. Antidepressants, antihistamines and dopamine antagonists can worsen symptoms. The cause of her iron deficiency should be investigated.","why":["Benzodiazepines may help sleep but are not recommended for this disorder.","Levodopa causes augmentation (earlier and more severe symptoms) and is not recommended.","Correct: iron replacement is recommended when serum ferritin is 75 ng/mL or less.","Dopamine agonists carry a high long-term risk of augmentation and are no longer recommended for routine first-line use.","Hypnotics do not treat the underlying disorder."],"dsm":"DSM-5-TR Restless legs syndrome: Criterion A (urge to move the legs with uncomfortable sensations, worse at rest, relieved by movement, worse in the evening), B (3 or more times a week for 3 months), C (distress or impairment), D and E (not explained by another condition or substance).","icd":"ICD-11 7A80 Restless legs syndrome, in the sleep-wake disorders chapter. Criteria are similar to DSM-5-TR.","refs":"Winkelman et al., AASM clinical practice guideline for the treatment of restless legs syndrome and periodic limb movement disorder (2024).","check":"","review":"pending"},{"id":"psy2-s4-21","subj":"Psychiatry","sec":"Other adult disorders","topic":"Personality disorders","stem":"A 30-year-old man is brought to the clinic by his mother, with whom he lives. Since his teens he has had no close friends apart from her. He dresses in mismatched, outdated clothes and speaks in a vague, roundabout way. He believes he can sometimes sense what people are thinking and that a television announcer has occasionally been referring to him, though he accepts this may not be true. He is uncomfortable with people and says this does not get better as he gets to know them. He works night shifts as a security guard. He has no hallucinations or fixed false beliefs, and his functioning has been stable for years.","question":"Which of the following is the most likely diagnosis?","options":["Avoidant personality disorder","Delusional disorder, persecutory type","Paranoid personality disorder","Schizoid personality disorder","Schizotypal personality disorder"],"answer":4,"explanation":"Schizotypal personality disorder is a pervasive pattern of social and interpersonal deficits with cognitive or perceptual distortions and eccentric behavior. Ideas of reference and magical thinking are held with some doubt, unlike delusions. Social anxiety persists with familiarity because it stems from paranoid fears. It is genetically related to schizophrenia. A small proportion of patients later develop schizophrenia.","why":["People with avoidant personality disorder want relationships but fear rejection; they do not have odd beliefs.","He holds his odd ideas with doubt, so they are not fixed delusions.","Paranoid personality disorder is pervasive distrust and suspicion of others, without magical thinking or eccentricity.","Schizoid personality disorder is detachment and restricted emotion, without odd beliefs or eccentric behavior.","Correct: odd beliefs, ideas of reference, eccentric appearance and speech, and social anxiety that does not lessen with familiarity."],"dsm":"DSM-5-TR Schizotypal personality disorder: a pervasive pattern beginning by early adulthood, with 5 or more of 9 features (ideas of reference; odd beliefs or magical thinking; unusual perceptions; odd thinking and speech; suspiciousness; inappropriate or constricted affect; odd behavior or appearance; lack of close friends; excessive social anxiety). Not only during schizophrenia or another psychotic disorder.","icd":"ICD-11 6A22 Schizotypal disorder. Difference: ICD-11 places it in the schizophrenia spectrum chapter rather than with the personality disorders.","refs":"American Psychiatric Association, DSM-5-TR (2022), Personality disorders chapter; WHO ICD-11 CDDR (2024).","check":"","review":"pending"},{"id":"psy2-s4-22","subj":"Psychiatry","sec":"Emergencies and mental health law","topic":"Involuntary admission","stem":"A 48-year-old woman with schizophrenia and type 2 diabetes is admitted with wet gangrene of her right forefoot with spreading cellulitis. The vascular surgeon recommends a below-knee amputation to control the infection. She refuses. Her schizophrenia has been stable on medication for 5 years, and she has no hallucinations or delusions about her leg or the doctors. She explains that without surgery the infection may spread and she could die. She says she would rather accept that risk than lose her leg, because dancing in church has been central to her life, and she has said the same to her family for years. She asks to keep receiving antibiotics and wound care.","question":"Which of the following is the most appropriate next step?","options":["Ask her family to consent on her behalf","Proceed with surgery under the emergency exception","Respect her refusal and keep offering care","Seek a court order for surgery","Start involuntary psychiatric admission"],"answer":2,"explanation":"A psychiatric diagnosis does not mean a person lacks capacity. Capacity is specific to the decision and is judged on 4 abilities: to understand the information, appreciate how it applies to oneself, reason about options and communicate a consistent choice. A capacitous adult may refuse life-saving treatment, even if others disagree. The team should respect her decision, continue to offer surgery and other care, and document the assessment.","why":["A relative can consent only when the patient lacks capacity.","The emergency exception applies only when a patient cannot consent and delay would cause serious harm.","Correct: she can understand, appreciate, reason and express a stable choice, so she has capacity to refuse.","A court order is not needed for a patient who has capacity.","Her psychotic illness is stable and does not drive her decision, so she does not meet criteria for involuntary admission."],"dsm":"Not a diagnostic question (capacity and consent). Underlying diagnosis: DSM-5-TR Schizophrenia, currently in remission.","icd":"Not a diagnostic question. Underlying diagnosis: ICD-11 6A20 Schizophrenia, in full remission.","refs":"Appelbaum, 'Assessment of patients' competence to consent to treatment', New England Journal of Medicine (2007).","check":"Capacity and consent law differs between countries; for example, Nigeria's National Mental Health Act 2021 also sets out these principles.","review":"pending"},{"id":"psy2-s4-23","subj":"Psychiatry","sec":"Emergencies and mental health law","topic":"Involuntary admission","stem":"A 34-year-old man is seen for his weekly outpatient therapy session for anger problems after a dispute at work. During the session, he says calmly that he will shoot his supervisor in the parking lot tomorrow morning because she 'ruined my life.' He says he bought a handgun last week and knows where she parks. He is not psychotic, intoxicated or depressed. He refuses to discuss the plan further and leaves the session early, saying, 'I've made up my mind.' His therapist knows the supervisor's name and workplace.","question":"Which of the following is the most appropriate action by the therapist?","options":["Ask the patient for permission before contacting anyone","Document the threat and review it at the next session","Increase his therapy to twice weekly","Notify police and warn the supervisor","Refer him to an anger-management course"],"answer":3,"explanation":"After Tarasoff v. Regents of the University of California (1976), most US states impose or permit a duty to protect when a patient makes a serious threat of violence against an identifiable person. Reasonable steps include warning the victim, notifying police and arranging emergency evaluation or hospitalization. The therapist should disclose only what is needed and document the decision. This is a recognized exception to confidentiality.","why":["The duty to protect allows confidentiality to be breached without the patient's consent.","Waiting for the next session leaves an identifiable person at serious, imminent risk.","More therapy does not protect an identifiable person from an imminent threat.","Correct: a serious, specific threat to an identifiable victim creates a duty to take reasonable steps to protect her.","A referral does not address imminent risk to an identifiable person."],"dsm":"Not a diagnostic question (legal and ethical duty).","icd":"Not a diagnostic question (legal and ethical duty).","refs":"Tarasoff v. Regents of the University of California, 17 Cal.3d 425 (1976); American Psychiatric Association, Principles of Medical Ethics, Section 4.","check":"The duty to warn or protect varies by US state (mandatory, permissive or none) and by country.","review":"pending"},{"id":"psy2-s4-24","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Antidepressants","stem":"A 15-year-old girl has had moderate major depressive disorder for 3 months. She has had 8 sessions of CBT with partial improvement. She has no history of mania, and she has no current suicidal thoughts. Her psychiatrist recommends adding fluoxetine 10 mg daily, increasing to 20 mg after 1 week. Her parents agree but ask what they most need to know about starting the medication. She lives with both parents and attends school.","question":"Which of the following is the most important information to give the family?","options":["Agitation or new suicidal thoughts may emerge early and need close monitoring","Blood fluoxetine levels should be checked before each dose increase","Fluoxetine must be tapered over several weeks because withdrawal symptoms are usually severe","Most patients recover fully within 1 to 2 weeks, so the dose can be raised if she has not recovered by then","Weight gain is the most common reason to stop treatment"],"answer":0,"explanation":"Fluoxetine is FDA-approved for depression from age 8, and escitalopram from age 12. In 2004 the FDA added a boxed warning that antidepressants increase the risk of suicidal thoughts and behavior in children, adolescents and young adults. The absolute risk is small and benefits usually outweigh it, but patients need close follow-up, especially in the first weeks and after dose changes. Families should know the warning signs and whom to call.","why":["Correct: antidepressants carry a boxed warning for increased suicidal thinking in people under 25, especially in the first weeks and after dose changes.","Blood level monitoring is not needed for fluoxetine.","Fluoxetine's long half-life makes withdrawal symptoms mild and uncommon.","A full response usually takes 6 to 12 weeks; doses are raised gradually after about 4 weeks.","Activation and gastrointestinal upset are more common reasons to stop than weight gain."],"dsm":"DSM-5-TR Major depressive disorder: Criterion A (5 or more of 9 symptoms for 2 weeks, including depressed or irritable mood, or anhedonia; irritable mood counts in children and adolescents).","icd":"ICD-11 6A70 Single episode depressive disorder. Criteria are closely similar to DSM-5-TR.","refs":"FDA boxed warning on antidepressants and suicidality in children and adolescents (2004, extended to age 24 in 2007); AACAP clinical practice guideline for the assessment and treatment of children and adolescents with major and persistent depressive disorders (2023).","check":"","review":"pending"},{"id":"psy2-s4-25","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Psychotherapies","stem":"A 40-year-old woman is in psychodynamic psychotherapy for low mood. Six months ago, her mother-in-law moved into the family home against her wishes. Before the move, she complained bitterly to friends that her mother-in-law criticized her cooking and her parenting. Since the move, she says she 'adores' her mother-in-law. She cooks her elaborate meals every day, buys her expensive gifts and praises her constantly to neighbors, in a way her husband describes as 'over the top.' She becomes uncomfortable when the therapist mentions her earlier complaints.","question":"Which of the following defense mechanisms is she most likely using?","options":["Displacement","Passive aggression","Projection","Reaction formation","Sublimation"],"answer":3,"explanation":"Defense mechanisms are unconscious processes that protect against anxiety from unacceptable feelings. In reaction formation, the person behaves in a way opposite to the true feeling, often in an exaggerated way. Reaction formation, displacement and projection are neurotic or immature defenses; sublimation, altruism, humor and suppression are mature defenses. Psychodynamic therapy explores these patterns to increase insight.","why":["Displacement is redirecting feelings to a safer target, such as shouting at her husband.","Passive aggression is expressing hostility indirectly, such as by 'forgetting' to cook for her.","Projection is attributing her own feelings to someone else, such as believing her mother-in-law hates her.","Correct: she turns unacceptable hostility into its exaggerated opposite.","Sublimation is channeling unacceptable impulses into socially valued activities."],"dsm":"Not a diagnosis. DSM-IV included a Defensive Functioning Scale for defense mechanisms; DSM-5-TR does not.","icd":"Not a diagnosis. ICD-11 does not classify defense mechanisms.","refs":"Vaillant, 'Ego Mechanisms of Defense: A Guide for Clinicians and Researchers' (1992); Gabbard, Psychodynamic Psychiatry in Clinical Practice (5th ed., 2014).","check":"","review":"pending"}],"cards":[]};
