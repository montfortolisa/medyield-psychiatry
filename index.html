ria are closely similar to DSM-5-TR.","refs":"American Psychiatric Association, DSM-5-TR (2022), Dissociative disorders chapter.","check":"","review":"pending"},{"id":"psy2-s3-08","subj":"Psychiatry","sec":"Other adult disorders","topic":"Sexual dysfunctions","stem":"A 30-year-old man comes to his physician because he ejaculates within about 30 seconds of vaginal penetration on nearly every occasion. This has happened since his first sexual experiences and has continued for over 2 years with his current partner. He gets and keeps erections normally and has normal morning erections. Both partners are distressed, and they have tried stopping and starting during intercourse without benefit. He has no urinary symptoms and takes no medications. He does not drink alcohol or use drugs. Physical examination, including the genitals and prostate, is normal.","question":"Which of the following is the most appropriate pharmacotherapy?","options":["Bupropion","Paroxetine","Sildenafil","Testosterone gel","Yohimbine"],"answer":1,"explanation":"Ejaculation within about 1 minute of penetration on most occasions for at least 6 months, causing distress, is premature (early) ejaculation. It is lifelong here. Treatment combines behavioral techniques and couples work with medication: daily SSRIs (paroxetine has the strongest effect), clomipramine, or topical anesthetic sprays. Dapoxetine, a short-acting SSRI, is approved in some countries but not in the US.","why":["Bupropion does not delay ejaculation.","Correct: daily SSRIs, especially paroxetine, delay ejaculation and are first-line drug treatment.","Sildenafil treats erectile dysfunction, which he does not have.","There is no evidence of hypogonadism.","Yohimbine has no proven role and can cause anxiety and hypertension."],"dsm":"DSM-5-TR Premature (early) ejaculation: Criterion A (ejaculation within about 1 minute of vaginal penetration and before the person wishes it, on 75 to 100 percent of occasions), B (at least 6 months), C (clinically significant distress); specify lifelong or acquired.","icd":"ICD-11 HA03.0 Male early ejaculation. Difference: ICD-11 moved sexual dysfunctions out of the mental disorders chapter into a new chapter, 'Conditions related to sexual health', and gives no fixed time cut-off.","refs":"AUA/SMSNA guideline on disorders of ejaculation (2020); ISSM guidelines on premature ejaculation (2014).","check":"SSRIs are used off-label for premature ejaculation in the US.","review":"pending"},{"id":"psy2-s3-09","subj":"Psychiatry","sec":"Other adult disorders","topic":"Sleep-wake disorders","stem":"A 19-year-old college student comes to the clinic because she falls asleep in lectures and while studying, despite sleeping 8 hours each night. This has happened for the past 8 months. Short naps leave her feeling refreshed. When she laughs at a joke, her knees sometimes buckle and her jaw goes slack for a few seconds, but she stays fully aware. On falling asleep, she often sees vivid figures in her room and cannot move for a short time. She does not snore. She takes no medications. BMI is 22 kg/m². Physical and neurological examinations are normal.","question":"Which of the following findings is most likely on further evaluation?","options":["Apnea-hypopnea index of 30 events per hour","Cerebrospinal fluid 14-3-3 protein","Low cerebrospinal fluid hypocretin-1","Low serum ferritin","Mean sleep latency of 15 minutes"],"answer":2,"explanation":"Daytime sleepiness with refreshing naps, cataplexy (sudden loss of muscle tone triggered by emotion, with consciousness kept), hypnagogic hallucinations and sleep paralysis indicate narcolepsy. Type 1 is caused by loss of hypothalamic hypocretin neurons and is strongly associated with HLA-DQB1*06:02. Diagnosis is by polysomnography followed by a multiple sleep latency test, or low CSF hypocretin-1. Treatment includes scheduled naps, modafinil or other wake-promoting drugs, and sodium oxybate or pitolisant.","why":["A raised apnea-hypopnea index indicates obstructive sleep apnea; she does not snore and has a normal BMI.","14-3-3 protein suggests Creutzfeldt-Jakob disease.","Correct: narcolepsy with cataplexy (type 1) is caused by loss of hypocretin (orexin) neurons in the hypothalamus.","Low ferritin is linked with restless legs syndrome.","In narcolepsy, mean sleep latency is short (8 minutes or less), with sleep-onset REM periods."],"dsm":"DSM-5-TR Narcolepsy: Criterion A (recurrent irresistible need to sleep at least 3 times a week for 3 months), B (at least 1 of: cataplexy; CSF hypocretin-1 deficiency; or REM sleep latency of 15 minutes or less on polysomnography or mean sleep latency of 8 minutes or less with 2 or more sleep-onset REM periods).","icd":"ICD-11 7A20.0 Narcolepsy, type 1. Difference: ICD-11 places sleep-wake disorders in their own chapter (chapter 7), separate from mental disorders, and splits narcolepsy into type 1 and type 2 as in ICSD-3.","refs":"American Academy of Sleep Medicine, International Classification of Sleep Disorders (ICSD-3-TR, 2023); AASM clinical practice guideline on central disorders of hypersomnolence (2021).","check":"","review":"pending"},{"id":"psy2-s3-10","subj":"Psychiatry","sec":"Other adult disorders","topic":"Sleep-wake disorders","stem":"A 67-year-old woman comes to her physician because of difficulty staying asleep for the past 9 months. On 4 or 5 nights a week, she wakes at about 2 AM and lies awake for 2 hours worrying that she will be tired the next day. She often naps in the afternoon and goes to bed at 9 PM 'to catch up.' She feels tired during the day. She does not snore and has no leg discomfort at night. A PHQ-9 score is 3. She tried diphenhydramine, but it made her confused the next morning. She has hypertension and osteoarthritis. She asks for 'a real sleeping pill.'","question":"Which of the following is the most appropriate initial treatment?","options":["Cognitive behavioral therapy for insomnia","Low-dose quetiapine","Sleep hygiene education","Temazepam","Zolpidem"],"answer":0,"explanation":"Difficulty staying asleep at least 3 nights a week for at least 3 months, with daytime impairment, is chronic insomnia disorder. Daytime napping and spending extra time in bed keep it going. CBT for insomnia is first-line for all adults and is effective in older people. Benzodiazepines and Z-drugs are on the Beers Criteria list of drugs to avoid in older adults because of falls, fractures and cognitive impairment.","why":["Correct: CBT for insomnia (sleep restriction, stimulus control, sleep education and cognitive therapy) is first-line.","Antipsychotics are not recommended for insomnia because of metabolic and other adverse effects.","Sleep hygiene education alone is not effective as a treatment for chronic insomnia.","Benzodiazepines increase falls, confusion and dependence in older adults.","Z-drugs increase falls, fractures and complex sleep behaviors in older adults."],"dsm":"DSM-5-TR Insomnia disorder: Criterion A (difficulty initiating or maintaining sleep, or early waking), B (distress or impairment), C (at least 3 nights a week), D (at least 3 months), E (despite adequate opportunity for sleep), F to H (not better explained by another sleep disorder, substance or mental disorder).","icd":"ICD-11 7A00 Chronic insomnia (in the sleep-wake disorders chapter). Criteria are similar to DSM-5-TR: frequent difficulty with sleep for at least 3 months, with daytime impairment.","refs":"American College of Physicians guideline on management of chronic insomnia disorder in adults (2016); American Geriatrics Society Beers Criteria (2023).","check":"","review":"pending"},{"id":"psy2-s3-11","subj":"Psychiatry","sec":"Other adult disorders","topic":"Personality disorders","stem":"A 39-year-old accountant is referred by his employer because he repeatedly misses deadlines. He rewrites each report several times until it is 'perfect' and refuses to let junior staff help because 'they will not do it properly.' He works 70 hours a week and has not taken a vacation in 5 years. He insists his family follow strict rules about how the house is cleaned and refuses to spend money on anything that is not 'essential,' although the family is financially comfortable. His office files are neatly organized. He believes his standards are correct and that others are careless.","question":"Which of the following is the most likely diagnosis?","options":["Autism spectrum disorder","Avoidant personality disorder","Hoarding disorder","Obsessive-compulsive disorder","Obsessive-compulsive personality disorder"],"answer":4,"explanation":"Obsessive-compulsive personality disorder is a pervasive pattern of preoccupation with orderliness, perfectionism and control that interferes with getting tasks done. The traits are ego-syntonic: he sees them as right. In contrast, OCD causes ego-dystonic obsessions and compulsions that the person tries to resist. The two can coexist. Psychotherapy is the main treatment.","why":["He has no lifelong difficulty with social communication or restricted, repetitive behaviors described from childhood.","Avoidant personality disorder is marked by social inhibition and fear of criticism.","Hoarding disorder causes cluttered living areas, which he does not have.","OCD involves unwanted obsessions and compulsions that the person tries to resist; his habits feel right to him.","Correct: a pervasive pattern of perfectionism, rigidity, control, devotion to work and miserliness that he sees as correct."],"dsm":"DSM-5-TR Obsessive-compulsive personality disorder: a pervasive pattern beginning by early adulthood, with 4 or more of 8 features (preoccupation with details; perfectionism that interferes with completing tasks; excessive devotion to work; overconscientiousness; inability to discard worthless objects; reluctance to delegate; miserliness; rigidity and stubbornness).","icd":"ICD-11 6D10 Personality disorder (rated mild, moderate or severe) with the trait domain specifier 6D11.4 Anankastia. Difference: ICD-11 has no separate personality disorder categories; it rates severity and describes prominent trait domains.","refs":"American Psychiatric Association, DSM-5-TR (2022), Personality disorders chapter; WHO ICD-11 CDDR (2024).","check":"","review":"pending"},{"id":"psy2-s3-12","subj":"Psychiatry","sec":"Other adult disorders","topic":"Eating disorders","stem":"A 20-year-old college student comes to the clinic because of tiredness and palpitations. She is preoccupied with her weight and says that 2 or 3 times a week she eats large amounts of food in a short time and feels unable to stop. She denies using laxatives or diuretics. Her menses are regular. Pulse is 92/min and blood pressure is 108/70 mm Hg. BMI is 22 kg/m². Examination shows painless swelling of both parotid glands, erosion of the inner surfaces of her upper front teeth and calluses on the backs of the fingers of her right hand.","question":"Which of the following laboratory findings is most likely?","options":["Hyperchloremic metabolic acidosis","Hyperkalemia","Hypokalemic metabolic alkalosis","Low serum amylase","Respiratory alkalosis"],"answer":2,"explanation":"Recurrent binge eating with compensatory vomiting, shown by parotid swelling, dental erosion and knuckle calluses (Russell sign), in a person of normal weight indicates bulimia nervosa. Vomiting causes hypochloremic, hypokalemic metabolic alkalosis and raised salivary amylase. Hypokalemia can cause arrhythmias. First-line treatment is CBT for eating disorders, and fluoxetine is the only FDA-approved medication. Bupropion is contraindicated because of seizure risk.","why":["Normal anion gap acidosis occurs with laxative misuse and diarrhea, not vomiting.","Potassium is lost in vomit and urine, so it falls.","Correct: self-induced vomiting causes loss of acid and chloride, with hypokalemia from renal potassium loss.","Serum amylase is often raised, from parotid gland enlargement.","Respiratory alkalosis is not caused by vomiting."],"dsm":"DSM-5-TR Bulimia nervosa: Criterion A (recurrent binge eating), B (recurrent inappropriate compensatory behavior), C (both at least once a week for 3 months), D (self-evaluation unduly influenced by body shape and weight), E (not only during anorexia nervosa).","icd":"ICD-11 6B81 Bulimia nervosa. Difference: ICD-11 sets the frequency at about once a week for at least 1 month and accepts binges that are subjectively large.","refs":"APA practice guideline for the treatment of patients with eating disorders (2023).","check":"","review":"pending"},{"id":"psy2-s3-13","subj":"Psychiatry","sec":"Mood disorders","topic":"Major depressive disorder","stem":"A 74-year-old man is brought to the clinic by his daughter because of memory problems that began about 3 months ago, shortly after he retired. He has lost 5 kg (11 lb), wakes at 4 AM and no longer reads the newspaper or visits friends. He complains repeatedly that his memory is 'gone' and says he is a burden. During testing, he often answers 'I don't know' and gives up quickly, but when encouraged he answers correctly. His score on the Montreal Cognitive Assessment is 22 of 30. He is alert and his attention does not fluctuate. Neurological examination, serum vitamin B12, TSH, calcium and an MRI of the brain are normal for his age.","question":"Which of the following is the most likely diagnosis?","options":["Delirium","Major depressive disorder","Major neurocognitive disorder due to Alzheimer disease","Mild neurocognitive disorder due to vascular disease","Prolonged grief disorder"],"answer":1,"explanation":"Depression in older adults can cause cognitive impairment, sometimes called pseudodementia. Clues are a recent, clear onset, prominent depressive symptoms, complaints about memory out of keeping with test results, 'I don't know' answers and poor effort, and better performance with encouragement. Treatment of the depression usually improves cognition, but these patients have a higher later risk of dementia, so follow-up is needed.","why":["His attention is normal and does not fluctuate.","Correct: depression in older adults can cause cognitive impairment that improves with treatment.","Alzheimer disease begins gradually over years, and patients tend to minimize memory problems rather than emphasize them.","The MRI shows no vascular disease.","Prolonged grief disorder follows the death of someone close, at least 12 months earlier."],"dsm":"DSM-5-TR Major depressive disorder: Criterion A (5 or more of 9 symptoms for 2 weeks, including depressed mood or anhedonia; A8 is diminished ability to think or concentrate), B (distress or impairment), C (not due to a substance or medical condition).","icd":"ICD-11 6A70 Single episode depressive disorder. Criteria are closely similar to DSM-5-TR.","refs":"Kang et al., 'Pseudodementia: a neuropsychological review', Annals of Indian Academy of Neurology (2014).","check":"","review":"pending"},{"id":"psy2-s3-14","subj":"Psychiatry","sec":"Psychotic disorders","topic":"Schizophrenia","stem":"A 21-year-old man is brought to the clinic by his parents because of 4 months of strange behavior. He hears voices commenting on his actions and believes that the government has placed a chip in his tooth to track him. His speech is often hard to follow, and he has stopped attending college and rarely bathes. Before this, he was a good student with friends. He has had no periods of depressed or elevated mood. He does not use alcohol, cannabis or other drugs, and a urine drug screen is negative. Physical examination, a complete blood count, TSH and an MRI of the brain are normal.","question":"Which of the following is the most likely diagnosis?","options":["Brief psychotic disorder","Delusional disorder","Schizoaffective disorder","Schizophrenia","Schizophreniform disorder"],"answer":4,"explanation":"He has hallucinations, delusions, disorganized speech and negative symptoms for 4 months, with no mood, substance or medical cause. DSM-5-TR diagnoses schizophreniform disorder when the episode lasts at least 1 month but less than 6 months; functional decline is not required. About two thirds of patients later meet criteria for schizophrenia. Treatment is the same as for schizophrenia, with an antipsychotic and psychosocial support.","why":["Brief psychotic disorder lasts more than 1 day but less than 1 month.","He has hallucinations, disorganized speech and a decline in functioning, not delusions alone.","He has had no mood episodes.","Schizophrenia requires continuous signs of illness for at least 6 months.","Correct: schizophrenia-like symptoms lasting at least 1 month but less than 6 months."],"dsm":"DSM-5-TR Schizophreniform disorder: Criterion A (2 or more of delusions, hallucinations, disorganized speech, disorganized or catatonic behavior, negative symptoms, at least 1 being one of the first 3), B (episode lasts at least 1 month but less than 6 months), C and D (schizoaffective, mood, substance and medical causes excluded).","icd":"ICD-11 6A20 Schizophrenia (requires symptoms for at least 1 month). Difference: ICD-11 has no schizophreniform category, so this patient would already be diagnosed with schizophrenia.","refs":"American Psychiatric Association, DSM-5-TR (2022), Schizophrenia spectrum chapter; WHO ICD-11 CDDR (2024).","check":"","review":"pending"},{"id":"psy2-s3-15","subj":"Psychiatry","sec":"Substance-related disorders","topic":"Cannabis and hallucinogens","stem":"A 24-year-old man comes to the emergency department because of severe nausea, vomiting and diffuse abdominal pain for 2 days. He has had 4 similar episodes in the past year, each lasting several days, with well periods in between. He says that the only thing that helps is taking long hot showers, which he does several times a day. He has smoked cannabis daily for 5 years. He does not drink alcohol. Pulse is 104/min and blood pressure is 118/74 mm Hg. The abdomen is soft with mild diffuse tenderness. Lipase, liver tests, an abdominal ultrasound and upper endoscopy from a previous episode were normal.","question":"Which of the following is most likely to prevent further episodes?","options":["Daily oral ondansetron","Laparoscopic cholecystectomy","Long-term amitriptyline prophylaxis","Long-term proton pump inhibitor","Stopping cannabis use"],"answer":4,"explanation":"Recurrent episodes of vomiting in a long-term daily cannabis user, relieved by hot showers, indicate cannabinoid hyperemesis syndrome. The only lasting treatment is stopping cannabis; improvement may take weeks. In the acute episode, standard antiemetics often fail, while haloperidol or topical capsaicin can help. Coexisting cannabis use disorder should be assessed and treated, for example with motivational interviewing and CBT.","why":["Antiemetics give little relief and do not prevent episodes.","The gallbladder is normal, and the pattern is not biliary colic.","Amitriptyline is used to prevent cyclic vomiting syndrome, which is diagnosed only after cannabis use is excluded as a cause.","Endoscopy was normal, and acid suppression does not prevent these episodes.","Correct: episodes resolve with sustained abstinence from cannabis."],"dsm":"Not a DSM-5-TR diagnosis (medical complication of cannabis). The underlying cannabis use disorder uses DSM-5-TR criteria: 2 or more of 11 problems in 12 months.","icd":"ICD-11 has no separate code for this syndrome; it is coded with 6C41 Disorders due to use of cannabis (for example, 6C41.2 Cannabis dependence). Difference: ICD-11 uses separate categories, harmful pattern of use and dependence, rather than one use disorder.","refs":"Rome IV criteria for cannabinoid hyperemesis syndrome (2016); Sorensen et al., 'Cannabinoid hyperemesis syndrome: diagnosis, pathophysiology, and treatment', Journal of Medical Toxicology (2017).","check":"","review":"pending"},{"id":"psy2-s3-16","subj":"Psychiatry","sec":"Substance-related disorders","topic":"Alcohol use disorder","stem":"A 52-year-old man with alcohol use disorder completed medically supervised withdrawal 1 week ago and wants help to stay abstinent. He has drunk heavily for 20 years, with several relapses. He has cirrhosis with ascites (Child-Pugh class B). He has also been taking methadone 80 mg daily for opioid use disorder for 3 years and wants to continue it. Serum creatinine is 0.9 mg/dL. He has no thoughts of self-harm. He agrees to attend counseling and mutual-help meetings and asks for a medication.","question":"Which of the following is the most appropriate medication to help him maintain abstinence?","options":["Acamprosate","Chlordiazepoxide","Disulfiram","Naltrexone","Varenicline"],"answer":0,"explanation":"FDA-approved medications for alcohol use disorder are naltrexone, acamprosate and disulfiram. Choice depends on the patient: naltrexone is first-line for many but cannot be used with opioids and needs caution in liver failure. Acamprosate, which modulates glutamate signaling, is renally cleared and suits patients with liver disease or on opioid treatment; it is avoided when creatinine clearance is 30 mL/min or less. Medication works best combined with psychosocial support.","why":["Correct: acamprosate is cleared by the kidneys, is safe in liver disease and does not interact with opioids.","Benzodiazepines are used for withdrawal, not to maintain abstinence, and are risky with methadone and cirrhosis.","Disulfiram is contraindicated in severe liver disease and can cause hepatitis.","Naltrexone, an opioid antagonist, would cause withdrawal in someone taking methadone.","Varenicline is a smoking-cessation drug and is not approved for alcohol use disorder."],"dsm":"DSM-5-TR Alcohol use disorder: 2 or more of 11 criteria within 12 months (for example, craving, tolerance, withdrawal, failed attempts to cut down, use despite harm); severity mild (2 to 3), moderate (4 to 5) or severe (6 or more); remission specifiers.","icd":"ICD-11 6C40.2 Alcohol dependence. Difference: ICD-11 requires 2 of 3 core features (impaired control, increasing priority of alcohol, physiological features) and keeps a separate harmful pattern of use (6C40.1).","refs":"APA practice guideline for the pharmacological treatment of patients with alcohol use disorder (2018).","check":"","review":"pending"},{"id":"psy2-s3-17","subj":"Psychiatry","sec":"Neurocognitive disorders","topic":"Dementias","stem":"A 56-year-old man is brought to his physician by his wife because of a change in his behavior over the past 2 years. He makes sexual jokes to strangers, has been reprimanded at work for taking food from colleagues' plates and recently shoplifted candy. He eats large amounts of sugary food and has gained 10 kg (22 lb). He has lost interest in his family and shows no concern when his wife is upset. He repeatedly hums the same tune. He can describe recent events accurately and navigates his town without difficulty. There is no family history of neurological illness. He has no involuntary movements, rigidity or tremor. An MRI of the brain has been requested.","question":"This patient most likely has a major neurocognitive disorder due to which of the following?","options":["Alzheimer disease","Creutzfeldt-Jakob disease","Frontotemporal lobar degeneration","Huntington disease","Lewy body disease"],"answer":2,"explanation":"Behavioral variant frontotemporal dementia usually begins before 65 with early personality and behavior change: disinhibition, apathy, loss of sympathy or empathy, compulsive or repetitive behavior, and hyperorality. Memory and visuospatial skills are relatively spared early. Imaging shows frontal and anterior temporal atrophy. Pathology is tau (including Pick bodies) or TDP-43. Cholinesterase inhibitors do not help and may worsen behavior; SSRIs may reduce disinhibition and compulsions.","why":["Alzheimer disease usually begins with memory loss, which is spared here.","Creutzfeldt-Jakob disease progresses over months, with myoclonus.","Correct: early disinhibition, apathy, loss of empathy, overeating and repetitive behavior, with memory spared, indicate the behavioral variant of frontotemporal dementia.","Huntington disease causes chorea and usually has a family history.","Lewy body disease causes fluctuating cognition, visual hallucinations and parkinsonism."],"dsm":"DSM-5-TR Major frontotemporal neurocognitive disorder, behavioral variant: criteria for major neurocognitive disorder, insidious onset and gradual progression, 3 or more of disinhibition, apathy, loss of sympathy or empathy, compulsive behavior, hyperorality, with prominent decline in social cognition or executive ability and relative sparing of learning, memory and perception.","icd":"ICD-11 6D83 Frontotemporal dementia (with the neurological disease coded as 8A23). Criteria are similar to DSM-5-TR.","refs":"Rascovsky et al., international consensus criteria for behavioural variant FTD, Brain (2011).","check":"","review":"pending"},{"id":"psy2-s3-18","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Antidepressants","stem":"A 35-year-old woman comes to the emergency department because of 3 days of dizziness, nausea, irritability, vivid dreams and brief 'electric shock' sensations in her head when she moves her eyes. She has missed 2 days of work and asks for something to relieve the symptoms now. She has taken paroxetine 40 mg daily for 1 year for major depressive disorder, which is in full remission. Four days ago, her prescription ran out, and she stopped the drug because she felt well. She takes no other medications. Temperature is 36.9°C (98.4°F), pulse is 82/min and blood pressure is 118/76 mm Hg. Pupils are normal, and there is no tremor, hyperreflexia or clonus.","question":"Which of the following is the most appropriate next step in management?","options":["Begin cyproheptadine","Begin meclizine as needed","Reassure that no treatment is needed","Restart paroxetine and taper gradually","Switch to bupropion"],"answer":3,"explanation":"Stopping an antidepressant suddenly, especially a short half-life drug like paroxetine or venlafaxine, can cause discontinuation syndrome within days: flu-like symptoms, insomnia and vivid dreams, nausea, imbalance, sensory disturbances such as 'brain zaps', and irritability (FINISH). It is not dangerous but can be distressing. Disabling symptoms are best treated by restarting the drug and then tapering slowly. Fluoxetine, with a long half-life, rarely causes this.","why":["Cyproheptadine is a serotonin antagonist used for serotonin syndrome and would worsen these symptoms.","Meclizine treats vertigo symptomatically but not the cause.","Mild symptoms can be watched, but hers are disabling.","Correct: reinstating the drug relieves symptoms quickly, followed by a slow taper over weeks to months.","Bupropion does not act on serotonin and will not prevent discontinuation symptoms."],"dsm":"DSM-5-TR Antidepressant discontinuation syndrome is listed under 'Medication-induced movement disorders and other adverse effects of medication'; it is not a mental disorder.","icd":"Not classified as a mental disorder in ICD-11; it is coded as an adverse effect of the medication.","refs":"Horowitz and Taylor, 'Tapering of SSRI treatment to mitigate withdrawal symptoms', Lancet Psychiatry (2019); NICE guideline NG222: Depression in adults (2022).","check":"","review":"pending"},{"id":"psy2-s3-19","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Antidepressants","stem":"A 24-year-old woman is brought to the emergency department 5 hours after taking an unknown number of her amitriptyline tablets. She is drowsy but rousable and is protecting her airway. Temperature is 37.8°C (100°F), pulse is 128/min, respirations are 16/min and blood pressure is 92/58 mm Hg. Her skin is warm and dry, her pupils are dilated and bowel sounds are reduced. An ECG shows sinus tachycardia with a QRS duration of 140 ms and a prominent terminal R wave in lead aVR. Intravenous fluids are started.","question":"Which of the following is the most appropriate next step in management?","options":["Hemodialysis","Intravenous flumazenil","Intravenous physostigmine","Intravenous sodium bicarbonate","Oral activated charcoal"],"answer":3,"explanation":"Tricyclic overdose causes anticholinergic toxicity, hypotension from alpha-1 blockade, seizures and cardiotoxicity from blockade of fast sodium channels, seen as QRS widening and a terminal R wave in aVR. A QRS longer than 100 ms predicts seizures and longer than 160 ms predicts ventricular arrhythmias. Treatment is intravenous sodium bicarbonate, airway support, benzodiazepines for seizures and vasopressors for refractory hypotension. Patients need psychiatric assessment once medically stable.","why":["Tricyclic antidepressants are highly protein-bound and widely distributed, so dialysis does not remove them.","Flumazenil can trigger seizures in tricyclic overdose.","Physostigmine can cause asystole and seizures in tricyclic overdose.","Correct: sodium loading and alkalinization overcome sodium channel blockade and narrow the QRS.","Charcoal is unlikely to help 5 hours after ingestion and risks aspiration in a drowsy patient."],"dsm":"Not a diagnostic question (drug toxicity).","icd":"Not a diagnostic question; coded as poisoning by antidepressants in ICD-11 chapter 22.","refs":"Body et al., guidelines for management of tricyclic antidepressant overdose, Emergency Medicine Journal (2011); Goldfrank's Toxicologic Emergencies (11th ed.).","check":"","review":"pending"},{"id":"psy2-s3-20","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Antidepressants","stem":"A 38-year-old man comes to his physician because of 2 months of low mood, fatigue, poor concentration, loss of interest and excessive sleep. He has no thoughts of self-harm. This is his first episode. He smokes 20 cigarettes a day and wants to stop. He has a BMI of 33 kg/m² and is worried about gaining weight. He takes no medications and does not drink alcohol. Vital signs and physical examination are normal apart from obesity.","question":"Which of the following is the most appropriate pharmacotherapy?","options":["Bupropion","Mirtazapine","Paroxetine","Sertraline","Venlafaxine"],"answer":0,"explanation":"Bupropion inhibits reuptake of noradrenaline and dopamine. It is effective for depression, is approved for smoking cessation and is weight-neutral or causes weight loss, with little sexual dysfunction. It suits patients with fatigue and hypersomnia. It lowers the seizure threshold and is contraindicated in seizure disorders, bulimia or anorexia nervosa, and during abrupt withdrawal from alcohol or benzodiazepines.","why":["Correct: it treats depression, aids smoking cessation and causes little weight gain.","Mirtazapine causes sedation, increased appetite and weight gain.","Paroxetine is associated with weight gain and does not help smoking cessation.","Sertraline does not help smoking cessation and offers no advantage for his weight.","Venlafaxine does not help smoking cessation and can raise blood pressure."],"dsm":"DSM-5-TR Major depressive disorder: Criterion A (5 or more of 9 symptoms for 2 weeks, including depressed mood or anhedonia), B (distress or impairment), C (not due to a substance or medical condition).","icd":"ICD-11 6A70 Single episode depressive disorder. Criteria are closely similar to DSM-5-TR.","refs":"APA practice guideline for the treatment of patients with major depressive disorder (3rd ed., 2010); FDA prescribing information for bupropion.","check":"","review":"pending"},{"id":"psy2-s3-21","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Anxiolytics","stem":"A 45-year-old long-distance truck driver comes for follow-up of generalized anxiety disorder. After 12 weeks of escitalopram at a full dose, he worries less but still feels tense and on edge most days. He has alcohol use disorder, in sustained remission for 3 years. He asks for an added medication that will not make him drowsy at the wheel or lead to dependence. His physician adds a drug, explains that it must be taken regularly 2 or 3 times a day rather than when anxious, and says that the full effect will take 2 to 4 weeks. Vital signs and physical examination are normal.","question":"The medication most likely chosen acts mainly by which of the following mechanisms?","options":["Alpha-2 adrenergic receptor agonism","Beta-adrenergic receptor antagonism","GABA-A receptor positive allosteric modulation","Histamine H1 receptor antagonism","Serotonin 5-HT1A receptor partial agonism"],"answer":4,"explanation":"Buspirone, a 5-HT1A partial agonist, is approved for generalized anxiety disorder and can be used alone or to augment an SSRI. It takes 2 to 4 weeks to work, must be taken regularly, and does not cause sedation, dependence or withdrawal; the label still advises avoiding alcohol. It does not treat panic disorder. Side effects include dizziness, headache and nausea. Benzodiazepines should be avoided in people with a history of substance use disorder.","why":["Alpha-2 agonists such as clonidine are used for ADHD and opioid withdrawal, not GAD.","Beta blockers ease physical symptoms of performance anxiety but do not treat GAD.","Benzodiazepines act here but cause sedation and dependence and are risky after alcohol use disorder.","Hydroxyzine, an H1 antagonist, is sedating and acts within hours.","Correct: buspirone is a partial agonist at serotonin 5-HT1A receptors, with no sedation or dependence and a delayed onset."],"dsm":"DSM-5-TR Generalized anxiety disorder: Criterion A (excessive anxiety and worry on more days than not for at least 6 months), B (hard to control), C (3 or more of 6 symptoms), D (distress or impairment).","icd":"ICD-11 6B00 Generalised anxiety disorder. Difference: ICD-11 requires symptoms for at least several months rather than a fixed 6 months and allows general apprehension without specific worries.","refs":"FDA prescribing information for buspirone; Bandelow et al., WFSBP guidelines for the pharmacological treatment of anxiety disorders (2022).","check":"","review":"pending"},{"id":"psy2-s3-22","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Anxiolytics","stem":"An 81-year-old woman is brought to her physician by her son because of increasing daytime drowsiness, unsteadiness and confusion over the past 3 weeks. Yesterday she fell in her bathroom. Three weeks ago, she started taking diazepam 10 mg at bedtime for sleep, prescribed by another physician. Her symptoms have worsened each week even though the dose has not changed. She takes no other new medications. Temperature, pulse and blood pressure are normal. She is drowsy but oriented and has an unsteady gait. Laboratory studies, including serum electrolytes, glucose and renal and liver function tests, are normal for her age.","question":"Which of the following properties of this drug best explains her symptoms?","options":["High first-pass hepatic metabolism","Inhibition of cytochrome P450 3A4","Long-lived active metabolites","Renal excretion as unchanged drug","Zero-order elimination kinetics"],"answer":2,"explanation":"Diazepam undergoes oxidation in the liver to active metabolites, including desmethyldiazepam, whose half-life can exceed 100 hours in older adults. With nightly dosing, levels rise for weeks, causing sedation, ataxia, confusion and falls. In older adults and in liver disease, benzodiazepines are best avoided; if one is essential, lorazepam, oxazepam or temazepam are preferred because they are conjugated directly and have no active metabolites. The drug should be tapered.","why":["High first-pass metabolism would lower drug levels, not raise them.","Diazepam is a substrate of cytochrome P450 enzymes, not an inhibitor.","Correct: diazepam and its active metabolite desmethyldiazepam have very long half-lives, which are even longer in older adults, so they accumulate.","Diazepam is metabolized in the liver; lithium is an example of a drug excreted unchanged by the kidneys.","Zero-order kinetics applies to drugs such as alcohol and phenytoin at high doses, not diazepam."],"dsm":"Not a diagnostic question (adverse drug effect). If it causes confusion with impaired attention, DSM-5-TR criteria for medication-induced delirium apply.","icd":"Not a diagnostic question; coded as an adverse effect of benzodiazepines in ICD-11 chapter 22.","refs":"American Geriatrics Society Beers Criteria (2023); Katzung's Basic and Clinical Pharmacology (16th ed.).","check":"","review":"pending"},{"id":"psy2-s3-23","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Mood stabilizers","stem":"A 27-year-old woman with bipolar I disorder has taken valproate for 2 years. Because of recurrent depressive episodes, her physician added lamotrigine at the starting dose and titration schedule recommended for patients not taking other interacting drugs. Two weeks later, she comes to the emergency department with fever, painful sores in her mouth and on her lips, red eyes and a spreading rash of dusky target-like lesions with some blistering over her trunk. She takes no other medications.","question":"Which of the following most likely contributed to this reaction?","options":["Additive bone marrow suppression","Displacement of lamotrigine from plasma albumin","Induction of lamotrigine metabolism by valproate","Inhibition of lamotrigine glucuronidation by valproate","Lamotrigine-induced inhibition of valproate metabolism"],"answer":3,"explanation":"Fever, mucosal ulceration and blistering target lesions indicate Stevens-Johnson syndrome or toxic epidermal necrolysis. The risk with lamotrigine rises with high starting doses, rapid titration and use with valproate, which inhibits lamotrigine's glucuronidation and roughly doubles its half-life. With valproate, lamotrigine must be started at half the usual dose and titrated more slowly. Lamotrigine should be stopped at once and the patient treated in a burns or intensive care unit.","why":["Bone marrow suppression does not cause mucocutaneous blistering.","Protein-binding displacement has only a short-lived effect on free drug levels.","Valproate inhibits rather than induces lamotrigine metabolism.","Correct: valproate roughly doubles lamotrigine levels, so the dose must be halved and titrated more slowly.","Lamotrigine does not significantly raise valproate levels."],"dsm":"DSM-5-TR Bipolar I disorder: at least 1 manic episode (Criterion A of mania: abnormally elevated, expansive or irritable mood and increased energy for at least 1 week, with 3 or more additional symptoms, or 4 if mood is only irritable).","icd":"ICD-11 6A60 Bipolar type I disorder. Difference: ICD-11 makes increased activity or energy a required core feature of mania, as DSM-5-TR also now does.","refs":"FDA prescribing information for lamotrigine (boxed warning on serious skin rashes).","check":"","review":"pending"},{"id":"psy2-s3-24","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Psychotherapies","stem":"A 47-year-old man is seen in his physician's office for a routine visit. He drinks about 6 bottles of beer every evening. His serum gamma-glutamyl transferase level is elevated. When the physician mentions the result, he says, 'I know I drink more than I should, but it is the only way I can relax after work.' He has never tried to cut down. He is not in withdrawal and has no thoughts of self-harm. The physician wants to use a motivational interviewing approach.","question":"Which of the following responses by the physician best fits this approach?","options":["\"If you keep drinking at this rate, your liver will fail within a few years.\"","\"It sounds like drinking helps you unwind, but part of you worries about it.\"","\"Many of my patients find that exercise is a healthier way to relax.\"","\"Why don't you just switch to soft drinks when you get home from work?\"","\"You need to attend Alcoholics Anonymous meetings starting this week.\""],"answer":1,"explanation":"Motivational interviewing is a collaborative, patient-centered style that helps people resolve ambivalence about change. Its core skills are open questions, affirmations, reflections and summaries (OARS). Reflecting both sides of ambivalence encourages the patient to voice his own reasons for change ('change talk'). Arguing, labeling, lecturing and giving unrequested advice cause resistance. It is useful in the contemplation stage of change, as here.","why":["Warnings that aim to frighten tend to increase resistance.","Correct: a double-sided reflection states both sides of his ambivalence without judgment.","This sounds supportive but is unrequested advice, which tends to provoke resistance.","Giving advice before he is ready, known as the 'righting reflex', tends to increase resistance.","Directing him to a treatment before he is ready is not patient-centered."],"dsm":"Not a diagnostic question (psychotherapy technique). The underlying condition is assessed with DSM-5-TR criteria for alcohol use disorder: 2 or more of 11 criteria within 12 months.","icd":"Not a diagnostic question. ICD-11 would assess him under 6C40.1 Harmful pattern of use of alcohol or 6C40.2 Alcohol dependence.","refs":"Miller and Rollnick, Motivational Interviewing: Helping People Change and Grow (4th ed., 2023); USPSTF recommendation on screening and counseling for unhealthy alcohol use (2018).","check":"","review":"pending"},{"id":"psy2-s3-25","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Psychotherapies","stem":"A 30-year-old woman with major depressive disorder is in weekly therapy. When she received a negative comment on a work report, she thought, 'I am a complete failure.' Her therapist asks her to write this thought down, rate how strongly she believes it, list the evidence for and against it, and then write a more balanced alternative thought. She is asked to repeat this exercise whenever her mood drops suddenly. Her therapist also explains how thoughts, feelings and behavior affect one another.","question":"Which of the following techniques is the therapist using?","options":["Behavioral activation","Biofeedback","Cognitive restructuring","Free association","Systematic desensitization"],"answer":2,"explanation":"In cognitive behavioral therapy, cognitive restructuring teaches patients to recognize automatic negative thoughts, identify thinking errors (here, overgeneralization and all-or-nothing thinking), examine the evidence and create balanced alternatives. A thought record is the usual tool. Combined with behavioral activation, CBT is a first-line treatment for depression of mild to moderate severity and, with medication, for severe depression.","why":["Behavioral activation schedules rewarding and meaningful activities to lift mood.","Biofeedback uses physiological monitoring to teach control of bodily responses such as muscle tension.","Correct: identifying automatic negative thoughts, testing the evidence and creating balanced alternatives is the core cognitive technique of CBT.","Free association is a psychodynamic technique in which the patient says whatever comes to mind.","Systematic desensitization pairs relaxation with gradual exposure to feared situations, mainly for phobias."],"dsm":"Not a diagnostic question (psychotherapy technique). The underlying diagnosis uses DSM-5-TR criteria for major depressive disorder: 5 or more of 9 symptoms for 2 weeks.","icd":"Not a diagnostic question. ICD-11 would code the underlying condition as 6A70 or 6A71 depressive disorder.","refs":"Beck, Cognitive Behavior Therapy: Basics and Beyond (3rd ed., 2020); American Psychological Association clinical practice guideline for the treatment of depression (2019).","check":"","review":"pending"},{"id":"psy2-s4-01","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Antipsychotics","stem":"A 26-year-old man with schizophrenia is seen on the inpatient unit 10 days after starting haloperidol. His hallucinations are improving, but for the past 4 days he has been unable to sit through meals or group therapy. He paces the corridor, shifts his weight from foot to foot when standing and says he feels 'tense inside, like I have to keep moving.' He is distressed and asks to stop the medication. Temperature is 36.8°C (98.2°F), pulse is 84/min and blood pressure is 122/78 mm Hg. There is no rigidity, tremor or abnormal posturing. Serum creatine kinase is normal.","question":"In addition to reducing the haloperidol dose, which of the following is the most appropriate pharmacotherapy?","options":["Amantadine","Benztropine","Bromocriptine","Dantrolene","Propranolol"],"answer":4,"explanation":"Subjective inner restlessness with restless movements, starting days to weeks after starting or increasing an antipsychotic, is acute akathisia. It is distressing, reduces adherence and can increase the risk of suicide or aggression. Management is to lower the dose or switch to a drug with lower risk, and to add propranolol; mirtazapine at low dose or a benzodiazepine are alternatives. It must not be mistaken for worsening psychosis.","why":["Amantadine is used for drug-induced parkinsonism and has little evidence in akathisia.","Anticholinergics are less effective for akathisia unless parkinsonism is also present.","Bromocriptine is used in neuroleptic malignant syndrome and may worsen psychosis.","Dantrolene is used for severe hyperthermia and rigidity, which he does not have.","Correct: a low-dose lipophilic beta blocker is the best-established treatment for akathisia."],"dsm":"DSM-5-TR Medication-induced acute akathisia (in 'Medication-induced movement disorders and other adverse effects of medication'): subjective restlessness with observed excessive movement, developing within a few weeks of starting or raising a medication. It is not a mental disorder.","icd":"ICD-11 codes drug-induced akathisia as an adverse drug effect in the nervous system chapter, not as a mental disorder.","refs":"APA practice guideline for the treatment of patients with schizophrenia (3rd ed., 2020).","check":"","review":"pending"},{"id":"psy2-s4-02","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Antipsychotics","stem":"A 58-year-old woman with schizoaffective disorder has received haloperidol decanoate injections every 4 weeks for 10 years, and her illness has been stable for 6 years. Her daughter has noticed repetitive lip smacking, chewing movements and tongue thrusting for the past 6 months, as well as writhing movements of her fingers. The movements are worse when she is anxious and stop when she sleeps. They are embarrassing her at church. She has no rigidity or tremor. She does not want to risk a relapse of psychosis.","question":"Which of the following is the most appropriate pharmacotherapy for her movements?","options":["Benztropine","Diphenhydramine","Increase haloperidol dose","Propranolol","Valbenazine"],"answer":4,"explanation":"Involuntary choreoathetoid movements of the mouth, tongue and limbs after months or years of dopamine-blocking drugs indicate tardive dyskinesia, linked to upregulated, supersensitive dopamine D2 receptors. Prevention is the lowest effective dose and regular screening with the Abnormal Involuntary Movement Scale (AIMS). For moderate to severe or disabling tardive dyskinesia, a VMAT2 inhibitor is recommended. Switching to clozapine is another option.","why":["Anticholinergics do not help and may worsen tardive dyskinesia.","Anticholinergic antihistamines do not help and may worsen tardive dyskinesia.","A higher dose may mask the movements briefly but worsens the underlying problem.","Propranolol treats akathisia and tremor, not tardive dyskinesia.","Correct: VMAT2 inhibitors (valbenazine or deutetrabenazine) reduce tardive dyskinesia."],"dsm":"DSM-5-TR Tardive dyskinesia (in 'Medication-induced movement disorders'): involuntary athetoid or choreiform movements developing after at least a few months of antipsychotic use (1 month in older adults). It is not a mental disorder.","icd":"ICD-11 codes tardive dyskinesia as a drug-induced movement disorder in the nervous system chapter, not as a mental disorder.","refs":"APA practice guideline for the treatment of patients with schizophrenia (3rd ed., 2020); FDA prescribing information for valbenazine.","check":"","review":"pending"},{"id":"psy2-s4-03","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Mood stabilizers","stem":"A 44-year-old man with bipolar I disorder has been well on lithium for 8 years. For the past year he has passed large volumes of urine, getting up 3 times a night, and drinks about 5 L (1.3 gal) of water a day. Serum lithium level is 0.7 mEq/L, sodium is 146 mEq/L, glucose is 92 mg/dL and creatinine is 1.0 mg/dL. Urine osmolality is 150 mOsm/kg and does not increase after a dose of desmopressin. TSH is normal. He has had 3 manic episodes when off lithium and wants to continue it.","question":"Which of the following is the most appropriate pharmacotherapy for his polyuria?","options":["Amiloride","Demeclocycline","Desmopressin","Hydrochlorothiazide","Indomethacin"],"answer":0,"explanation":"Polyuria with dilute urine that does not concentrate after desmopressin indicates nephrogenic diabetes insipidus, the commonest renal effect of long-term lithium. Lithium enters collecting duct cells through epithelial sodium channels (ENaC) and impairs aquaporin-2 expression. If lithium must continue, amiloride is preferred. Lithium also causes hypothyroidism, hyperparathyroidism and, with long use, chronic kidney disease, so monitor renal, thyroid and calcium levels.","why":["Correct: amiloride blocks lithium entry into collecting duct cells through ENaC and improves concentrating ability without raising lithium levels much.","Demeclocycline itself causes nephrogenic diabetes insipidus.","His kidneys do not respond to desmopressin.","Thiazides reduce polyuria but raise lithium levels by up to 40 percent, risking toxicity.","NSAIDs reduce polyuria but raise lithium levels and can harm the kidneys, so they are not preferred."],"dsm":"Not a diagnostic question (adverse drug effect). Underlying diagnosis: DSM-5-TR Bipolar I disorder, requiring at least 1 manic episode.","icd":"Not a diagnostic question. Underlying diagnosis: ICD-11 6A60 Bipolar type I disorder.","refs":"Gitlin, 'Lithium side effects and toxicity: prevalence and management strategies', International Journal of Bipolar Disorders (2016).","check":"","review":"pending"},{"id":"psy2-s4-04","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Mood stabilizers","stem":"A 28-year-old woman with bipolar I disorder comes to the clinic because a home pregnancy test is positive. Her last menstrual period was 7 weeks ago. She has taken lithium for 4 years after 2 severe manic episodes with psychotic features, one of which needed admission for 6 weeks. She has been well since. She is worried about the effects of lithium on her baby and asks about the main risk of continuing it during the first trimester. She takes no other medications and does not drink alcohol or smoke.","question":"First-trimester exposure to this drug is most strongly associated with which of the following fetal abnormalities?","options":["Atrial septal defect","Cleft lip and palate","Ebstein anomaly","Neural tube defect","Tetralogy of Fallot"],"answer":2,"explanation":"Lithium in the first trimester modestly increases the risk of cardiac malformations, including Ebstein anomaly; the absolute risk is small. Stopping lithium carries a high risk of relapse, especially after delivery. The decision is shared, weighing her severe history. If lithium continues, use the lowest effective dose, monitor levels often (clearance rises in pregnancy and falls at delivery) and offer fetal echocardiography. Valproate should be avoided.","why":["Atrial septal defects are not specifically linked with lithium.","Oral clefts have been linked with topiramate and other drugs, not lithium.","Correct: lithium is associated with cardiac malformations, classically Ebstein anomaly (downward displacement of the tricuspid valve).","Neural tube defects are associated with valproate and carbamazepine.","Tetralogy of Fallot is not specifically linked with lithium."],"dsm":"Not a diagnostic question. Underlying diagnosis: DSM-5-TR Bipolar I disorder, with at least 1 manic episode; specifier 'with psychotic features' for past episodes.","icd":"Not a diagnostic question. Underlying diagnosis: ICD-11 6A60 Bipolar type I disorder.","refs":"Patorno et al., 'Lithium use in pregnancy and the risk of cardiac malformations', New England Journal of Medicine (2017); ACOG Clinical Practice Guideline No. 5: Treatment and management of mental health conditions during pregnancy and postpartum (2023).","check":"","review":"pending"},{"id":"psy2-s4-05","subj":"Psychiatry","sec":"Mood disorders","topic":"Bipolar disorders","stem":"A 24-year-old woman comes to the clinic because her moods 'go up and down all the time.' For the past 3 years, she has had periods of 2 to 3 days when she sleeps only 4 hours yet feels rested, feels unusually confident and talkative and starts several projects, without problems at work. These alternate with periods of 1 to 2 weeks of low mood, tiredness and poor concentration, with 3 depressive symptoms at most. She has never gone more than a month without one of these periods. She has never needed hospital care and has had no psychotic symptoms. She has stable relationships, no self-harm and a consistent sense of who she is. TSH and a urine drug screen are normal.","question":"Which of the following is the most likely diagnosis?","options":["Bipolar I disorder","Bipolar II disorder","Borderline personality disorder","Cyclothymic disorder","Persistent depressive disorder"],"answer":3,"explanation":"Cyclothymic disorder is at least 2 years (1 year in children and adolescents) of many periods of hypomanic symptoms and depressive symptoms that do not meet criteria for hypomanic, manic or major depressive episodes, with symptoms present at least half the time and no symptom-free period longer than 2 months. Up to half of patients later develop bipolar I or II disorder. Mood stabilizers and psychotherapy are used.","why":["Bipolar I disorder requires a manic episode of at least 1 week or needing hospital care.","Bipolar II disorder requires a major depressive episode and a hypomanic episode of at least 4 days.","She has no unstable relationships, self-harm or identity disturbance.","Correct: at least 2 years of hypomanic and depressive symptoms that never meet criteria for full episodes.","Persistent depressive disorder does not include periods of hypomanic symptoms."],"dsm":"DSM-5-TR Cyclothymic disorder: Criterion A (2 years of numerous periods of hypomanic and depressive symptoms not meeting episode criteria), B (present at least half the time, never symptom-free for more than 2 months), C (criteria for major depressive, manic or hypomanic episodes never met).","icd":"ICD-11 6A62 Cyclothymic disorder: at least 2 years of mood instability with many hypomanic and depressive periods. Criteria are similar to DSM-5-TR.","refs":"American Psychiatric Association, DSM-5-TR (2022), Bipolar and related disorders chapter.","check":"","review":"pending"},{"id":"psy2-s4-06","subj":"Psychiatry","sec":"Mood disorders","topic":"Bipolar disorders","stem":"A 31-year-old woman with bipolar I disorder comes to the clinic because of 5 weeks of low mood, loss of interest, sleeping 11 hours a day, poor concentration and guilt. She has no thoughts of self-harm. Her last manic episode was 14 months ago and was treated in hospital; she has taken no medication since discharge. She has no psychotic symptoms. She has a BMI of 31 kg/m² and is worried about weight gain. She is not pregnant and uses an intrauterine device. TSH and a complete blood count are normal.","question":"Which of the following is the most appropriate pharmacotherapy?","options":["Aripiprazole","Bupropion","Escitalopram","Lurasidone","Venlafaxine"],"answer":3,"explanation":"Depression is the dominant phase of bipolar disorder. Approved treatments for bipolar I depression include quetiapine, lurasidone, cariprazine, lumateperone and olanzapine with fluoxetine; lithium and lamotrigine are also used, mainly for maintenance. Antidepressants alone can cause a switch to mania or rapid cycling and should be avoided. Her weight concern favors lurasidone or cariprazine over quetiapine.","why":["Aripiprazole treats mania and prevents relapse but was not effective in trials for bipolar depression.","Antidepressant monotherapy in bipolar I disorder risks switching to mania and is not recommended.","Antidepressant monotherapy in bipolar I disorder risks switching to mania and is not recommended.","Correct: lurasidone is approved for bipolar depression and causes little weight gain.","Venlafaxine carries the highest risk of switching to mania among antidepressants."],"dsm":"DSM-5-TR Bipolar I disorder, current episode depressed: at least 1 lifetime manic episode, and a current major depressive episode (5 or more of 9 symptoms for 2 weeks).","icd":"ICD-11 6A60 Bipolar type I disorder, with the current depressive episode, its severity and any psychotic symptoms coded as a subcategory. Criteria are similar to DSM-5-TR.","refs":"CANMAT and ISBD guidelines for the management of patients with bipolar disorder (2018); FDA prescribing information for lurasidone.","check":"","review":"pending"},{"id":"psy2-s4-07","subj":"Psychiatry","sec":"Anxiety and related disorders","topic":"Adjustment disorder","stem":"A 56-year-old woman comes to her physician 14 months after her 24-year-old son died in a motor vehicle collision. Every day, she feels an intense longing for him and spends hours thinking about him. She feels that part of her died with him, cannot believe he is gone and avoids his bedroom and the road where he died. She has stopped singing in her church choir and has not returned to work. Her pastor says her grief is much longer and more intense than others in their community. She sleeps and eats normally, does not feel worthless and has no thoughts of self-harm.","question":"Which of the following is the most likely diagnosis?","options":["Adjustment disorder with depressed mood","Major depressive disorder","Normal bereavement","Persistent depressive disorder","Prolonged grief disorder"],"answer":4,"explanation":"Prolonged grief disorder, added to DSM-5-TR, is grief that persists at least 12 months after a death (6 months in children), with daily yearning or preoccupation and 3 or more symptoms such as identity disruption, disbelief, avoidance, intense emotional pain, numbness, meaninglessness or loneliness. It exceeds cultural norms and impairs functioning. Treatment is grief-focused psychotherapy, such as prolonged grief disorder therapy. Antidepressants alone are not effective.","why":["Prolonged grief disorder takes precedence when its specific criteria are met.","She lacks the pervasive low mood, sleep and appetite change and worthlessness of a major depressive episode.","Her grief exceeds cultural norms, lasts over 12 months and impairs her functioning.","Persistent depressive disorder needs 2 years of depressed mood.","Correct: intense yearning and preoccupation with the deceased for at least 12 months, with identity disruption, disbelief and avoidance."],"dsm":"DSM-5-TR Prolonged grief disorder: Criterion A (death at least 12 months ago, 6 months for children), B (yearning or preoccupation nearly every day), C (3 or more of 8 symptoms), D (distress or impairment), E (exceeds social, cultural or religious norms).","icd":"ICD-11 6B42 Prolonged grief disorder. Difference: ICD-11 requires only 6 months after the loss and fewer specific symptoms.","refs":"Prigerson et al., 'Validation of the new DSM-5-TR criteria for prolonged grief disorder', World Psychiatry (2021); Shear et al., JAMA Psychiatry (2016).","check":"","review":"pending"},{"id":"psy2-s4-08","subj":"Psychiatry","sec":"Anxiety and related disorders","topic":"Phobias","stem":"A 26-year-old accountant comes to his physician because he has turned down a promotion that would involve presenting to clients. For 3 years, since starting his job, he has felt intense fear before meetings, eating in the office cafeteria and speaking on the phone in front of colleagues, because he worries he will blush, stammer and be judged as incompetent. He avoids these situations when he can. He has close friends, plays soccer with them weekly and is in a 2-year relationship. He has never had a sudden attack of fear that came on without a trigger. He does not drink alcohol.","question":"Which of the following is the most likely diagnosis?","options":["Agoraphobia","Avoidant personality disorder","Panic disorder","Schizoid personality disorder","Social anxiety disorder"],"answer":4,"explanation":"Social anxiety disorder is a marked fear of social situations in which the person may be scrutinized or embarrassed, lasting at least 6 months, with avoidance and impairment. The specifier 'performance only' applies if the fear is limited to speaking or performing in public. First-line treatment is CBT and/or an SSRI or SNRI. Propranolol taken before an event is useful only for performance-only anxiety.","why":["Agoraphobia is fear of situations where escape might be difficult, such as crowds and public transport.","Avoidant personality disorder is a pervasive pattern from early adulthood across almost all relationships; he has close friends and a partner.","He has no unexpected panic attacks.","He wants and has close relationships.","Correct: marked fear of social and performance situations in which he may be scrutinized, with avoidance, for 6 months or more."],"dsm":"DSM-5-TR Social anxiety disorder: Criterion A (marked fear of social situations with possible scrutiny), B (fear of negative evaluation), C to E (situations almost always provoke fear and are avoided; fear out of proportion), F (6 months or more), G (distress or impairment).","icd":"ICD-11 6B04 Social anxiety disorder. Difference: ICD-11 requires symptoms for at least several months rather than a fixed 6 months.","refs":"NICE guideline CG159: Social anxiety disorder.","check":"","review":"pending"},{"id":"psy2-s4-09","subj":"Psychiatry","sec":"Anxiety and related disorders","topic":"Obsessive-compulsive disorder","stem":"A 22-year-old man is referred by a plastic surgeon whom he consulted about rhinoplasty. For 4 years, he has been convinced that his nose is 'huge and crooked.' He spends 3 to 4 hours a day checking it in mirrors, comparing it with other people's noses and taking photographs of it from different angles. He wears a face mask outside, has stopped dating and has left college. He agrees that his nose 'might not be as bad as I think.' Examination shows a normal, symmetrical nose.","question":"Which of the following is the most likely diagnosis?","options":["Avoidant personality disorder","Body dysmorphic disorder","Delusional disorder, somatic type","Illness anxiety disorder","Social anxiety disorder"],"answer":1,"explanation":"Body dysmorphic disorder is preoccupation with perceived defects in appearance that others cannot see or find slight, with repetitive behaviors (mirror checking, grooming, seeking reassurance) or mental acts (comparing). It is classified with OCD and related disorders. Cosmetic surgery rarely helps and often worsens symptoms. Treatment is CBT with exposure and response prevention and/or an SSRI at higher doses. Suicide risk is high and should be assessed.","why":["His avoidance stems from a belief about his appearance, not a general fear of rejection.","Correct: preoccupation with a perceived flaw that is not observable, with repetitive checking and comparing.","He has fair insight; even with absent insight, the diagnosis is body dysmorphic disorder with a specifier, not delusional disorder.","Illness anxiety disorder is fear of having a serious illness.","His social avoidance results from his preoccupation with his nose."],"dsm":"DSM-5-TR Body dysmorphic disorder: Criterion A (preoccupation with perceived defects not observable or slight to others), B (repetitive behaviors or mental acts), C (distress or impairment), D (not better explained by eating disorder concerns about weight); insight specifier (good or fair, poor, absent or delusional).","icd":"ICD-11 6B21 Body dysmorphic disorder, with insight specifiers. Criteria are closely similar to DSM-5-TR.","refs":"NICE guideline CG31: Obsessive-compulsive disorder and body dysmorphic disorder.","check":"","review":"pending"},{"id":"psy2-s4-10","subj":"Psychiatry","sec":"Anxiety and related disorders","topic":"Obsessive-compulsive disorder","stem":"A 14-year-old girl is brought to her physician by her mother because of patchy hair loss over the past 6 months. The girl admits that she pulls out hair from her scalp, mostly while reading or watching television. She feels a build-up of tension before pulling and relief afterward, and she has tried many times to stop. She is embarrassed and wears a headscarf to hide the patches. She has no other repetitive behaviors. Examination shows irregular patches of hair loss on the crown, with broken hairs of different lengths and no scarring or scaling.","question":"Which of the following is the most appropriate initial treatment?","options":["Clomipramine","Fluoxetine","Habit reversal training","Olanzapine","Topical minoxidil solution"],"answer":2,"explanation":"Recurrent hair pulling causing hair loss, with repeated attempts to stop and distress, is trichotillomania (hair-pulling disorder), one of the OCD-related disorders. Examination shows broken hairs of varying lengths without scarring. First-line treatment is habit reversal training, often as part of CBT. N-acetylcysteine has some evidence; SSRIs are used for coexisting anxiety or depression. Ask about swallowing hair, which can cause a trichobezoar.","why":["Clomipramine has limited evidence and more adverse effects; it is not first-line.","SSRIs have inconsistent evidence for this disorder.","Correct: this behavioral therapy (awareness training and a competing response) is first-line.","Olanzapine has very limited evidence and significant adverse effects.","Minoxidil treats androgenic alopecia, not hair loss from pulling."],"dsm":"DSM-5-TR Trichotillomania (hair-pulling disorder): Criterion A (recurrent pulling causing hair loss), B (repeated attempts to stop), C (distress or impairment), D and E (not due to another medical condition or mental disorder).","icd":"ICD-11 6B25.0 Trichotillomania, within body-focused repetitive behaviour disorders. Criteria are closely similar to DSM-5-TR.","refs":"Grant and Chamberlain, 'Trichotillomania', American Journal of Psychiatry (2016).","check":"","review":"pending"},{"id":"psy2-s4-11","subj":"Psychiatry","sec":"Substance-related disorders","topic":"Stimulants","stem":"A 27-year-old man is brought to the clinic by his sister because he has slept for up to 16 hours a day for the past 3 days. He is eating large amounts and says he feels 'empty, flat and useless,' with strong cravings. His sister says he had spent the previous 5 days barely sleeping and smoking a substance from a glass pipe with friends. He has no thoughts of self-harm. Temperature is 36.7°C (98.1°F), pulse is 62/min and blood pressure is 112/70 mm Hg. Pupils are 4 mm and reactive. He is drowsy but oriented. A urine drug screen is positive for benzoylecgonine.","question":"Which of the following is the most likely diagnosis?","options":["Cocaine intoxication","Cocaine withdrawal","Major depressive disorder","Narcolepsy","Opioid withdrawal"],"answer":1,"explanation":"Benzoylecgonine is a cocaine metabolite. Stopping after heavy use causes withdrawal within hours to days: dysphoria with fatigue, vivid unpleasant dreams, hypersomnia or insomnia, increased appetite and psychomotor change. It is not life-threatening, but depression and suicidal thinking can be severe, so risk must be assessed. Treatment is supportive, with psychosocial interventions such as contingency management for cocaine use disorder; no medication is approved.","why":["Intoxication causes euphoria, tachycardia, hypertension, dilated pupils and agitation.","Correct: a 'crash' of low mood, fatigue, hypersomnia, increased appetite and craving after stopping heavy use.","His symptoms began on stopping cocaine and have lasted only days.","Narcolepsy is a chronic disorder, not one that begins after a binge.","Opioid withdrawal causes yawning, dilated pupils, rhinorrhea, diarrhea and piloerection."],"dsm":"DSM-5-TR Stimulant withdrawal: Criterion A (stopping or reducing prolonged use), B (dysphoric mood and 2 or more of fatigue, vivid unpleasant dreams, insomnia or hypersomnia, increased appetite, psychomotor slowing or agitation), C (distress or impairment).","icd":"ICD-11 6C45.4 Cocaine withdrawal. Criteria are similar to DSM-5-TR; ICD-11 lists cocaine separately from other stimulants.","refs":"American Psychiatric Association, DSM-5-TR (2022), Substance-related and addictive disorders chapter.","check":"","review":"pending"},{"id":"psy2-s4-12","subj":"Psychiatry","sec":"Substance-related disorders","topic":"Withdrawal management","stem":"A 50-year-old man is seen on the orthopedic unit 3 days after surgery for a hip fracture sustained in a fall. Tonight he became agitated and disoriented to place and time, pulls at his IV line and says insects are crawling on the walls. He is tremulous and sweating. Temperature is 38.2°C (100.8°F), pulse is 124/min and blood pressure is 168/100 mm Hg. His wife says he drinks about a fifth of vodka (750 mL) every day, and his last drink was on the day of admission. Serum glucose, sodium and calcium are normal. A CT scan of the head is normal.","question":"Which of the following is the most likely diagnosis?","options":["Alcohol withdrawal delirium","Alcohol-induced psychotic disorder","Hepatic encephalopathy","Korsakoff syndrome","Wernicke encephalopathy"],"answer":0,"explanation":"Alcohol withdrawal follows a timeline: tremor and anxiety at 6 to 24 hours, hallucinosis at 12 to 48 hours, seizures at 12 to 48 hours, and delirium tremens at 48 to 96 hours. Delirium tremens has a mortality of up to 5 percent if untreated. Treatment is high-dose benzodiazepines titrated to symptoms, intensive monitoring, fluids, electrolytes and intravenous thiamine before glucose. Surgery and admission often mask the early warning signs.","why":["Correct: delirium with autonomic hyperactivity and hallucinations 48 to 96 hours after the last drink indicates delirium tremens.","In alcohol-induced psychotic disorder (hallucinosis), hallucinations occur with a clear sensorium and normal vital signs.","Hepatic encephalopathy causes drowsiness and asterixis, not autonomic hyperactivity.","Korsakoff syndrome is chronic amnesia with confabulation, not acute agitation.","Wernicke encephalopathy causes confusion with ophthalmoplegia and ataxia, without autonomic overactivity."],"dsm":"DSM-5-TR Alcohol withdrawal delirium: criteria for delirium (disturbance in attention and awareness developing over a short period and fluctuating) arising during alcohol withdrawal.","icd":"ICD-11 6C40.5 Alcohol-induced delirium, which includes delirium during alcohol withdrawal. Criteria are equivalent to DSM-5-TR.","refs":"American Society of Addiction Medicine clinical practice guideline on alcohol withdrawal management (2020).","check":"","review":"pending"},{"id":"psy2-s4-13","subj":"Psychiatry","sec":"Child and adolescent psychiatry","topic":"Conduct and oppositional defiant disorders","stem":"A 9-year-old boy is brought to his physician because of severe temper outbursts for the past 18 months. About 4 times a week, at home and at school, he screams, kicks furniture and throws objects in response to minor frustrations, such as being told to turn off a video game. Between outbursts, his parents and teachers describe him as angry and irritable most of the day, nearly every day. The problems began when he was 7. He has never had periods of elevated mood, increased energy or reduced need for sleep. He concentrates well in class. He has no history of trauma.","question":"Which of the following is the most likely diagnosis?","options":["Attention-deficit/hyperactivity disorder","Bipolar I disorder","Disruptive mood dysregulation disorder","Intermittent explosive disorder","Oppositional defiant disorder"],"answer":2,"explanation":"Disruptive mood dysregulation disorder was introduced to reduce the overdiagnosis of bipolar disorder in children with chronic irritability. It requires severe temper outbursts 3 or more times a week, with persistent irritable or angry mood between them, for at least 12 months in at least 2 settings, starting before age 10 and diagnosed between ages 6 and 18. These children tend to develop depression and anxiety, not bipolar disorder. Treatment is CBT and parent training.","why":["He has no inattention or hyperactivity.","He has had no distinct manic episodes.","Correct: severe, frequent temper outbursts with persistently irritable mood between them, starting before age 10.","Intermittent explosive disorder does not include persistent irritability between outbursts.","When criteria for this disorder are met, it takes precedence over oppositional defiant disorder."],"dsm":"DSM-5-TR Disruptive mood dysregulation disorder: Criteria A to C (severe outbursts 3 or more times a week; persistently irritable mood between them), D to E (12 months or more, in 2 or more settings), F and G (diagnosed only between ages 6 and 18, with onset before age 10).","icd":"ICD-11 has no separate category. It is coded as 6C90.0 Oppositional defiant disorder with chronic irritability-anger. Difference: ICD-11 treats this presentation as a subtype of oppositional defiant disorder.","refs":"American Psychiatric Association, DSM-5-TR (2022), Depressive disorders chapter; WHO ICD-11 CDDR (2024).","check":"","review":"pending"},{"id":"psy2-s4-14","subj":"Psychiatry","sec":"Child and adolescent psychiatry","topic":"Conduct and oppositional defiant disorders","stem":"An 8-year-old boy is brought to his physician because of difficult behavior for the past 9 months. He often argues with his parents and grandmother, refuses to follow rules and deliberately annoys his younger sister. He blames others for his mistakes and is often touchy and resentful. The behavior occurs at home and at his grandmother's house. There have been no recent changes at home. He has occasional brief tantrums but is in a good mood most of the day between them. He has not hurt people or animals, destroyed property, stolen or run away. His teacher reports that he pays attention well and completes his work.","question":"Which of the following is the most likely diagnosis?","options":["Adjustment disorder with disturbance of conduct","Conduct disorder","Disruptive mood dysregulation disorder","Oppositional defiant disorder","Specific learning disorder"],"answer":3,"explanation":"Oppositional defiant disorder is a pattern of angry or irritable mood, argumentative or defiant behavior, or vindictiveness lasting at least 6 months, with at least 4 symptoms, shown with at least 1 person who is not a sibling. It differs from conduct disorder, which involves aggression, destruction, deceit or theft. First-line treatment is parent management training. Some children later develop conduct disorder or anxiety and depression.","why":["There is no identifiable stressor, and the pattern has lasted 9 months.","He has not violated others' basic rights or major social rules.","His mood is normal most of the time between brief, infrequent tantrums.","Correct: at least 6 months of angry or irritable mood, argumentative or defiant behavior and vindictiveness.","His schoolwork is good, and learning problems would not explain defiance at home."],"dsm":"DSM-5-TR Oppositional defiant disorder: Criterion A (4 or more symptoms of angry or irritable mood, argumentative or defiant behavior, or vindictiveness for 6 months or more, with at least 1 person who is not a sibling), B (distress or impairment), C (not only during psychosis, substance use, depression or bipolar disorder; DMDD criteria not met).","icd":"ICD-11 6C90 Oppositional defiant disorder, coded 6C90.1 without chronic irritability-anger. Criteria are similar to DSM-5-TR.","refs":"NICE guideline CG158: Antisocial behaviour and conduct disorders in children and young people.","check":"","review":"pending"},{"id":"psy2-s4-15","subj":"Psychiatry","sec":"Child and adolescent psychiatry","topic":"Intellectual disability","stem":"A 30-month-old girl is brought to her pediatrician because she has 'gone backward.' She developed normally until 18 months, when she could say 10 words, feed herself with a spoon and walk independently. Since then, she has stopped speaking, no longer uses her hands to hold objects and constantly wrings her hands in front of her mouth. She has episodes of breath-holding and rapid breathing while awake, and her gait has become broad-based and unsteady. Her head circumference was at the 50th percentile at birth and is now at the 5th percentile. She has no seizures.","question":"Which of the following is the most likely cause of this condition?","options":["CGG repeat expansion in FMR1","Deletion on paternal chromosome 15","Mutation in MECP2","Mutation in TSC2","Trisomy 21"],"answer":2,"explanation":"Normal early development followed by loss of speech and purposeful hand use, stereotyped hand-wringing, breathing irregularities, gait problems and slowing of head growth in a girl indicate Rett syndrome. Most cases are new mutations in the MECP2 gene on the X chromosome. Affected boys usually die in infancy. Most patients later develop severe intellectual disability, and many develop seizures, scoliosis and prolonged QT. Trofinetide is approved for treatment in the US.","why":["Fragile X syndrome affects mainly boys and does not cause regression after normal development.","Prader-Willi syndrome causes neonatal hypotonia, then overeating and obesity.","Correct: Rett syndrome is an X-linked dominant disorder of girls caused by MECP2 mutations.","Tuberous sclerosis causes seizures, skin lesions and cortical tubers.","Down syndrome causes delay from birth with characteristic facial features, not later regression."],"dsm":"DSM-5-TR no longer lists Rett disorder separately. Affected children are diagnosed with intellectual developmental disorder and/or autism spectrum disorder 'associated with a known genetic condition (Rett syndrome)'.","icd":"ICD-11 codes Rett syndrome in the developmental anomalies chapter, with any disorder of intellectual development (6A00) coded alongside. Difference: neither ICD-11 nor DSM-5-TR keeps Rett syndrome as a mental disorder.","refs":"Neul et al., revised diagnostic criteria for Rett syndrome, Annals of Neurology (2010); FDA prescribing information for trofinetide (2023).","check":"","review":"pending"},{"id":"psy2-s4-16","subj":"Psychiatry","sec":"Neurocognitive disorders","topic":"Dementias","stem":"A 72-year-old man is brought to his physician by his wife because of a change in his walking over the past year. He walks slowly with short, shuffling steps, his feet seem 'stuck to the floor' and he has difficulty turning. He has had urinary urgency with episodes of incontinence for 6 months. His wife says he has become slow in thinking and uninterested in his hobbies. There is no tremor at rest, and arm swing is normal. An MRI of the brain shows enlarged lateral ventricles out of proportion to the cortical sulci, with no mass. Urine culture is negative.","question":"Which of the following is the most appropriate next step in management?","options":["Donepezil","High-volume lumbar puncture","Levodopa-carbidopa trial for 3 months","Memantine","Sertraline"],"answer":1,"explanation":"Gait disturbance, urinary incontinence and c
