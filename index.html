e for major depressive disorder; STOP-PD trial (sertraline plus olanzapine for psychotic depression).","check":"","review":"pending"},{"id":"psy2-s2-01","subj":"Psychiatry","sec":"Anxiety and related disorders","topic":"Generalized anxiety disorder","stem":"A 34-year-old high school teacher comes to her physician because she 'cannot switch off.' For the past 8 months she has worried on most days about her finances, her children's safety on the way to school and whether she will be blamed for her students' examination results. She finds the worry hard to control. She feels restless and tense, tires easily, has difficulty concentrating and wakes repeatedly at night. She has had no discrete episodes of sudden intense fear. She drinks 3 to 4 glasses of wine on most weekends 'to relax' and 1 cup of coffee daily. Pulse is 88/min and blood pressure is 124/78 mm Hg. Physical examination shows no abnormalities. TSH, a complete blood count and an ECG are normal. She asks for medication.","question":"Which of the following is the most appropriate first-line pharmacotherapy?","options":["Alprazolam","Escitalopram","Hydroxyzine","Propranolol","Quetiapine"],"answer":1,"explanation":"Excessive, hard-to-control worry about several areas of life on most days for at least 6 months, with restlessness, fatigue, poor concentration, muscle tension and sleep disturbance, indicates generalized anxiety disorder. First-line treatment is cognitive behavioral therapy and/or an SSRI or SNRI, such as escitalopram, sertraline, duloxetine or venlafaxine. Benzodiazepines are reserved for short-term use and are best avoided when alcohol use or dependence risk is present.","why":["Benzodiazepines are second-line and short-term only; her alcohol use increases the risks of dependence and sedation.","Correct: SSRIs and SNRIs are first-line medications for generalized anxiety disorder.","Hydroxyzine has limited evidence and is not first-line; it is sedating and anticholinergic.","Propranolol eases physical symptoms of performance anxiety but does not treat chronic worry.","Quetiapine has some evidence but is not recommended first-line because of metabolic and sedative effects."],"dsm":"DSM-5-TR Generalized anxiety disorder: Criterion A (excessive anxiety and worry more days than not for at least 6 months, about several events or activities), Criterion B (difficult to control), Criterion C (3 or more of restlessness, fatigue, poor concentration, irritability, muscle tension and sleep disturbance).","icd":"ICD-11 6B00 Generalised anxiety disorder: general apprehensiveness or excessive worry about multiple everyday events, more days than not, for at least several months. Difference: ICD-11 does not set a fixed 6-month duration or a minimum count of associated symptoms.","refs":"NICE guideline CG113: Generalised anxiety disorder and panic disorder in adults.","check":"","review":"pending"},{"id":"psy2-s2-02","subj":"Psychiatry","sec":"Anxiety and related disorders","topic":"Panic disorder","stem":"A 28-year-old woman comes to the clinic after her third emergency department visit in 2 months. Each episode began suddenly, without a trigger, with a pounding heartbeat, chest tightness, sweating, trembling, tingling in her fingers and a fear that she was dying. Symptoms peaked within 10 minutes and resolved within 30 minutes. One episode woke her from sleep. She now worries every day about having another attack and has stopped going to the gym for fear of bringing one on. ECGs and troponin levels at each visit were normal, as were a 48-hour Holter recording, TSH and a urine drug screen. She does not drink alcohol and has 1 cup of tea daily. She is referred for psychotherapy.","question":"Her cognitive behavioral therapy is most likely to include which of the following techniques specific to her disorder?","options":["Activity scheduling","Exposure and response prevention","Interoceptive exposure","Sleep restriction","Trauma-focused imaginal exposure"],"answer":2,"explanation":"Recurrent, unexpected panic attacks followed by at least 1 month of persistent worry about further attacks or a maladaptive change in behavior (here, avoiding exercise) indicate panic disorder, once medical and substance causes are excluded. First-line treatment is cognitive behavioral therapy and/or an SSRI or SNRI. CBT for panic disorder includes education about the fight-or-flight response, interoceptive exposure to feared bodily sensations and challenging catastrophic thoughts. Benzodiazepines are short-term only.","why":["Activity scheduling (behavioral activation) is a core technique for depression.","Exposure and response prevention is the core technique for OCD.","Correct: deliberately bringing on feared bodily sensations, such as a racing heart, teaches that they are harmless.","Sleep restriction is a technique of CBT for insomnia.","Imaginal exposure to trauma memories is used in PTSD."],"dsm":"DSM-5-TR Panic disorder: Criterion A (recurrent unexpected panic attacks, each with 4 or more of 13 symptoms, peaking within minutes), Criterion B (1 month or more of persistent concern about further attacks or a maladaptive change in behavior).","icd":"ICD-11 6B01 Panic disorder: recurrent unexpected panic attacks with persistent concern about their recurrence or significance, or behavior intended to avoid them. Difference: ICD-11 sets no fixed 1-month duration or minimum symptom count.","refs":"NICE guideline CG113: Generalised anxiety disorder and panic disorder in adults.","check":"","review":"pending"},{"id":"psy2-s2-03","subj":"Psychiatry","sec":"Anxiety and related disorders","topic":"Phobias","stem":"A 25-year-old nursing student is referred because she cannot complete her phlebotomy training. For as long as she can remember she has felt intense fear at the sight of blood or needles, and she avoids injections even when they are needed. During a supervised blood draw last week her pulse rose to 118/min and then fell to 44/min; she became pale and lost consciousness for about 20 seconds before recovering fully. She has no other fears and no panic attacks in other situations. Physical examination, an ECG and an echocardiogram are normal. She wants to continue her training.","question":"Which of the following is the most appropriate intervention?","options":["Alprazolam before procedures","Applied tension and exposure","Muscle relaxation and exposure","Propranolol before procedures","Sertraline daily"],"answer":1,"explanation":"Blood-injection-injury phobia is the only specific phobia with a diphasic response: an initial rise in heart rate and blood pressure followed by a vasovagal drop that can cause fainting. Treatment is graded exposure combined with applied tension, in which the person tenses the muscles of the arms, legs and trunk to raise blood pressure and prevent fainting during exposure.","why":["Benzodiazepines may give short-term relief but do not treat the phobia and could worsen hypotension.","Correct: applied tension prevents fainting, and graded exposure treats the phobia.","Relaxation lowers blood pressure further and can increase fainting in this phobia.","Beta blockers could worsen the bradycardia and fall in blood pressure that cause fainting.","Medication is not first-line for specific phobia."],"dsm":"DSM-5-TR Specific phobia, blood-injection-injury type (fear of seeing blood, needles or invasive procedures): Criteria A–G, including marked fear out of proportion to the danger, active avoidance and duration of 6 months or more.","icd":"ICD-11 6B03 Specific phobia: marked and excessive fear of specific objects or situations, with avoidance, lasting at least several months. Difference: ICD-11 uses 'several months' rather than a fixed 6 months.","refs":"","check":"","review":"pending"},{"id":"psy2-s2-04","subj":"Psychiatry","sec":"Anxiety and related disorders","topic":"Obsessive-compulsive disorder","stem":"A 22-year-old nursing student comes to the clinic because she spends 4 hours a day washing her hands and checking that she has not contaminated equipment. She has intrusive thoughts that she will spread germs to patients, and the anxiety settles only after repeated washing. She recognizes that the thoughts are excessive but cannot stop them. Her hands are cracked and bleeding, and she has missed several lectures. She has no tics, no history of mood episodes and no psychotic symptoms. Her Yale-Brown Obsessive Compulsive Scale score is 28 (severe). She has started exposure and response prevention and agrees to add a medication.","question":"Which of the following is the most appropriate medication?","options":["Bupropion","Desipramine","Nortriptyline","Sertraline","Trazodone"],"answer":3,"explanation":"Obsessions (intrusive, unwanted thoughts causing anxiety) and compulsions (repetitive acts to reduce that anxiety) taking more than 1 hour a day, with good insight, indicate obsessive-compulsive disorder. First-line treatment is exposure and response prevention and/or an SSRI, such as sertraline, fluoxetine or fluvoxamine. SSRIs often need higher doses and 8 to 12 weeks for a full trial. Only strongly serotonergic drugs work in OCD: clomipramine is effective, but noradrenergic tricyclics are not. Augmentation with a low-dose antipsychotic is used in resistant cases.","why":["Bupropion, which acts on noradrenaline and dopamine, has no proven benefit in OCD.","Desipramine, a noradrenergic tricyclic, is ineffective in OCD, unlike the serotonergic clomipramine.","Nortriptyline, a noradrenergic tricyclic, is ineffective in OCD.","Correct: SSRIs are first-line medications for OCD, often at higher doses than for depression.","Trazodone has no proven benefit in OCD."],"dsm":"DSM-5-TR Obsessive-compulsive disorder: Criterion A (obsessions, compulsions or both), Criterion B (time-consuming, for example more than 1 hour a day, or causing marked distress or impairment); specifier 'with good or fair insight'.","icd":"ICD-11 6B20 Obsessive-compulsive disorder: persistent obsessions and/or compulsions that are time-consuming (for example, more than an hour a day) or cause significant distress or impairment. Criteria are closely similar to DSM-5-TR.","refs":"APA practice guideline for obsessive-compulsive disorder (2007, with 2013 watch).","check":"","review":"pending"},{"id":"psy2-s2-05","subj":"Psychiatry","sec":"Anxiety and related disorders","topic":"PTSD and acute stress disorder","stem":"A 26-year-old woman comes to her physician 3 months after she was robbed at gunpoint while closing her shop. Since then she has had nightmares about the robbery several times a week and sudden, vivid memories that make her feel as if it is happening again. She avoids the street where it happened, has stopped opening the shop in the evenings and startles at loud noises. She feels detached from her friends and says she 'cannot feel happy anymore.' She now drinks 2 to 3 beers each night to fall asleep. Vital signs and physical examination are normal. She is referred for psychotherapy.","question":"Which of the following psychotherapies is most appropriate?","options":["Dialectical behavior therapy","Interpersonal therapy","Present-centered therapy","Prolonged exposure therapy","Psychological debriefing"],"answer":3,"explanation":"After a life-threatening trauma, intrusive memories and nightmares, avoidance, negative changes in mood and thinking, and hyperarousal lasting more than 1 month indicate PTSD. First-line treatment is trauma-focused psychotherapy, such as cognitive processing therapy, prolonged exposure or EMDR. SSRIs (sertraline, paroxetine) or venlafaxine are the main medications. Her alcohol use to sleep should also be addressed.","why":["Dialectical behavior therapy is designed for borderline personality disorder and self-harm.","Interpersonal therapy has weaker evidence than trauma-focused therapy for PTSD.","Present-centered therapy focuses on current problems, not the trauma, and is a second-tier option when trauma-focused therapy is unavailable.","Correct: prolonged exposure is a first-line trauma-focused psychotherapy for PTSD.","Psychological debriefing soon after trauma does not prevent or treat PTSD and may be harmful."],"dsm":"DSM-5-TR Posttraumatic stress disorder: Criterion A (exposure to actual or threatened death, serious injury or sexual violence), B (1 or more intrusion symptoms), C (avoidance), D (2 or more negative changes in cognition and mood), E (2 or more arousal changes), F (more than 1 month).","icd":"ICD-11 6B40 Post-traumatic stress disorder: re-experiencing the event in the present, avoidance and a persistent sense of current threat, lasting at least several weeks. Difference: ICD-11 defines PTSD more narrowly around these 3 core features and has a separate diagnosis, 6B41 Complex PTSD, for added problems with emotion regulation, self-concept and relationships.","refs":"APA clinical practice guideline for the treatment of PTSD (2017, updated 2025); VA/DoD PTSD guideline (2023).","check":"","review":"pending"},{"id":"psy2-s2-06","subj":"Psychiatry","sec":"Anxiety and related disorders","topic":"Adjustment disorder","stem":"A 45-year-old man comes to his physician 6 weeks after he was laid off from his job at a bank. Since then he has felt low and tearful, worries constantly about paying his children's school fees and keeps going over what he could have done differently. He has stopped going to his weekly soccer game but still enjoys time with his children. He sleeps 7 hours a night, his appetite and energy are normal and he has no thoughts of self-harm. He is applying for jobs but says the job loss has 'knocked him flat,' and he struggles to prepare for interviews. He has no previous psychiatric history. Vital signs and physical examination are normal.","question":"Which of the following is the most likely diagnosis?","options":["Adjustment disorder","Generalized anxiety disorder","Major depressive disorder","Persistent depressive disorder","Posttraumatic stress disorder"],"answer":0,"explanation":"Adjustment disorder is emotional or behavioral symptoms that develop within 3 months of an identifiable stressor, are out of proportion to it or impair functioning, and do not meet criteria for another mental disorder. Symptoms usually resolve within 6 months of the stressor or its consequences ending. Treatment is supportive or brief problem-focused psychotherapy.","why":["Correct: distress and impaired functioning beginning within 3 months of a stressor, not meeting criteria for another disorder.","Generalized anxiety disorder requires 6 months of worry about many areas of life.","He does not have the 5 symptoms over 2 weeks needed for a major depressive episode.","Persistent depressive disorder requires at least 2 years of symptoms.","PTSD requires exposure to actual or threatened death, serious injury or sexual violence."],"dsm":"DSM-5-TR Adjustment disorder, with mixed anxiety and depressed mood: Criterion A (onset within 3 months of a stressor), B (marked distress out of proportion or significant impairment), C (does not meet criteria for another mental disorder), E (symptoms resolve within 6 months once the stressor or its consequences end).","icd":"ICD-11 6B43 Adjustment disorder: preoccupation with the stressor (excessive worry, recurrent distressing thoughts, rumination) and failure to adapt, usually starting within 1 month and resolving within 6 months. Difference: ICD-11 makes preoccupation and failure to adapt the core features and has no subtypes.","refs":"","check":"","review":"pending"},{"id":"psy2-s2-07","subj":"Psychiatry","sec":"Substance-related disorders","topic":"Withdrawal management","stem":"A 52-year-old man is admitted after a fall with a fracture of the hip. He drinks about 10 standard drinks a day, mostly spirits. Forty-eight hours after admission he is tremulous, sweating and agitated and says he can see insects on the wall, although he knows where he is. Temperature is 37.9°C (100.2°F), pulse is 118/min and blood pressure is 164/98 mm Hg. His Clinical Institute Withdrawal Assessment for Alcohol (CIWA-Ar) score is 22. He has ascites and jaundice. Laboratory studies show albumin of 2.6 g/dL, total bilirubin of 4.2 mg/dL and an INR of 1.9.","question":"Which of the following is the most appropriate medication?","options":["Chlordiazepoxide","Clonidine","Haloperidol","Lorazepam","Naltrexone"],"answer":3,"explanation":"Tremor, sweating, tachycardia, hypertension, agitation and visual hallucinations with intact orientation 48 hours after the last drink indicate moderate to severe alcohol withdrawal with hallucinations. Benzodiazepines are the treatment of choice, dosed by symptom scores such as CIWA-Ar. In significant liver disease or older age, lorazepam or oxazepam is preferred because they are metabolized by glucuronidation and have no active metabolites. Thiamine should be given to all patients.","why":["Chlordiazepoxide is long-acting with active metabolites that accumulate in liver failure.","Clonidine can reduce autonomic signs but does not prevent seizures or delirium tremens.","Haloperidol lowers the seizure threshold and does not treat withdrawal.","Correct: lorazepam has no active metabolites and is safer in severe liver disease.","Naltrexone supports abstinence later and is avoided in decompensated liver disease."],"dsm":"DSM-5-TR Alcohol withdrawal, with perceptual disturbances: Criterion A (stopping heavy, prolonged use), Criterion B (2 or more of autonomic hyperactivity, tremor, insomnia, nausea or vomiting, hallucinations or illusions, agitation, anxiety and seizures within hours to days).","icd":"ICD-11 6C40 Disorders due to use of alcohol (alcohol withdrawal), coded with alcohol dependence where present.","refs":"ASAM Clinical Practice Guideline on Alcohol Withdrawal Management (2020).","check":"","review":"pending"},{"id":"psy2-s2-08","subj":"Psychiatry","sec":"Substance-related disorders","topic":"Alcohol use disorder","stem":"A 48-year-old man with long-standing heavy alcohol use is brought to the emergency department by his brother because he has been confused and unsteady for 2 days. He has eaten little for several weeks. Temperature is 36.6°C (97.9°F), pulse is 96/min and blood pressure is 118/72 mm Hg. He is disoriented to time and place. Examination shows horizontal nystagmus, weakness of both lateral rectus muscles and a wide-based, unsteady gait. Blood glucose is 74 mg/dL. Serum alcohol is undetectable, and there are no signs of withdrawal.","question":"Deficiency of a cofactor for which of the following enzymes contributes most directly to this condition?","options":["Glucose-6-phosphate dehydrogenase","Glutamate decarboxylase","Methylmalonyl-CoA mutase","Pyruvate carboxylase","Pyruvate dehydrogenase"],"answer":4,"explanation":"Confusion, ophthalmoplegia and ataxia in a malnourished heavy drinker indicate Wernicke encephalopathy, caused by thiamine (vitamin B1) deficiency. Thiamine pyrophosphate is a cofactor for pyruvate dehydrogenase, alpha-ketoglutarate dehydrogenase and transketolase; impaired energy metabolism damages the mammillary bodies and areas around the third ventricle and aqueduct. Treatment is high-dose intravenous thiamine, given before or with glucose. Untreated, it can progress to Korsakoff syndrome.","why":["G6PD uses NADP+, not thiamine.","Glutamate decarboxylase uses pyridoxal phosphate (vitamin B6).","Methylmalonyl-CoA mutase uses vitamin B12.","Pyruvate carboxylase uses biotin.","Correct: thiamine pyrophosphate is a cofactor for pyruvate dehydrogenase."],"dsm":"Wernicke encephalopathy is a medical emergency rather than a DSM-5-TR diagnosis. Lasting memory loss is classified in DSM-5-TR as alcohol-induced major neurocognitive disorder, amnestic-confabulatory type (Korsakoff syndrome).","icd":"ICD-11 classifies Wernicke encephalopathy outside the mental disorders chapter; lasting alcohol-related memory loss is classified under 6D72 Amnestic disorder.","refs":"EFNS guidelines for the diagnosis, therapy and prevention of Wernicke encephalopathy (2010).","check":"","review":"pending"},{"id":"psy2-s2-09","subj":"Psychiatry","sec":"Substance-related disorders","topic":"Opioid use disorder","stem":"A 30-year-old man is brought to the emergency department after he was found unresponsive at home. His friend says he swallowed several tablets of methadone, bought on the street, about 4 hours ago. Respiratory rate is 6/min, oxygen saturation is 82% on room air, pulse is 58/min and blood pressure is 104/66 mm Hg. His pupils are pinpoint. After bag-valve-mask ventilation and intravenous naloxone, he wakes and his respiratory rate rises to 16/min. Ninety minutes later he is drowsy again, with a respiratory rate of 8/min and oxygen saturation of 88%. A second bolus of naloxone again reverses his symptoms.","question":"Which of the following is the most appropriate next step in management?","options":["Discharge with take-home naloxone","Give activated charcoal","Give intravenous flumazenil","Start a naloxone infusion","Start sublingual buprenorphine"],"answer":3,"explanation":"Miosis, respiratory depression and reduced consciousness indicate opioid toxicity. Naloxone, a mu-opioid receptor antagonist, acts for about 30 to 90 minutes, whereas methadone acts for 24 hours or more, so toxicity recurs as naloxone wears off. Recurrent respiratory depression after a long-acting opioid calls for a continuous naloxone infusion and admission for monitoring. Before discharge, he should be offered take-home naloxone and treatment for opioid use disorder.","why":["Discharge is unsafe while a long-acting opioid is still causing respiratory depression.","Charcoal is unsafe in a drowsy patient and adds little this late.","Flumazenil reverses benzodiazepines and can cause seizures.","Correct: naloxone wears off before methadone, so an infusion is needed.","Buprenorphine does not reverse respiratory depression and could precipitate withdrawal."],"dsm":"DSM-5-TR Opioid intoxication: Criterion A (recent opioid use), B (clinically significant behavioral or psychological changes), C (pupillary constriction plus drowsiness or coma, slurred speech or impaired attention or memory).","icd":"ICD-11 6C43 Disorders due to use of opioids (opioid intoxication).","refs":"Naloxone prescribing information; standard toxicology references.","check":"","review":"pending"},{"id":"psy2-s2-10","subj":"Psychiatry","sec":"Substance-related disorders","topic":"Opioid use disorder","stem":"A 30-year-old woman with opioid use disorder who injects heroin daily comes to an addiction clinic asking for treatment. Her last injection was 4 hours ago. She has mild anxiety but no yawning, rhinorrhea, gooseflesh or abdominal cramps, and her Clinical Opiate Withdrawal Scale (COWS) score is 3. She is given her first dose of sublingual buprenorphine 8 mg. Within 30 minutes she has severe abdominal cramps, vomiting, yawning, a runny nose, dilated pupils, gooseflesh and agitation; her COWS score is now 18. Pulse is 112/min and blood pressure is 142/88 mm Hg.","question":"Which of the following properties of buprenorphine best explains this reaction?","options":["Full agonist at mu and delta receptors","Kappa receptor agonist","Mu agonist with NMDA antagonism","Partial agonist with high affinity","Pure antagonist at mu receptors"],"answer":3,"explanation":"Buprenorphine binds mu-opioid receptors more tightly than heroin but activates them only partly. Given while a full agonist still occupies the receptors, it displaces it and causes precipitated withdrawal. Buprenorphine is therefore started once the patient has objective withdrawal, typically a COWS score of about 8 to 12 or more, usually at least 12 hours after short-acting opioids and longer after methadone or fentanyl.","why":["A full agonist would not cause withdrawal in someone dependent on heroin.","Buprenorphine actually blocks kappa receptors.","This describes methadone, which would not precipitate withdrawal.","Correct: it displaces heroin from mu receptors but activates them less, causing precipitated withdrawal.","Pure antagonists are naloxone and naltrexone, not buprenorphine."],"dsm":"DSM-5-TR Opioid withdrawal: Criterion A (cessation of heavy use, or an opioid antagonist after use), Criterion B (3 or more of dysphoric mood, nausea or vomiting, muscle aches, lacrimation or rhinorrhea, dilated pupils, piloerection or sweating, diarrhea, yawning, fever and insomnia).","icd":"ICD-11 6C43 Disorders due to use of opioids (opioid withdrawal).","refs":"SAMHSA TIP 63: Medications for Opioid Use Disorder.","check":"","review":"pending"},{"id":"psy2-s2-11","subj":"Psychiatry","sec":"Substance-related disorders","topic":"Stimulants","stem":"A 28-year-old man comes to the emergency department with central chest pain that began 1 hour after he snorted cocaine at a party. He is anxious and sweating. Temperature is 37.9°C (100.2°F), pulse is 128/min and blood pressure is 182/110 mm Hg. His pupils are dilated. Heart sounds are normal, and the lungs are clear. An ECG shows sinus tachycardia without ST elevation, and the initial troponin level is normal. He is given aspirin.","question":"Which of the following medications is most likely to worsen his coronary vasoconstriction in the acute phase?","options":["Diazepam","Metoprolol","Nitroglycerin","Phentolamine","Verapamil"],"answer":1,"explanation":"Cocaine blocks the reuptake of noradrenaline, dopamine and serotonin, causing sympathetic overactivity, coronary vasospasm and a prothrombotic state. Initial treatment of cocaine-associated chest pain is a benzodiazepine, aspirin and nitrates, with calcium channel blockers or phentolamine for persistent hypertension or vasospasm. Pure beta blockers are traditionally avoided in the acute phase because unopposed alpha stimulation may worsen vasoconstriction.","why":["Benzodiazepines are first-line; they reduce sympathetic drive, heart rate and blood pressure.","Correct: a pure beta blocker may leave alpha stimulation unopposed and worsen vasoconstriction.","Nitrates relieve coronary vasospasm and chest pain.","Phentolamine, an alpha blocker, can treat severe hypertension and vasospasm.","Calcium channel blockers such as verapamil can relieve coronary vasospasm."],"dsm":"DSM-5-TR Stimulant intoxication (cocaine): Criterion A (recent use), B (behavioral or psychological changes), C (2 or more of tachycardia or bradycardia, pupillary dilation, raised or lowered blood pressure, sweating or chills, nausea, weight loss, psychomotor change, weakness or chest pain, confusion or seizures).","icd":"ICD-11 6C45 Disorders due to use of cocaine (cocaine intoxication).","refs":"AHA scientific statement on the management of cocaine-associated chest pain and myocardial infarction (2008).","check":"The evidence on beta blockers in cocaine toxicity is debated, and some guidelines allow combined alpha-beta blockers. Exam questions still expect pure beta blockers to be avoided acutely.","review":"pending"},{"id":"psy2-s2-12","subj":"Psychiatry","sec":"Substance-related disorders","topic":"Cannabis and hallucinogens","stem":"A 19-year-old man is brought to the emergency department by police after fighting several officers outside a nightclub. He is agitated and shouting, does not seem to feel pain from a deep cut on his hand and needs 4 people to restrain him. Temperature is 37.8°C (100.0°F), pulse is 122/min and blood pressure is 168/100 mm Hg. Examination shows both vertical and horizontal nystagmus, slurred speech and an unsteady gait. His pupils are of normal size. His friends say he smoked a cigarette sprinkled with a white powder he bought at the club. Blood glucose and serum alcohol are normal.","question":"The substance he most likely used acts primarily by which of the following mechanisms?","options":["Agonism at cannabinoid CB1 receptors","Agonism at mu-opioid receptors","Agonism at serotonin 5-HT2A receptors in the cortex","Antagonism at NMDA glutamate receptors","Blockade of dopamine reuptake"],"answer":3,"explanation":"Violence, reduced sensitivity to pain, hypertension, tachycardia, ataxia and nystagmus that is vertical as well as horizontal indicate phencyclidine (PCP) intoxication. PCP and ketamine are NMDA glutamate receptor antagonists, which explains the dissociation, psychosis and analgesia. Management is a calm, low-stimulation environment, benzodiazepines for agitation and antipsychotics if psychosis is severe, with monitoring for rhabdomyolysis and hyperthermia.","why":["Cannabis causes red eyes, increased appetite and a slowed sense of time, not violence with nystagmus.","Opioids cause sedation, pinpoint pupils and respiratory depression.","LSD and similar hallucinogens cause dilated pupils and visual distortions, usually without nystagmus or violence.","Correct: phencyclidine (PCP) is an NMDA receptor antagonist.","Cocaine blocks dopamine reuptake and causes dilated pupils without nystagmus."],"dsm":"DSM-5-TR Phencyclidine intoxication: Criterion A (recent use), B (belligerence, assaultiveness, impulsiveness, unpredictability, agitation or impaired judgment), C (2 or more within an hour of vertical or horizontal nystagmus, hypertension or tachycardia, numbness or reduced response to pain, ataxia, dysarthria, muscle rigidity, seizures or coma, hyperacusis).","icd":"ICD-11 6C4D Disorders due to use of dissociative drugs including ketamine and phencyclidine (intoxication).","refs":"","check":"","review":"pending"},{"id":"psy2-s2-13","subj":"Psychiatry","sec":"Child and adolescent psychiatry","topic":"ADHD","stem":"An 8-year-old boy is brought to his physician because his teacher says he cannot stay seated, calls out answers before questions are finished and rarely completes classwork. At home he loses his belongings, interrupts conversations, cannot wait his turn in games and needs constant reminders to finish tasks. His parents first noticed these problems when he was 5. Rating scales completed by his teacher and parents both show high scores for inattention and hyperactivity-impulsivity. He has no tics, and there is no personal or family history of heart disease, fainting or sudden death. Hearing and vision are normal. Pulse is 88/min, and blood pressure is 98/60 mm Hg. Physical examination is normal.","question":"In addition to behavioral support, which of the following is the most appropriate initial pharmacotherapy?","options":["Atomoxetine","Clonidine","Fluoxetine","Methylphenidate","Risperidone"],"answer":3,"explanation":"Persistent inattention and hyperactivity-impulsivity, beginning before age 12 and present at home and school, with impairment, indicate ADHD, combined presentation. For school-age children, first-line treatment is a stimulant such as methylphenidate or an amphetamine, together with parent training and classroom support. Stimulants block the reuptake of dopamine and noradrenaline. Height, weight, pulse and blood pressure are monitored during treatment.","why":["Atomoxetine is effective but second-line to stimulants, which have larger effects.","Alpha-2 agonists such as clonidine are second-line or adjunct treatments.","SSRIs do not treat ADHD.","Correct: stimulants are first-line medication for ADHD in school-age children.","Antipsychotics are not a treatment for ADHD."],"dsm":"DSM-5-TR Attention-deficit/hyperactivity disorder, combined presentation: Criterion A (6 or more symptoms of inattention and/or hyperactivity-impulsivity for at least 6 months; 5 or more from age 17), B (several symptoms before age 12), C (present in 2 or more settings), D (impaired functioning).","icd":"ICD-11 6A05 Attention deficit hyperactivity disorder: persistent inattention and/or hyperactivity-impulsivity with onset in the developmental period, typically early to mid-childhood. Difference: ICD-11 does not specify a symptom count or age cut-off.","refs":"American Academy of Pediatrics clinical practice guideline for ADHD (2019).","check":"","review":"pending"},{"id":"psy2-s2-14","subj":"Psychiatry","sec":"Child and adolescent psychiatry","topic":"Autism spectrum disorder","stem":"A 3-year-old boy is brought to his physician because he says only a few single words. His mother says he rarely looks at her when she speaks, does not point to show her things and does not bring her toys to share. At preschool he plays alone and lines up toy cars in long rows, becoming very distressed if anyone moves them. He insists on taking exactly the same route to preschool each day and flaps his hands when excited. He walked at 13 months. His formal hearing test is normal, and a developmental screening questionnaire completed by his mother is positive. Physical examination shows no dysmorphic features, and his head circumference is normal.","question":"Which of the following is the most likely diagnosis?","options":["Autism spectrum disorder","Language disorder","Rett syndrome","Selective mutism","Social (pragmatic) communication disorder"],"answer":0,"explanation":"Persistent deficits in social communication (poor eye contact, no pointing to share interest, limited social play) together with restricted, repetitive behavior (lining up toys, insistence on sameness, hand-flapping), present from early development, indicate autism spectrum disorder. Hearing should always be tested. Early intensive behavioral intervention and speech and language therapy improve outcomes.","why":["Correct: social communication deficits plus restricted, repetitive behavior from early childhood.","Language disorder affects language but not joint attention or repetitive behavior.","Rett syndrome affects almost only girls and causes regression after normal early development.","In selective mutism, the child speaks normally in some settings but not others.","Social (pragmatic) communication disorder lacks restricted, repetitive behaviors."],"dsm":"DSM-5-TR Autism spectrum disorder: Criterion A (all 3 deficits in social communication and interaction), Criterion B (2 or more of 4 restricted, repetitive patterns of behavior, interests or activities), C (present in the early developmental period), D (clinically significant impairment).","icd":"ICD-11 6A02 Autism spectrum disorder, with specifiers for the presence of disorder of intellectual development and the degree of functional language impairment. Difference: ICD-11 gives descriptive requirements rather than a symptom count and codes language and intellectual ability within the diagnosis.","refs":"American Academy of Pediatrics clinical report on the identification, evaluation and management of children with autism spectrum disorder (2020).","check":"","review":"pending"},{"id":"psy2-s2-15","subj":"Psychiatry","sec":"Child and adolescent psychiatry","topic":"Tic disorders","stem":"A 10-year-old boy is brought to his physician because of 'strange habits.' For 2 years he has had frequent eye blinking, shoulder shrugging and facial grimacing. For the past 18 months he has also repeatedly cleared his throat and made sniffing sounds. The movements and sounds come and go in severity and are preceded by an uncomfortable urge that he can hold back for a short time. They lessen when he is concentrating on soccer. He has no history of sore throat or rheumatic fever, and he does not take any medication. Neurological examination is otherwise normal.","question":"Which of the following is the most likely diagnosis?","options":["Obsessive-compulsive disorder","Persistent (chronic) motor or vocal tic disorder","Provisional tic disorder","Sydenham chorea","Tourette disorder"],"answer":4,"explanation":"Tourette disorder requires multiple motor tics and at least 1 vocal tic, not necessarily at the same time, present for more than 1 year, with onset before age 18 and not due to a substance or another medical condition. A premonitory urge and brief voluntary suppression are typical. ADHD and OCD often coexist. First-line treatment is comprehensive behavioral intervention for tics; alpha-2 agonists or antipsychotics such as aripiprazole are used when medication is needed.","why":["Compulsions are performed to relieve obsessions, although OCD often coexists with tics.","This diagnosis applies when only motor tics or only vocal tics are present, not both.","Provisional tic disorder lasts less than 1 year.","Sydenham chorea causes irregular movements after streptococcal infection that cannot be held back.","Correct: multiple motor tics and at least 1 vocal tic for more than 1 year, starting before 18."],"dsm":"DSM-5-TR Tourette disorder: Criterion A (multiple motor and 1 or more vocal tics at some time during the illness), B (tics may wax and wane but persist for more than 1 year since first onset), C (onset before age 18), D (not due to a substance or another medical condition).","icd":"ICD-11 8A05.00 Tourette syndrome, classified in the diseases of the nervous system chapter and cross-listed with neurodevelopmental disorders. The criteria are equivalent to DSM-5-TR.","refs":"American Academy of Neurology practice guideline on the treatment of tics (2019).","check":"","review":"pending"},{"id":"psy2-s2-16","subj":"Psychiatry","sec":"Child and adolescent psychiatry","topic":"Conduct and oppositional defiant disorders","stem":"A 14-year-old boy is brought by his mother after he was arrested for breaking into a neighbor's car. Over the past 2 years he has repeatedly stolen from shops, set fire to a trash can at school, bullied and threatened younger children, and stayed out all night despite his parents' rules. He has been suspended from school twice for fighting. He shows little remorse and says the victims 'deserved it.' He does not use drugs, and there is no history of mood episodes. Vital signs and physical examination are normal.","question":"Which of the following is the most likely diagnosis?","options":["Antisocial personality disorder","Attention-deficit/hyperactivity disorder","Conduct disorder","Intermittent explosive disorder","Oppositional defiant disorder"],"answer":2,"explanation":"Conduct disorder is a repetitive and persistent pattern of behavior that violates others' basic rights or major age-appropriate rules, with at least 3 behaviors in 12 months from aggression to people or animals, destruction of property, deceitfulness or theft, and serious rule violations. His lack of remorse suggests the specifier 'with limited prosocial emotions.' Antisocial personality disorder can be diagnosed only from age 18. Treatment is family-based and multisystemic interventions.","why":["Antisocial personality disorder can be diagnosed only from age 18.","ADHD involves inattention and hyperactivity, not deliberate violation of others' rights.","Correct: a repeated pattern of aggression, destruction, theft and serious rule violations.","Intermittent explosive disorder is impulsive outbursts of anger, not planned theft or fire setting.","Oppositional defiant disorder lacks aggression, destruction, theft and serious rule violations."],"dsm":"DSM-5-TR Conduct disorder: Criterion A (3 or more of 15 behaviors in 4 categories in the past 12 months, at least 1 in the past 6 months); specifiers for onset type and 'with limited prosocial emotions'.","icd":"ICD-11 6C91 Conduct-dissocial disorder: a repetitive and persistent pattern of behavior violating others' basic rights or major age-appropriate norms; specifiers for childhood or adolescent onset and limited prosocial emotions. Difference: ICD-11 gives descriptive requirements rather than a symptom count.","refs":"","check":"","review":"pending"},{"id":"psy2-s2-17","subj":"Psychiatry","sec":"Child and adolescent psychiatry","topic":"Intellectual disability","stem":"A 15-year-old boy is evaluated for learning difficulties and behavior problems. He has always been behind his classmates, needs help managing money and following multi-step instructions, and avoids eye contact. Standardized testing shows a full-scale IQ of 58 with matching deficits in adaptive functioning. He often flaps his hands and becomes anxious in crowds. His maternal uncle has an intellectual disability, and his mother had premature ovarian insufficiency at age 36. Examination shows a long, narrow face, a prominent jaw, large ears and enlarged testes.","question":"Which of the following genetic findings is most likely?","options":["Deletion on paternal chromosome 15q11-13","Expanded CGG repeat in FMR1","Microdeletion at 22q11.2","Mutation in MECP2","Trisomy 21"],"answer":1,"explanation":"Intellectual disability with autistic features, a long face, prominent jaw, large ears and macroorchidism, with an affected maternal uncle and maternal premature ovarian insufficiency, indicates fragile X syndrome. It is X-linked and caused by expansion of a CGG trinucleotide repeat in FMR1 beyond 200 repeats, which silences the gene by methylation. Premutation carriers (55 to 200 repeats) are at risk of premature ovarian insufficiency and late-onset tremor-ataxia. It is the most common inherited cause of intellectual disability.","why":["Paternal 15q11-13 deletion causes Prader-Willi syndrome, with hyperphagia and obesity.","Correct: a full mutation of more than 200 CGG repeats in FMR1 causes fragile X syndrome.","22q11.2 deletion causes DiGeorge syndrome, with cardiac defects, hypocalcemia and psychosis risk.","MECP2 mutations cause Rett syndrome, almost always in girls.","Trisomy 21 causes Down syndrome, with flat facial profile and upslanting eyes."],"dsm":"DSM-5-TR Intellectual developmental disorder (intellectual disability): Criterion A (deficits in intellectual functioning), B (deficits in adaptive functioning), C (onset during the developmental period); severity graded by adaptive functioning.","icd":"ICD-11 6A00 Disorders of intellectual development: significantly below-average intellectual functioning and adaptive behavior (about 2 or more standard deviations below the mean), with onset during the developmental period; graded mild to profound.","refs":"American College of Medical Genetics and Genomics guidance on fragile X testing.","check":"","review":"pending"},{"id":"psy2-s2-18","subj":"Psychiatry","sec":"Neurocognitive disorders","topic":"Delirium","stem":"An 82-year-old woman with mild Alzheimer disease is admitted with a urinary tract infection and started on intravenous ceftriaxone. Three days ago her family physician began oxybutynin for urge incontinence and tramadol for knee pain. On her second night in hospital she becomes acutely confused, pulls at her cannula and shouts that people are coming to hurt her. The next morning she is drowsy and cannot keep track of a conversation, but by the afternoon she is calmer. Temperature is 37.9°C (100.2°F), pulse is 98/min and blood pressure is 132/76 mm Hg. She has a palpable bladder. Her daughter says she was managing at home with help until this week.","question":"Which of the following is the most appropriate initial step in management?","options":["Add lorazepam at night","Start donepezil","Start quetiapine","Stop ceftriaxone","Stop oxybutynin and tramadol"],"answer":4,"explanation":"An acute, fluctuating disturbance of attention and awareness caused by a medical condition indicates delirium; dementia is a major risk factor. Several precipitants are present: infection, the anticholinergic drug oxybutynin, tramadol and urinary retention. Management is to find and treat each cause, stop deliriogenic drugs and use non-drug measures such as reorientation, glasses and hearing aids, sleep support, early mobilization and family presence.","why":["Benzodiazepines can worsen delirium, except in alcohol or benzodiazepine withdrawal.","Cholinesterase inhibitors do not treat or prevent delirium.","Antipsychotics are used only briefly and at low dose for severe distress or danger, which she does not have now.","The infection is itself a precipitant and must still be treated.","Correct: removing deliriogenic drugs is a key first step, alongside treating infection and urinary retention."],"dsm":"DSM-5-TR Delirium: Criterion A (disturbance in attention and awareness), B (develops over hours to days and fluctuates), C (additional cognitive disturbance), D (not better explained by a pre-existing neurocognitive disorder), E (evidence of a medical cause, substance or medication).","icd":"ICD-11 6D70 Delirium, coded with the underlying cause where known. The criteria are equivalent to DSM-5-TR.","refs":"NICE guideline CG103: Delirium; American Geriatrics Society Beers Criteria (2023).","check":"","review":"pending"},{"id":"psy2-s2-19","subj":"Psychiatry","sec":"Neurocognitive disorders","topic":"Dementias","stem":"A 74-year-old man is brought to his physician by his wife because of 1 year of memory problems and confusion that vary markedly from day to day. On some days he is alert, while on others he stares into space for long periods. He describes seeing small children playing in the living room and is not frightened by them. For several years before the memory problems began, his wife noticed that he shouted and punched in his sleep as if acting out dreams. Examination shows mild bradykinesia, cogwheel rigidity and a mild resting tremor. During a recent hospital stay he became severely rigid and confused after receiving haloperidol. His Montreal Cognitive Assessment score is 18/30.","question":"Which of the following is the most appropriate medication for his cognitive symptoms and hallucinations?","options":["Clonazepam","Levodopa-carbidopa","Memantine","Rivastigmine","Sertraline"],"answer":3,"explanation":"Fluctuating cognition, recurrent well-formed visual hallucinations, REM sleep behavior disorder and parkinsonism, with severe sensitivity to antipsychotics, indicate dementia with Lewy bodies. Cholinesterase inhibitors such as rivastigmine or donepezil are first-line for cognitive symptoms and hallucinations. Antipsychotics should be avoided; if one is unavoidable, low-dose quetiapine or clozapine is used with great caution. No drug is FDA-approved specifically for this disorder; rivastigmine is approved for Parkinson disease dementia.","why":["Clonazepam (or melatonin) can treat REM sleep behavior disorder but not cognition or hallucinations.","Levodopa may help movement but can worsen hallucinations.","Memantine has weaker evidence than cholinesterase inhibitors in Lewy body disease.","Correct: cholinesterase inhibitors improve cognition and hallucinations in Lewy body disease.","SSRIs do not treat cognition or hallucinations in Lewy body disease."],"dsm":"DSM-5-TR Major neurocognitive disorder with Lewy bodies: core features (fluctuating cognition, recurrent well-formed visual hallucinations, spontaneous parkinsonism) and suggestive features (REM sleep behavior disorder, severe neuroleptic sensitivity); probable with 2 core features, or 1 core plus 1 suggestive.","icd":"ICD-11 6D82 Dementia due to Lewy body disease.","refs":"Fourth consensus report of the DLB Consortium (McKeith et al., 2017).","check":"","review":"pending"},{"id":"psy2-s2-20","subj":"Psychiatry","sec":"Neurocognitive disorders","topic":"Dementias","stem":"A 76-year-old woman is brought to her physician by her son because of 2 years of gradually worsening memory. She repeats the same questions, misplaces her keys daily, has missed several bill payments and recently got lost driving home from church. She still dresses, bathes and feeds herself. She has hypertension controlled with amlodipine. There is no history of stroke, falls, hallucinations or personality change. Neurological examination is normal. Her Montreal Cognitive Assessment score is 19/30. Serum vitamin B12, TSH, calcium and a rapid plasma reagin test are normal. MRI of the brain shows atrophy of both hippocampi without significant vascular lesions. Her physician diagnoses mild dementia due to Alzheimer disease.","question":"The most appropriate initial symptomatic medication acts by which of the following mechanisms?","options":["Acetylcholinesterase inhibition","Dopamine D2 antagonism","GABA-A receptor modulation","NMDA receptor antagonism","Selective monoamine oxidase-B inhibition"],"answer":0,"explanation":"Gradual, progressive memory loss with impaired complex activities such as finances and driving but preserved basic self-care, hippocampal atrophy and no reversible cause indicate mild dementia due to Alzheimer disease. Cholinesterase inhibitors (donepezil, rivastigmine, galantamine) are first-line, increasing acetylcholine at cholinergic synapses. Memantine is added or used for moderate to severe disease. Anticholinergic and sedative drugs should be avoided, and driving safety must be addressed.","why":["Correct: cholinesterase inhibitors such as donepezil are first-line in mild to moderate Alzheimer disease.","Antipsychotics do not improve cognition and increase mortality in dementia.","Benzodiazepines worsen cognition and increase falls.","Memantine is used for moderate to severe Alzheimer disease, not as first-line in mild disease.","MAO-B inhibitors are used in Parkinson disease."],"dsm":"DSM-5-TR Major neurocognitive disorder due to probable Alzheimer's disease: significant decline in 1 or more cognitive domains interfering with independence, with insidious onset, gradual progression and clear memory decline, without mixed etiology.","icd":"ICD-11 6D80 Dementia due to Alzheimer disease. Difference: ICD-11 uses the term 'dementia', whereas DSM-5-TR uses 'major neurocognitive disorder'.","refs":"NIA-AA criteria for dementia due to Alzheimer disease (2011); cholinesterase inhibitor prescribing information.","check":"Anti-amyloid antibody treatments are approved in some countries for early Alzheimer disease with confirmed amyloid; exam questions still expect cholinesterase inhibitors as standard first-line treatment.","review":"pending"},{"id":"psy2-s2-21","subj":"Psychiatry","sec":"Emergencies and mental health law","topic":"Serotonin syndrome","stem":"A 40-year-old woman who takes sertraline 150 mg daily for depression was prescribed tramadol for back pain 2 days ago. She is brought to the emergency department with agitation, sweating, diarrhea and tremor that began this morning. Temperature is 38.9°C (102.0°F), pulse is 124/min and blood pressure is 156/94 mm Hg. Her pupils are dilated, her skin is moist and her bowel sounds are hyperactive. There is generalized hyperreflexia with inducible ankle clonus, more marked in the legs than the arms. Both drugs are stopped, and she is given intravenous fluids and a benzodiazepine, but her agitation and clonus persist.","question":"Which of the following is the most appropriate next medication?","options":["Bromocriptine","Cyproheptadine","Dantrolene","Haloperidol","Physostigmine"],"answer":1,"explanation":"Agitation, autonomic instability (fever, sweating, tachycardia, diarrhea) and neuromuscular overactivity (tremor, hyperreflexia, inducible clonus most marked in the legs) after adding tramadol to an SSRI meet the Hunter criteria for serotonin toxicity. It usually develops within 24 hours. Treatment is stopping serotonergic drugs, supportive care and benzodiazepines, with cyproheptadine for persistent symptoms; severe hyperthermia needs sedation, paralysis and intubation.","why":["Bromocriptine, a dopamine agonist, is used in neuroleptic malignant syndrome and may worsen serotonin toxicity.","Correct: cyproheptadine, a 5-HT2A antagonist, is used when symptoms persist despite supportive care.","Dantrolene is used for malignant hyperthermia and has no proven benefit here.","Haloperidol can worsen hyperthermia and is not a treatment for serotonin syndrome.","Physostigmine reverses anticholinergic toxicity and is contraindicated here."],"dsm":"Not a DSM-5-TR diagnosis (drug toxicity).","icd":"Not classified as a mental disorder in ICD-11 (drug toxicity).","refs":"Hunter Serotonin Toxicity Criteria (Dunkley et al., 2003); Boyer and Shannon, 'The serotonin syndrome', New England Journal of Medicine (2005).","check":"","review":"pending"},{"id":"psy2-s2-22","subj":"Psychiatry","sec":"Emergencies and mental health law","topic":"Management of acute agitation","stem":"A 32-year-old man with schizophrenia is brought to the emergency department by his family after stopping his medication 3 weeks ago. He is pacing, shouting and threatening staff, and he has just thrown a chair across the room. Repeated attempts at verbal de-escalation in a quiet room have failed, and he refuses oral medication. He has no known medical problems, no history of drug or alcohol use and no known drug allergies. A recent ECG shows a QTc interval of 420 ms. Security staff are present, and the team decides that rapid tranquilization is needed.","question":"Which of the following is the most appropriate medication regimen?","options":["Intramuscular chlorpromazine with intramuscular lorazepam","Intramuscular haloperidol with intramuscular lorazepam","Intramuscular ketamine with intramuscular midazolam","Intramuscular phenobarbital with intramuscular lorazepam","Oral risperidone with oral lorazepam"],"answer":1,"explanation":"Managing acute agitation starts with a safe environment and verbal de-escalation. When a patient remains dangerous and refuses oral medication, rapid tranquilization with an intramuscular antipsychotic (haloperidol or olanzapine) and/or a benzodiazepine such as lorazepam is appropriate. Intramuscular olanzapine should not be combined with a parenteral benzodiazepine within about an hour. After haloperidol, monitor vital signs, oxygen saturation, extrapyramidal effects and the QTc interval.","why":["Intramuscular chlorpromazine causes marked hypotension and is not recommended for rapid tranquilization.","Correct: an intramuscular antipsychotic with a benzodiazepine is an evidence-based regimen for severe agitation.","Ketamine is reserved for extreme agitation in some settings and can worsen psychosis.","Two sedatives without an antipsychotic do not treat the psychosis, and the combination risks respiratory depression.","He refuses oral medication, and rapid tranquilization is needed now."],"dsm":"Not a diagnostic question (emergency management).","icd":"Not a diagnostic question (emergency management).","refs":"American Association for Emergency Psychiatry Project BETA consensus statements (2012); NICE guideline NG10: Violence and aggression (2015).","check":"Rapid tranquilization protocols and preferred drugs vary between hospitals and countries.","review":"pending"},{"id":"psy2-s2-23","subj":"Psychiatry","sec":"Other adult disorders","topic":"Eating disorders","stem":"A 19-year-old woman with anorexia nervosa, restricting type, is admitted with a BMI of 13.8 kg/m², having eaten very little for 3 weeks. Nasogastric feeding is started at full calculated energy requirements. On day 3 she develops weakness, confusion, ankle swelling and shortness of breath. Pulse is 118/min and blood pressure is 96/58 mm Hg. Examination shows bilateral crackles at the lung bases and pitting edema of both ankles. An ECG shows sinus tachycardia.","question":"Which of the following electrolyte disturbances best explains her muscle weakness and cardiorespiratory failure?","options":["Hypocalcemia","Hypokalemia","Hypomagnesemia","Hyponatremia","Hypophosphatemia"],"answer":4,"explanation":"Refeeding syndrome occurs when nutrition is restarted after severe malnutrition. Insulin release drives phosphate, potassium and magnesium into cells, and low phosphate impairs ATP production, causing muscle weakness, heart failure, respiratory failure, confusion and fluid retention. Prevention is close monitoring of phosphate, potassium and magnesium with replacement in the first days of feeding, thiamine, and a careful but not excessively slow increase in calories.","why":["Low calcium is not a core feature of refeeding syndrome.","Low potassium also occurs and causes arrhythmias, but low phosphate is the hallmark that explains ATP depletion and pump failure.","Low magnesium also occurs, but low phosphate is the defining disturbance.","Refeeding causes sodium and fluid retention, usually without significant hyponatremia.","Correct: low phosphate depletes ATP and 2,3-BPG, causing muscle weakness, heart failure and respiratory failure."],"dsm":"DSM-5-TR Anorexia nervosa, restricting type: Criterion A (restriction leading to significantly low body weight), B (intense fear of gaining weight), C (disturbed body image); severity by BMI (extreme: under 15 kg/m²).","icd":"ICD-11 6B80 Anorexia nervosa: significantly low body weight (BMI under 18.5 kg/m² in adults), with a specifier for dangerously low body weight (BMI under 14 kg/m²). Difference: ICD-11 sets weight thresholds within the diagnosis and does not require fear of weight gain if other weight-control behavior is clear.","refs":"NICE guideline NG69: Eating disorders (2017); Royal College of Psychiatrists MEED guidance (Medical Emergencies in Eating Disorders, 2022).","check":"","review":"pending"},{"id":"psy2-s2-24","subj":"Psychiatry","sec":"Other adult disorders","topic":"Personality disorders","stem":"A 24-year-old woman is referred after her fifth emergency department visit this year for superficial cuts to her forearms. She describes intense relationships in which she sees partners as either perfect or worthless, and she becomes desperate when they are late, fearing they will leave her. She spends and drinks impulsively, feels chronically empty and has intense anger she struggles to control. Her mood shifts within hours, usually in response to arguments. These patterns date back to her mid-teens. Her sleep is normal between crises. Physical examination shows multiple healed linear scars on both forearms.","question":"Which of the following treatments has the strongest evidence for reducing her self-harm?","options":["Dialectical behavior therapy","Fluoxetine","Lamotrigine","Lithium","Quetiapine"],"answer":0,"explanation":"A pervasive pattern since adolescence of unstable relationships, self-image and mood, with impulsivity, fear of abandonment, chronic emptiness, intense anger and recurrent self-harm, indicates borderline personality disorder. Psychotherapy is the main treatment, and dialectical behavior therapy has the strongest evidence for reducing self-harm and suicidal behavior; mentalization-based therapy and schema therapy are alternatives. No medication treats the disorder itself.","why":["Correct: dialectical behavior therapy reduces self-harm and suicidal behavior in this disorder.","SSRIs do not reduce self-harm in borderline personality disorder unless a depressive disorder coexists.","A large trial found lamotrigine no better than placebo for this disorder.","Lithium has no good evidence here and is dangerous in overdose.","Antipsychotics may ease specific symptoms briefly but do not reduce self-harm."],"dsm":"DSM-5-TR Borderline personality disorder: a pervasive pattern beginning by early adulthood, with 5 or more of 9 criteria (abandonment fears, unstable relationships, identity disturbance, impulsivity, recurrent self-harm or suicidal behavior, affective instability, emptiness, intense anger, stress-related paranoia or dissociation).","icd":"ICD-11 6D10 Personality disorder (graded mild, moderate or severe) with the 6D11.5 Borderline pattern specifier. Difference: ICD-11 classifies personality disorder by severity and trait domains rather than as separate categorical types; 'borderline pattern' is the only named type retained.","refs":"NICE guideline CG78: Borderline personality disorder; APA practice guideline for borderline personality disorder.","check":"","review":"pending"},{"id":"psy2-s2-25","subj":"Psychiatry","sec":"Other adult disorders","topic":"Somatic symptom disorders","stem":"A 23-year-old college student is brought to the emergency department because she woke this morning unable to move her left leg. She was previously well. She cannot lift her left leg off the bed when asked, yet when she is helped to sit she moves it to keep her balance. Muscle tone, deep tendon reflexes and plantar responses are normal and symmetrical, and pinprick sensation is intact. When she is asked to lift her straight right leg against resistance, her left heel pushes firmly down into the examiner's hand. When asked to push her left heel down directly, she produces almost no force. MRI of the brain and spine and a creatine kinase level are normal. She has no examinations, legal claims or other obligations pending, and she is distressed by the weakness.","question":"Which of the following is the most likely diagnosis?","options":["Factitious disorder imposed on self","Functional neurological symptom disorder","Illness anxiety disorder","Malingering","Somatic symptom disorder"],"answer":1,"explanation":"Weakness with positive clinical signs of internal inconsistency (automatic movement of the 'paralysed' leg and a positive Hoover sign), normal reflexes and normal imaging indicates functional neurological symptom disorder (conversion disorder). The diagnosis rests on these positive signs; DSM-5-TR no longer requires a psychological stressor, although one is often present. Symptoms are not deliberately produced, unlike factitious disorder and malingering. Management is a clear, non-judgmental explanation of the diagnosis, physiotherapy and psychological therapy.","why":["In factitious disorder, symptoms are deliberately produced to take on the sick role.","Correct: weakness with positive signs inconsistent with neurological disease, not deliberately produced.","Illness anxiety disorder is preoccupation with having a serious illness, with few or no symptoms.","In malingering, symptoms are deliberately produced for an external reward.","Somatic symptom disorder is excessive thoughts, feelings and behavior about real physical symptoms."],"dsm":"DSM-5-TR Functional neurological symptom disorder (conversion disorder), with weakness or paralysis: Criterion A (altered voluntary motor or sensory function), B (findings incompatible with recognized neurological or medical conditions), C (not better explained by another disorder), D (distress or impairment); specifier 'with psychological stressor'.","icd":"ICD-11 6B60 Dissociative neurological symptom disorder. Difference: ICD-11 classifies these symptoms with the dissociative disorders rather than with somatic symptom disorders.","refs":"","check":"","review":"pending"},{"id":"psy2-s3-01","subj":"Psychiatry","sec":"Psychiatric assessment","topic":"Mental status examination","stem":"A 62-year-old retired accountant is brought to the clinic by his wife, who is worried about his memory. When asked what brought him in, he says, 'Well, it started on Tuesday, no, Wednesday, because the plumber came on Tuesday, and he was late again, the same plumber we used when the kitchen flooded in 2019, a terrible rainy season that was. My wife drove me today; she prefers the long road past the market because of the potholes on the expressway. Anyway, I keep losing my keys, and that is why we are here.' He answers later questions in the same way. His speech is normal in rate and volume, and he is not distracted by events in the room. Mood is 'fine' and affect is full range. Mini-Cog screening is normal.","question":"Which of the following best describes this patient's thought process?","options":["Blocking","Circumstantiality","Flight of ideas","Loosening of associations","Tangentiality"],"answer":1,"explanation":"Thought process describes how ideas are linked. Circumstantial speech is long-winded and over-detailed but goal-directed: the speaker gets back to the point. Tangential speech moves off the point and never returns. Circumstantiality can be a personality style or occur in obsessional personality, epilepsy and early cognitive impairment; on its own it is not diagnostic. His normal rate of speech and lack of distractibility argue against flight of ideas.","why":["Blocking is a sudden stop in the flow of thought, often mid-sentence.","Correct: he gives excessive, irrelevant detail but eventually reaches the point.","Flight of ideas is rapid, pressured speech jumping between loosely linked ideas, typical of mania.","In loosening of associations, ideas have no logical connection, as in schizophrenia.","In tangentiality, the speaker drifts away and never returns to the original point."],"dsm":"Not a diagnosis. DSM-5-TR uses these terms when describing disorganized thinking (Criterion A3 for schizophrenia: derailment or loose associations, tangentiality, incoherence).","icd":"ICD-11 does not define mental status terms separately; its descriptions of disorganized thinking for 6A20 Schizophrenia use the same concepts.","refs":"Sims' Symptoms in the Mind (6th ed.); American Psychiatric Association practice guidelines for the psychiatric evaluation of adults (3rd ed., 2016).","check":"","review":"pending"},{"id":"psy2-s3-02","subj":"Psychiatry","sec":"Psychiatric assessment","topic":"Mental status examination","stem":"A 28-year-old man is brought to the emergency department by his brother because he has been talking to himself and has not slept properly for 2 months. He says that the thoughts about harming his neighbor's goat 'are not mine. The man next door puts them into my head through the wall, using a machine.' He says he does not want to hurt the goat and is frightened by the thoughts. Urine drug screen is negative.","question":"Which of the following best describes this patient's symptom?","options":["Delusion of reference","Obsession","Thought broadcasting","Thought insertion","Thought withdrawal"],"answer":3,"explanation":"Thought insertion is a delusion that thoughts are being placed into one's mind by an external force. It is one of the passivity phenomena, or Schneiderian first-rank symptoms, which strongly suggest schizophrenia but are not specific to it. The key difference from an obsession is ownership: in OCD the unwanted thought is recognized as one's own, even though it is resisted.","why":["Delusions of reference are beliefs that neutral events or remarks refer specifically to oneself.","Obsessions are intrusive and unwanted, but the person recognizes them as products of their own mind.","In thought broadcasting, the person believes others can hear or know their thoughts.","Correct: he experiences thoughts in his mind that he believes were put there by an outside agent.","In thought withdrawal, the person believes thoughts are being taken out of their mind."],"dsm":"Not a diagnosis. DSM-5-TR lists delusions as Criterion A1 for schizophrenia and gives thought insertion as an example of a bizarre delusion. DSM-5-TR does not give first-rank symptoms special weight.","icd":"ICD-11 6A20 Schizophrenia lists 'experiences of influence, passivity or control', including thought insertion, among its core symptoms. Difference: ICD-11 names these passivity experiences as a core symptom group, while DSM-5-TR includes them only as delusions.","refs":"Sims' Symptoms in the Mind (6th ed.); WHO ICD-11 Clinical Descriptions and Diagnostic Requirements for Mental, Behavioural or Neurodevelopmental Disorders (2024).","check":"","review":"pending"},{"id":"psy2-s3-03","subj":"Psychiatry","sec":"Psychiatric assessment","topic":"Psychiatric interview","stem":"A 41-year-old man comes to his physician because of 6 weeks of low mood, poor sleep and loss of interest in his work since his divorce. He has lost 4 kg (9 lb) and has stopped seeing his friends. During the interview, he looks at the floor and says quietly, 'Sometimes I think everyone would be better off without me.' He has no history of psychiatric illness and does not drink alcohol. Vital signs are normal. Physical examination shows psychomotor slowing but is otherwise normal.","question":"Which of the following is the most appropriate response by the physician?","options":["\"Are you having thoughts of ending your life?\"","\"I would like you to complete a depression questionnaire before we go on.\"","\"Tell me more about how the divorce has affected your children.\"","\"We should start you on an antidepressant today.\"","\"Why do you think everyone would be better off without you?\""],"answer":0,"explanation":"Any indirect statement such as 'everyone would be better off without me' should be followed by asking directly about suicidal thoughts, then about plans, intent, access to means (such as firearms or medications), previous attempts and protective factors. Asking directly does not increase suicide risk, and patients are often relieved to be asked. The findings then decide whether he can be treated as an outpatient with a safety plan or needs urgent or inpatient care.","why":["Correct: he has made an indirect suicidal statement, which must be followed by direct questions about suicidal thoughts, plans and intent.","A questionnaire can support assessment but must not delay direct questions about suicide.","Moving to another topic misses the risk statement he has just made.","Treatment decisions follow a risk assessment, and the setting of care depends on that risk.","A 'why' question can sound judgmental and does not establish whether he is thinking of suicide."],"dsm":"DSM-5-TR Major depressive disorder: Criterion A (5 or more of 9 symptoms for 2 weeks, including depressed mood or loss of interest), including A9, recurrent thoughts of death or suicidal ideation. DSM-5-TR also adds codes for current and past suicidal behavior.","icd":"ICD-11 6A70 Single episode depressive disorder: depressed mood or loss of interest with other symptoms for at least 2 weeks, including thoughts of death or suicide. Criteria are closely similar to DSM-5-TR.","refs":"Dazzi et al., 'Does asking about suicide and related behaviours induce suicidal ideation?' Psychological Medicine (2014); The Joint Commission National Patient Safety Goal 15.01.01.","check":"","review":"pending"},{"id":"psy2-s3-04","subj":"Psychiatry","sec":"Psychiatric assessment","topic":"Rating scales","stem":"A 70-year-old retired school principal comes to her physician with her daughter because she has become more forgetful over the past year. She misplaces items, repeats questions and now relies on lists and phone reminders to pay her bills, which she still manages herself. She lives alone, cooks, shops and drives without difficulty. She has hypertension controlled with amlodipine. She scores 29 of 30 on the Mini-Mental State Examination. A Patient Health Questionnaire-9 score is 2. Neurological examination is normal. Serum vitamin B12, TSH and a complete blood count are normal.","question":"Which of the following is the most appropriate next step to assess her cognition?","options":["Clock drawing test","Geriatric Depression Scale","Montreal Cognitive Assessment","Reassurance that her cognition is normal","Repeat Mini-Mental State Examination in 1 year"],"answer":2,"explanation":"The MMSE has a ceiling effect: highly educated people with mild impairment often score normally. The Montreal Cognitive Assessment includes harder tests of executive function, delayed recall and visuospatial skills, and is more sensitive for mild cognitive impairment. Her reported decline, with independence kept through compensatory strategies, fits mild neurocognitive disorder. Abnormal screening should lead to formal neuropsychological testing and investigation of the cause.","why":["A clock drawing test is a brief screen and is less sensitive than a multi-domain screening instrument.","Her depression screen is already negative, and the concern is cognitive decline.","Correct: this test is more sensitive than the MMSE for mild cognitive impairment, especially in highly educated patients.","A normal MMSE does not exclude mild impairment in a highly educated person with reported decline.","Waiting a year delays recognition of a possible mild neurocognitive disorder."],"dsm":"DSM-5-TR Mild neurocognitive disorder: Criterion A (modest decline from a previous level in 1 or more cognitive domains, based on concern and objective testing), B (independence in everyday activities preserved, although greater effort or compensatory strategies may be needed), C and D (not only in delirium and not better explained by another mental disorder).","icd":"ICD-11 6D71 Mild neurocognitive disorder: subjective decline with objective evidence of impairment that does not significantly interfere with independence. Criteria are equivalent to DSM-5-TR.","refs":"Nasreddine et al., 'The Montreal Cognitive Assessment, MoCA', Journal of the American Geriatrics Society (2005); Petersen et al., AAN practice guideline update on mild cognitive impairment (2018).","check":"","review":"pending"},{"id":"psy2-s3-05","subj":"Psychiatry","sec":"Psychiatric assessment","topic":"DSM-5-TR classification","stem":"A 29-year-old woman comes to the clinic 7 weeks after the uncomplicated vaginal delivery of her first child. Beginning about 2 weeks after delivery, she has felt sad and tearful most of the day. She takes no pleasure in caring for her baby, cannot sleep even when the baby sleeps, has a poor appetite and feels she is a failure as a mother. She has difficulty concentrating. She has no thoughts of harming herself or the baby and has never had a period of elevated mood. She has no hallucinations or unusual beliefs. Hemoglobin and TSH are normal.","question":"Which of the following is the most accurate diagnosis?","options":["Adjustment disorder with mixed anxiety and depressed mood","Bipolar II disorder","Brief psychotic disorder with peripartum onset","Major depressive disorder with peripartum onset","Postpartum blues"],"answer":3,"explanation":"She has at least 5 depressive symptoms, including anhedonia, for more than 2 weeks, so she meets criteria for a major depressive episode. Because it began within 4 weeks of delivery, DSM-5-TR adds the specifier 'with peripartum onset'. About half of these episodes actually begin during pregnancy. Screening with the Edinburgh Postnatal Depression Scale is recommended. Treatment includes psychotherapy and, when needed, an SSRI such as sertraline, which is compatible with breastfeeding.","why":["She meets full criteria for a major depressive episode, which excludes adjustment disorder.","Bipolar II disorder requires at least 1 hypomanic episode.","She has no psychotic symptoms.","Correct: a major depressive episode beginning during pregnancy or within 4 weeks after delivery takes this specifier.","Postpartum blues are mild, begin within days of delivery and resolve within about 2 weeks."],"dsm":"DSM-5-TR Major depressive disorder, single episode, with peripartum onset: Criterion A (5 or more of 9 symptoms for 2 weeks, including depressed mood or anhedonia); specifier applies when onset is during pregnancy or in the 4 weeks after delivery.","icd":"ICD-11 6A70 Single episode depressive disorder, with the additional code 6E20 Mental or behavioural disorders associated with pregnancy, childbirth or the puerperium, without psychotic symptoms. Difference: ICD-11 uses a window of about 6 weeks after delivery, whereas DSM-5-TR uses onset during pregnancy or within 4 weeks after delivery.","refs":"ACOG Clinical Practice Guideline No. 4: Screening and diagnosis of mental health conditions during pregnancy and postpartum (2023).","check":"","review":"pending"},{"id":"psy2-s3-06","subj":"Psychiatry","sec":"Other adult disorders","topic":"Dissociative disorders","stem":"A 34-year-old man is brought to the emergency department by police after being found working at a roadside food stall in a city 300 km (186 miles) from his home. He had been there for 5 days under a different name and could not say where he came from. His family reported him missing 1 week ago, 2 weeks after his wife and daughter died in a motor vehicle collision. He now recognizes his brother but cannot recall anything about the past 7 days or the accident. He is distressed by the gaps in his memory. He has no history of seizures or alcohol use and has no pending legal or financial problems. Neurological examination, a CT scan of the head, an EEG and a urine drug screen are normal.","question":"Which of the following is the most likely diagnosis?","options":["Delirium","Dissociative amnesia","Dissociative identity disorder","Malingering","Transient global amnesia"],"answer":1,"explanation":"Dissociative amnesia is an inability to recall autobiographical information, usually of a traumatic or stressful nature, that is more than ordinary forgetting. The specifier 'with dissociative fugue' applies when there is apparently purposeful travel or bewildered wandering with amnesia for identity. Neurological, substance and seizure causes must be excluded. Most episodes resolve; treatment is psychotherapy in a safe setting, with attention to grief and trauma.","why":["Delirium causes fluctuating attention and awareness, which he does not have.","Correct: inability to recall important personal information after trauma, with purposeful travel, indicates dissociative amnesia with dissociative fugue.","Dissociative identity disorder requires 2 or more distinct personality states, which are not described.","Malingering requires deliberate feigning for an external reward, and none is present.","Transient global amnesia lasts less than 24 hours, and personal identity is kept."],"dsm":"DSM-5-TR Dissociative amnesia: Criterion A (inability to recall important autobiographical information, usually traumatic or stressful), B (distress or impairment), C (not due to a substance or medical condition), D (not better explained by another disorder); specifier 'with dissociative fugue'.","icd":"ICD-11 6B61 Dissociative amnesia, with 6B61.0 Dissociative amnesia with dissociative fugue. Criteria are closely similar to DSM-5-TR.","refs":"American Psychiatric Association, DSM-5-TR (2022), Dissociative disorders chapter.","check":"","review":"pending"},{"id":"psy2-s3-07","subj":"Psychiatry","sec":"Other adult disorders","topic":"Dissociative disorders","stem":"A 22-year-old college student comes to the clinic because of episodes during the past year in which she feels detached from her body, 'as if I am watching myself in a film.' During these episodes, the world looks flat and unreal, 'like a stage set.' Each episode lasts hours and occurs several times a week. She knows that these are only feelings and that she and the world are real. The episodes frighten her and affect her studies. She has never had sudden surges of intense fear, and she has had no traumatic experiences. She does not use cannabis or other drugs. Physical and neurological examinations, an EEG and a urine drug screen are normal.","question":"Which of the following is the most likely diagnosis?","options":["Acute stress disorder","Brief psychotic disorder","Depersonalization/derealization disorder","Panic disorder","Schizophreniform disorder"],"answer":2,"explanation":"Depersonalization is feeling detached from one's own mind or body; derealization is feeling that the surroundings are unreal. The key feature is intact reality testing: the person knows these are only feelings. Substances (especially cannabis and hallucinogens), seizures, panic disorder and depression must be excluded. Treatment is psychotherapy, mainly CBT; no medication is approved, although SSRIs or lamotrigine are sometimes tried.","why":["Acute stress disorder follows a traumatic event and lasts no more than 1 month.","Her reality testing is intact, so this is not psychosis.","Correct: persistent depersonalization and derealization with intact reality testing, not caused by another condition.","Depersonalization can occur during panic attacks, but she has none.","Her reality testing is intact, so this is not psychosis."],"dsm":"DSM-5-TR Depersonalization/derealization disorder: Criterion A (persistent or recurrent depersonalization, derealization or both), B (reality testing intact), C (distress or impairment), D (not due to a substance or medical condition), E (not better explained by another mental disorder).","icd":"ICD-11 6B66 Depersonalization-derealization disorder. Crite
