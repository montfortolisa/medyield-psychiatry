<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MedYield Psychiatry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d3f63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow column like a printed case booklet; home, question and results screens swap in place. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17212e; --muted:#5a6779; --line:#d9dfe7;
  --accent:#1d3f63; --accent-fg:#ffffff; --accent-soft:#e7eef6;
  --sel:#2563eb; --sel-bg:#eef4ff;
  --ok:#147a45; --ok-bg:#e9f7ef; --bad:#b42318; --bad-bg:#fdeeec; --flag:#b45309;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --fg:#e6ebf2; --muted:#9aa7b8; --line:#2a3442;
  --accent:#8db4e2; --accent-fg:#0c1a2b; --accent-soft:#1b2a3d;
  --sel:#6ea0ff; --sel-bg:#16233c; --ok:#4ccf86; --ok-bg:#12291d; --bad:#ff8a7a; --bad-bg:#33171a; --flag:#f0a64b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --fg:#e6ebf2; --muted:#9aa7b8; --line:#2a3442;
  --accent:#8db4e2; --accent-fg:#0c1a2b; --accent-soft:#1b2a3d;
  --sel:#6ea0ff; --sel-bg:#16233c; --ok:#4ccf86; --ok-bg:#12291d; --bad:#ff8a7a; --bad-bg:#33171a; --flag:#f0a64b;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);margin:0}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.7rem;letter-spacing:-.01em}
h2{font-size:1.1rem}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}

/* Home */
.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.summary .bar{grid-column:1/-1;margin-top:6px}
.sections{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.sec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sec .name{font-weight:600}
.sec .meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sec .go{grid-row:1/3;grid-column:2;color:var(--accent);font-weight:700}
.sec .bar{grid-column:1/2;height:5px}
.foot{margin-top:28px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.85rem;align-self:flex-start}
.confirm{background:var(--bad-bg);border:1px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--fg)}

/* Question */
.qtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.qnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.flagbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted)}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag);font-weight:600}
.case{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.stem{margin:0;font-size:1.02rem}
.lead{margin:0;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px;margin:4px 0 0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
.opt .k{font-family:var(--display);font-weight:700;color:var(--muted)}
.opt .why{grid-column:2;font-size:.86rem;color:var(--muted);margin-top:4px}
.opt.sel{border-color:var(--sel);background:var(--sel-bg)}
.opt.sel .k{color:var(--sel)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.verdict{font-family:var(--display);font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.expl{background:var(--accent-soft);border-radius:12px;padding:14px;margin:0}
.expl h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;color:var(--accent)}
.note{font-size:.8rem;color:var(--flag)}
.crit{border-left:3px solid var(--accent);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.crit h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0}
.crit p{margin:0;color:var(--fg)}
.crit b{font-weight:600}
.actions{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-block:14px calc(10px + env(safe-area-inset-bottom,0px));margin-top:4px}

/* Results */
.score{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.score b{font-family:var(--display);font-size:2.6rem;font-variant-numeric:tabular-nums}
.rlist{display:flex;flex-direction:column;gap:6px;margin:12px 0 18px;padding:0;list-style:none}
.rlist li{display:grid;grid-template-columns:26px 1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem}
.rlist .m{font-weight:700}.rlist .m.ok{color:var(--ok)}.rlist .m.bad{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
var QS = [], BYID = {};
function useBank(bank){
  QS = (bank && bank.questions || []).filter(function(q){ return q.subj === "Psychiatry" && q.options && q.options.length === 5; });
  BYID = {}; QS.forEach(function(q){ BYID[q.id] = q; });
}
var KEY = "medyield_psych_v2";
var app = document.getElementById("app");

/* ---------- saved progress (this device only) ---------- */
var S = { answers:{}, flags:{} };
try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); S.answers = p.answers || {}; S.flags = p.flags || {}; } } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------- helpers ---------- */
function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function isAnswered(q){ return !!S.answers[q.id]; }
function isRight(q){ var a = S.answers[q.id]; return !!a && a.picked === q.answer; }
function stats(list){ var done = list.filter(isAnswered), ok = done.filter(isRight).length;
  return { total:list.length, done:done.length, ok:ok, wrong:done.length - ok, pct: done.length ? Math.round(ok / done.length * 100) : null }; }
function sections(){ var order = [], map = {};
  QS.forEach(function(q){ if (!map[q.sec]) { map[q.sec] = []; order.push(q.sec); } map[q.sec].push(q); });
  var ORDER = ["Psychiatric assessment","Psychotic disorders","Mood disorders","Anxiety and related disorders","Other adult disorders","Substance-related disorders","Child and adolescent psychiatry","Neurocognitive disorders","Psychiatric treatment","Emergencies and mental health law"];
  order.sort(function(a, b){ return ORDER.indexOf(a) - ORDER.indexOf(b); });
  return order.map(function(s){ return { name:s, qs:map[s] }; }); }
function bar(frac){ var b = el("div","bar"), i = el("i"); i.style.width = Math.round(frac * 100) + "%"; b.appendChild(i); return b; }
function top(){ window.scrollTo(0, 0); }

/* ---------- session ---------- */
var session = null; // { title, ids:[], i, picked:null, results:{} }
function start(title, list){
  if (!list.length) return;
  session = { title:title, ids:list.map(function(q){ return q.id; }), i:0, picked:null, results:{} };
  renderQuestion(); top();
}

/* ---------- home ---------- */
var confirmReset = false;
function renderHome(){
  session = null; app.innerHTML = "";
  var st = stats(QS);
  var hero = el("header","hero");
  hero.appendChild(el("div","eyebrow","MedYield · Psychiatry"));
  hero.appendChild(el("h1",null,"Psychiatry question bank"));
  hero.appendChild(el("p","muted","NBME-style clinical vignettes keyed to DSM-5-TR, with ICD-11 equivalents and an explanation for every option. Works offline once loaded."));
  app.appendChild(hero);

  var sum = el("section","summary");
  [[st.done + "/" + st.total,"Answered"],[st.pct == null ? "–" : st.pct + "%","Correct"],[st.wrong,"To review"]].forEach(function(s){
    var d = el("div","stat"); d.appendChild(el("b",null,String(s[0]))); d.appendChild(el("span",null,s[1])); sum.appendChild(d); });
  sum.appendChild(bar(st.total ? st.done / st.total : 0));
  app.appendChild(sum);

  var unanswered = QS.filter(function(q){ return !isAnswered(q); });
  var wrong = QS.filter(function(q){ return isAnswered(q) && !isRight(q); });
  var flagged = QS.filter(function(q){ return S.flags[q.id]; });
  var acts = el("div","stack");
  var b1 = el("button","btn primary block", unanswered.length ? "Practise " + unanswered.length + " new question" + (unanswered.length === 1 ? "" : "s") : "All questions answered");
  b1.disabled = !unanswered.length; b1.onclick = function(){ start("New questions", unanswered); };
  acts.appendChild(b1);
  var r = el("div","row");
  var b2 = el("button","btn","Review mistakes (" + wrong.length + ")"); b2.disabled = !wrong.length;
  b2.onclick = function(){ start("Review mistakes", wrong); };
  var b3 = el("button","btn","Flagged (" + flagged.length + ")"); b3.disabled = !flagged.length;
  b3.onclick = function(){ start("Flagged questions", flagged); };
  r.appendChild(b2); r.appendChild(b3); acts.appendChild(r);
  app.appendChild(acts);

  var secs = el("section","sections");
  secs.appendChild(el("h2",null,"Practise by section"));
  sections().forEach(function(s){
    var ss = stats(s.qs);
    var b = el("button","sec");
    b.appendChild(el("span","name",s.name));
    b.appendChild(el("span","go","›"));
    b.appendChild(el("span","meta", s.qs.length + " questions · " + ss.done + " answered" + (ss.pct == null ? "" : " · " + ss.pct + "% correct")));
    b.appendChild(bar(ss.total ? ss.done / ss.total : 0));
    b.onclick = function(){ start(s.name, s.qs); };
    secs.appendChild(b);
  });
  app.appendChild(secs);

  var foot = el("div","foot");
  foot.appendChild(el("span",null,"Original questions written for exam practice and independently checked. Answers follow DSM-5-TR (the USMLE standard); ICD-11 differences are shown after each answer. Check clinical decisions against current local guidelines. Progress is saved on this device."));
  if (confirmReset) {
    var c = el("div","confirm");
    c.appendChild(el("span",null,"Clear all your answers and flags? This cannot be undone."));
    var cr = el("div","row");
    var yes = el("button","btn","Yes, clear progress"); yes.onclick = function(){ S = { answers:{}, flags:{} }; save(); confirmReset = false; renderHome(); };
    var no = el("button","btn","Cancel"); no.onclick = function(){ confirmReset = false; renderHome(); };
    cr.appendChild(yes); cr.appendChild(no); c.appendChild(cr); foot.appendChild(c);
  } else {
    var rb = el("button","linkbtn","Reset progress"); rb.onclick = function(){ confirmReset = true; renderHome(); };
    foot.appendChild(rb);
  }
  app.appendChild(foot);
}

/* ---------- question ---------- */
function renderQuestion(){
  var q = BYID[session.ids[session.i]], res = session.results[q.id], done = !!res;
  app.innerHTML = "";

  var head = el("div","qtop");
  var nav = el("div","qnav");
  var back = el("button","back","‹ Home"); back.onclick = function(){ renderHome(); top(); };
  var count = el("span","count","Question " + (session.i + 1) + " of " + session.ids.length);
  var fl = el("button","flagbtn", S.flags[q.id] ? "★ Flagged" : "☆ Flag");
  fl.setAttribute("aria-pressed", S.flags[q.id] ? "true" : "false");
  fl.onclick = function(){ if (S.flags[q.id]) delete S.flags[q.id]; else S.flags[q.id] = true; save(); renderQuestion(); };
  nav.appendChild(back); nav.appendChild(count); nav.appendChild(fl);
  head.appendChild(nav);
  head.appendChild(bar((session.i + (done ? 1 : 0)) / session.ids.length));
  app.appendChild(head);

  var card = el("article","case");
  card.appendChild(el("div","eyebrow", q.sec + " · " + q.topic));
  card.appendChild(el("p","stem", q.stem));
  card.appendChild(el("p","lead", q.question));
  if (done) { var good = res.picked === q.answer; card.appendChild(el("div","verdict " + (good ? "ok" : "bad"), good ? "✓ Correct" : "✗ Incorrect. The answer is " + "ABCDE"[q.answer] + ".")); }
  var ul = el("ul","opts");
  q.options.forEach(function(o, k){
    var li = el("li"), b = el("button","opt");
    if (!done && session.picked === k) b.classList.add("sel");
    if (done && k === q.answer) b.classList.add("right");
    if (done && k === res.picked && k !== q.answer) b.classList.add("wrong");
    b.appendChild(el("span","k","ABCDE"[k]));
    b.appendChild(el("span",null,o));
    if (done) { b.disabled = true; b.appendChild(el("span","why", q.why[k])); }
    else b.onclick = function(){ session.picked = k; renderQuestion(); };
    li.appendChild(b); ul.appendChild(li);
  });
  card.appendChild(ul);
  if (done) {
    var ex = el("div","expl"); ex.appendChild(el("h3",null,"Explanation")); ex.appendChild(el("p",null,q.explanation));
    ex.lastChild.style.margin = "0"; card.appendChild(ex);
    if (q.dsm || q.icd || q.refs) {
      var cr = el("div","crit"); cr.appendChild(el("h3",null,"Criteria and sources"));
      [["DSM-5-TR", q.dsm], ["ICD-11", q.icd], ["Sources", q.refs]].forEach(function(r){
        if (!r[1]) return; var d = el("p"); d.appendChild(el("b",null,r[0] + ": ")); d.appendChild(document.createTextNode(r[1].replace(/^(DSM-5-TR|ICD-11)\s+/, ""))); cr.appendChild(d); });
      card.appendChild(cr);
    }
    if (q.check) card.appendChild(el("div","note","Note: " + q.check));
  }
  app.appendChild(card);

  var act = el("div","actions");
  var main;
  if (!done) {
    main = el("button","btn primary block", session.picked == null ? "Select an answer" : "Submit answer");
    main.disabled = session.picked == null;
    main.onclick = submit;
  } else {
    var last = session.i === session.ids.length - 1;
    main = el("button","btn primary block", last ? "See results" : "Next question");
    main.onclick = next;
  }
  act.appendChild(main); app.appendChild(act);
}
function submit(){
  if (session.picked == null) return;
  var q = BYID[session.ids[session.i]];
  session.results[q.id] = { picked:session.picked };
  S.answers[q.id] = { picked:session.picked, at:Date.now() }; save();
  session.picked = null; renderQuestion();
}
function next(){
  if (session.i < session.ids.length - 1) { session.i++; session.picked = null; renderQuestion(); top(); }
  else { renderResults(); top(); }
}

/* ---------- results ---------- */
function renderResults(){
  app.innerHTML = "";
  var ids = session.ids.filter(function(id){ return session.results[id]; });
  var ok = ids.filter(function(id){ return session.results[id].picked === BYID[id].answer; }).length;
  var sc = el("section","score");
  sc.appendChild(el("div","eyebrow", session.title));
  sc.appendChild(el("b",null, ok + "/" + ids.length));
  sc.appendChild(el("span","muted", ids.length ? Math.round(ok / ids.length * 100) + "% correct" : "No questions answered"));
  app.appendChild(sc);
  var ul = el("ul","rlist"), wrongQs = [];
  ids.forEach(function(id){
    var q = BYID[id], good = session.results[id].picked === q.answer, li = el("li");
    if (!good) wrongQs.push(q);
    li.appendChild(el("span","m " + (good ? "ok" : "bad"), good ? "✓" : "✗"));
    li.appendChild(el("span",null, q.topic + ": " + q.options[q.answer]));
    ul.appendChild(li);
  });
  app.appendChild(ul);
  var acts = el("div","stack");
  if (wrongQs.length) { var rv = el("button","btn primary block","Retry the " + wrongQs.length + " I got wrong"); rv.onclick = function(){ start("Retry mistakes", wrongQs); }; acts.appendChild(rv); }
  var hm = el("button","btn block","Back to home"); hm.onclick = function(){ renderHome(); top(); };
  acts.appendChild(hm); app.appendChild(acts);
}

/* ---------- keyboard: A–E or 1–5 to select, Enter to submit or continue ---------- */
document.addEventListener("keydown", function(e){
  if (!session || e.ctrlKey || e.metaKey || e.altKey) return;
  var q = BYID[session.ids[session.i]]; if (!q) return;
  var done = !!session.results[q.id], k = "abcde".indexOf(e.key.toLowerCase());
  if (k < 0 && /^[1-5]$/.test(e.key)) k = +e.key - 1;
  if (!done && k >= 0) { session.picked = k; renderQuestion(); }
  else if (e.key === "Enter") { if (done) next(); else if (session.picked != null) submit(); }
});

/* ---------- question bank (built in, so the app works fully offline) ---------- */
app.innerHTML = "";
app.appendChild(el("p","muted","Loading questions…"));
var BANK = {"app":"medyield-bank","version":2,"standard":"NBME item-writing style; DSM-5-TR keyed, ICD-11 shown","updated":"2026-11-23","questions":[{"id":"psy2-s1-01","subj":"Psychiatry","sec":"Psychotic disorders","topic":"Schizophrenia","stem":"A 23-year-old man is brought to the outpatient clinic by his mother because he has become increasingly withdrawn and suspicious. Seven months ago he stopped attending college lectures, began spending most of the day in his room and neglected his hygiene. For the past 6 weeks he has heard a man's voice commenting on his actions, and he says his neighbors are inserting thoughts into his head through the wall socket. He has no history of depressive or manic episodes, and his mother says he does not use alcohol or drugs. Temperature is 36.8°C (98.2°F), pulse is 84/min and blood pressure is 122/76 mm Hg. Physical and neurological examinations show no abnormalities. On mental status examination, his affect is flat and his speech is sparse. Serum TSH, a complete blood count and a urine drug screen are normal.","question":"Which of the following is the most likely diagnosis?","options":["Brief psychotic disorder","Delusional disorder","Schizoaffective disorder","Schizophrenia","Schizophreniform disorder"],"answer":3,"explanation":"He has 2 characteristic symptoms for more than 1 month (auditory hallucinations and delusions of thought insertion), plus negative symptoms (flat affect, sparse speech), with continuous signs of illness for 7 months once the prodromal withdrawal and self-neglect are counted. DSM-5-TR requires at least 6 months of continuous disturbance, including prodromal or residual periods, with decline in functioning. Substances, medical causes and mood episodes have been excluded.","why":["Brief psychotic disorder lasts less than 1 month and ends with full recovery.","Delusional disorder does not include prominent hallucinations, negative symptoms or marked decline.","Schizoaffective disorder requires major mood episodes for most of the illness; he has had none.","Correct: Criterion A symptoms for over 1 month, with 7 months of continuous illness including the prodrome.","Schizophreniform disorder lasts less than 6 months; counting the prodrome, he has been ill for 7 months."],"dsm":"DSM-5-TR Schizophrenia: Criterion A (2 or more of delusions, hallucinations, disorganized speech, grossly disorganized or catatonic behavior, negative symptoms; at least one of the first three; present for a significant part of 1 month), Criterion B (decline in functioning) and Criterion C (continuous signs for at least 6 months, including prodromal or residual periods).","icd":"ICD-11 6A20 Schizophrenia: characteristic symptoms for at least 1 month. Difference: ICD-11 has no 6-month duration rule and no functional-decline requirement, so this patient would meet ICD-11 criteria even after 1 month.","refs":"","check":"","review":"pending"},{"id":"psy2-s1-02","subj":"Psychiatry","sec":"Psychotic disorders","topic":"Schizophrenia","stem":"A 24-year-old woman is brought to the clinic by her roommate. Ten weeks ago she began talking to herself and writing notes that make no sense. She now says that two voices argue about her and that her thoughts are being broadcast on the radio; the voices often keep her awake, and she feels tired the next day. Until 10 weeks ago she worked full time as an accountant, socialized normally and had no psychiatric history. She has not had a period of elevated or depressed mood, and she denies alcohol or drug use. Vital signs are normal, and physical examination is unremarkable. On mental status examination, her speech jumps between unrelated topics and she laughs to herself without apparent reason. A complete blood count, serum electrolytes, TSH and a urine drug screen are within the reference ranges, and MRI of the brain is normal.","question":"According to DSM-5-TR, which of the following is the most likely diagnosis?","options":["Brief psychotic disorder","Schizophrenia","Schizophreniform disorder","Schizotypal personality disorder","Substance/medication-induced psychotic disorder"],"answer":2,"explanation":"She meets Criterion A for schizophrenia: hallucinations, delusions of thought broadcasting, and disorganized speech and behavior. The total duration is 10 weeks. DSM-5-TR schizophreniform disorder requires the same symptoms for at least 1 month but less than 6 months, and functional decline is not required. The diagnosis is labeled provisional while recovery is uncertain; about two-thirds of patients later receive a diagnosis of schizophrenia or schizoaffective disorder.","why":["Brief psychotic disorder lasts less than 1 month; she has been ill for 10 weeks.","DSM-5-TR schizophrenia requires at least 6 months of continuous disturbance.","Correct: Criterion A symptoms with a total duration between 1 and 6 months.","Schizotypal personality disorder is a long-standing pattern of odd beliefs without sustained frank psychosis.","There is no history or laboratory evidence of substance or medication use."],"dsm":"DSM-5-TR Schizophreniform disorder: Criterion A of schizophrenia; episode lasting at least 1 month but less than 6 months; schizoaffective disorder, mood disorders with psychotic features, substances and medical conditions excluded.","icd":"ICD-11 has no schizophreniform category. Difference: because ICD-11 6A20 Schizophrenia needs only 1 month of symptoms, this patient would be diagnosed with schizophrenia under ICD-11.","refs":"","check":"","review":"pending"},{"id":"psy2-s1-03","subj":"Psychiatry","sec":"Psychotic disorders","topic":"Brief psychotic disorder","stem":"A 31-year-old man is brought to the emergency department by his brother 4 days after his wife and son died in a motor vehicle collision. Since the funeral he has not slept, has shouted that relatives are plotting to poison him and was found walking along the highway at night, partially dressed. He has no previous psychiatric history and does not use alcohol or drugs. Temperature is 37.0°C (98.6°F), pulse is 98/min and blood pressure is 134/84 mm Hg. He is alert and oriented to time, place and person, and his attention is intact. Examination shows no abnormalities. Blood glucose, serum electrolytes and a urine drug screen are normal. He is admitted and treated with a low-dose antipsychotic. Nine days later he is calm and his persecutory beliefs have resolved; in total his psychotic symptoms lasted about 2 weeks. He is now grieving appropriately. Two months later he is back at work with no further symptoms.","question":"Which of the following is the most likely diagnosis?","options":["Acute stress disorder","Brief psychotic disorder","Delirium","Major depressive disorder with psychotic features","Schizophreniform disorder"],"answer":1,"explanation":"Brief psychotic disorder is the sudden onset of at least 1 of delusions, hallucinations or disorganized speech, with or without grossly disorganized behavior. It lasts at least 1 day but less than 1 month and ends with full return to the previous level of functioning. It is specified 'with marked stressor' when it follows events that would be markedly stressful to almost anyone in similar circumstances, such as the sudden death of close family members.","why":["Acute stress disorder involves intrusion, avoidance and dissociative symptoms, not persecutory delusions.","Correct: psychosis after a severe stressor, lasting under 1 month, with full recovery.","Delirium is a disturbance of attention and awareness; he is alert, oriented and attentive.","He had no major depressive episode; the psychosis was not part of a mood episode.","Schizophreniform disorder requires symptoms for at least 1 month."],"dsm":"DSM-5-TR Brief psychotic disorder, with marked stressor: at least 1 of delusions, hallucinations or disorganized speech; duration at least 1 day but less than 1 month; eventual full return to premorbid functioning.","icd":"ICD-11 6A23 Acute and transient psychotic disorder: psychotic symptoms with acute onset (within 2 weeks) that change rapidly in nature and intensity and usually resolve within days to weeks. Difference: ICD-11 allows a duration of up to 3 months, longer than the DSM-5-TR limit of under 1 month.","refs":"","check":"","review":"pending"},{"id":"psy2-s1-04","subj":"Psychiatry","sec":"Psychotic disorders","topic":"Delusional disorder","stem":"A 38-year-old woman is referred by the police after repeatedly waiting outside the home of a well-known television presenter. For 18 months she has been convinced that he is secretly in love with her and sends her coded messages through the color of his ties. She has written him more than 200 letters, although they have never met. She works as a bank cashier, manages her finances well and attends church with friends every week. She has no hallucinations, and her speech is organized and goal-directed. She has no history of depressive or manic episodes and does not use alcohol or drugs. Vital signs and physical examination are normal. Serum TSH and a urine drug screen are normal.","question":"Which of the following is the most likely diagnosis?","options":["Bipolar I disorder","Delusional disorder","Paranoid personality disorder","Schizophrenia","Schizotypal personality disorder"],"answer":1,"explanation":"Delusional disorder requires 1 or more delusions for at least 1 month, without Criterion A for schizophrenia ever being met. Apart from the effects of the delusion, functioning is not markedly impaired and behavior is not obviously bizarre. The erotomanic type is the belief that another person, often of higher status, is in love with the patient. Any hallucinations are not prominent and relate to the delusional theme.","why":["She has no history of a manic episode.","Correct: a fixed erotomanic delusion for 18 months with otherwise preserved functioning.","Paranoid personality disorder is pervasive distrust of others, not a fixed false belief.","Schizophrenia would require further Criterion A symptoms and functional decline.","Schizotypal personality disorder involves odd beliefs and eccentricity, not a fixed delusion."],"dsm":"DSM-5-TR Delusional disorder, erotomanic type: Criterion A (delusions lasting 1 month or longer), Criterion B (Criterion A for schizophrenia never met), Criterion C (functioning not markedly impaired apart from the delusion).","icd":"ICD-11 6A24 Delusional disorder: a delusion or set of related delusions persisting for at least 3 months, without other characteristic symptoms of schizophrenia. Difference: ICD-11 requires 3 months, DSM-5-TR only 1 month.","refs":"","check":"","review":"pending"},{"id":"psy2-s1-05","subj":"Psychiatry","sec":"Psychotic disorders","topic":"Schizoaffective disorder","stem":"A 35-year-old man with a 6-year psychiatric history is admitted after stopping his medications. Records show that for about 4 of the past 6 years he has had major depressive episodes, with depressed mood, anhedonia, early waking, weight loss and hopelessness, separated by short periods of partial recovery. During these episodes he heard voices calling him worthless. Records also show that 2 years ago, during a month when his mood was normal, he heard voices daily. He has never had elevated mood or a decreased need for sleep. On this admission his depression fully remits after 5 weeks of treatment, with a Hamilton Depression Rating Scale score of 4, but for the next 5 weeks, while his mood remains euthymic, he continues to hear voices daily and insists that ward staff are poisoning his food. Physical examination and laboratory studies, including a urine drug screen, are normal.","question":"Which of the following is the most likely diagnosis?","options":["Bipolar I disorder","Major depressive disorder with psychotic features","Persistent depressive disorder","Schizoaffective disorder","Schizophrenia"],"answer":3,"explanation":"Schizoaffective disorder requires an uninterrupted illness in which a major mood episode occurs together with Criterion A of schizophrenia; delusions or hallucinations for 2 weeks or more without a major mood episode; and mood episodes present for the majority of the total illness. The depressive type applies when only major depressive episodes have occurred. If psychosis occurred only during mood episodes, the diagnosis would be a mood disorder with psychotic features.","why":["He has never had a manic episode.","In a depressive disorder with psychotic features, psychosis occurs only during mood episodes.","Persistent depressive disorder is chronic low-grade depression and does not explain psychosis outside mood episodes.","Correct: psychosis for 2 weeks or more without a mood episode, with mood episodes for most of the illness.","In schizophrenia, mood episodes are present for only a minority of the total illness."],"dsm":"DSM-5-TR Schizoaffective disorder, depressive type: Criterion A (major mood episode concurrent with Criterion A of schizophrenia), Criterion B (delusions or hallucinations for 2 weeks or more without a major mood episode), Criterion C (mood episodes present for the majority of the total illness).","icd":"ICD-11 6A21 Schizoaffective disorder: requirements for schizophrenia and for a moderate or severe mood episode are met within the same episode, appearing together or within a few days. Difference: ICD-11 diagnoses the current episode; DSM-5-TR looks at the whole lifetime course and requires psychosis without mood symptoms for 2 weeks.","refs":"","check":"","review":"pending"},{"id":"psy2-s1-06","subj":"Psychiatry","sec":"Psychotic disorders","topic":"Schizophrenia","stem":"A 29-year-old man with schizophrenia is evaluated in the outpatient clinic. Over the past 2 years he has received 8-week trials of risperidone 6 mg/day and olanzapine 20 mg/day; adherence was confirmed by supervised dosing and therapeutic plasma concentrations. He still hears daily command hallucinations telling him to kill himself, and 3 months ago he was admitted after cutting his wrist in response to the voices. He does not use alcohol or drugs. Vital signs and physical examination are normal. A complete blood count, serum glucose, lipid profile and ECG are normal. The psychiatrist recommends switching to the most appropriate antipsychotic for his condition.","question":"Which of the following should be monitored most closely during the first 6 months of treatment with this drug?","options":["Absolute neutrophil count","Serum creatine kinase","Serum prolactin","Serum sodium","Thyroid-stimulating hormone"],"answer":0,"explanation":"Treatment-resistant schizophrenia means persistent symptoms despite at least 2 adequate antipsychotic trials with confirmed adherence. Clozapine is the only antipsychotic with superior efficacy in this group, and it also reduces suicidal behavior. Its most serious hematological risk is severe neutropenia (agranulocytosis), which is most likely in the first 18 weeks, so the absolute neutrophil count is checked weekly for the first 6 months and less often afterwards. Troponin and CRP are also checked in the first month for myocarditis, and seizures, constipation and metabolic effects need monitoring.","why":["Correct: clozapine can cause severe neutropenia, most often in the first 18 weeks.","Creatine kinase is checked if neuroleptic malignant syndrome or myocarditis is suspected, not routinely weekly.","Clozapine causes little rise in prolactin.","Hyponatremia is linked to carbamazepine and SSRIs rather than clozapine.","Thyroid monitoring is required with lithium, not clozapine."],"dsm":"DSM-5-TR Schizophrenia (diagnosis). Treatment resistance is not a DSM-5-TR diagnostic category.","icd":"ICD-11 6A20 Schizophrenia. Treatment resistance is not a separate ICD-11 category.","refs":"Treatment-resistant schizophrenia: TRRIP working group consensus criteria (2017); APA practice guideline for schizophrenia (2020). Monitoring: clozapine prescribing information.","check":"In 2025 the US removed its national clozapine registry requirement; neutrophil monitoring is still recommended in the prescribing information. Other countries have their own schemes.","review":"pending"},{"id":"psy2-s1-07","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Antipsychotics","stem":"A 34-year-old woman with treatment-resistant schizophrenia started clozapine 7 weeks ago. Her absolute neutrophil count was 3,100/µL before treatment and 2,600/µL one week ago. She now has a 1-day history of sore throat, chills and malaise. Temperature is 38.7°C (101.7°F), pulse is 112/min and blood pressure is 108/66 mm Hg. Examination shows pharyngeal redness and tender cervical lymph nodes. Laboratory studies show a leukocyte count of 1,400/µL, an absolute neutrophil count of 380/µL (reference range 1,500–8,000/µL), hemoglobin of 12.8 g/dL and a platelet count of 210,000/µL. She is admitted, and blood cultures are drawn.","question":"Which of the following is the most appropriate next step in management?","options":["Add lithium and continue clozapine at the same dose","Continue clozapine and repeat the neutrophil count in 1 week","Continue clozapine at half the dose and recheck in 3 days","Stop clozapine and start empirical intravenous antibiotics","Switch to olanzapine and arrange outpatient review in 1 week"],"answer":3,"explanation":"An absolute neutrophil count below 500/µL is severe neutropenia, and with fever it is febrile neutropenia, a medical emergency. Clozapine must be stopped immediately, blood cultures taken and empirical broad-spectrum intravenous antibiotics started, with daily blood counts until recovery. Granulocyte colony-stimulating factor may be considered. Rechallenge is generally avoided after clozapine-induced severe neutropenia unless the benefit clearly outweighs the risk. People of African descent with Duffy-null-associated (benign ethnic) neutropenia have lower baseline counts and separate, lower monitoring thresholds.","why":["Lithium raises the neutrophil count but does not make continuing clozapine safe in severe neutropenia.","Continuing clozapine risks overwhelming infection.","Dose reduction is not appropriate for severe neutropenia with fever.","Correct: severe neutropenia with fever requires stopping clozapine and urgent antibiotic treatment.","Switching antipsychotics will be needed later, but she needs urgent inpatient treatment of febrile neutropenia now."],"dsm":"Not a diagnostic question (adverse drug effect).","icd":"Not a diagnostic question (adverse drug effect).","refs":"Clozapine prescribing information (US thresholds: mild neutropenia 1,000–1,499/µL, moderate 500–999/µL, severe below 500/µL); febrile neutropenia management guidelines.","check":"These neutropenia thresholds are from US labeling; the UK and other countries use different cut-offs.","review":"pending"},{"id":"psy2-s1-08","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Antipsychotics","stem":"A 61-year-old woman with schizophrenia is brought to the clinic by her daughter, who has noticed 'strange movements' over the past 6 months. The patient has taken haloperidol 10 mg daily for 14 years, and her psychotic symptoms have been stable. She is not distressed by the movements and was unaware of them. Examination shows repetitive lip smacking, puckering of the lips, side-to-side movements of the jaw and slow, writhing movements of the fingers. The movements worsen when she is anxious and disappear during sleep. Muscle tone is normal, and there is no tremor or rigidity. Serum electrolytes, calcium, TSH and liver function tests are normal.","question":"A drug with which of the following mechanisms of action is most appropriate to treat these movements?","options":["Antagonism of beta-adrenergic receptors","Antagonism of muscarinic receptors","Inhibition of vesicular monoamine transporter 2","Positive modulation of GABA-A receptors","Stimulation of dopamine D2 receptors"],"answer":2,"explanation":"Choreoathetoid movements of the mouth, jaw and fingers after years of dopamine D2 receptor blockade indicate tardive dyskinesia, thought to result partly from upregulated, supersensitive postsynaptic D2 receptors. VMAT2 inhibitors deplete presynaptic dopamine and are first-line drug treatments. Anticholinergic drugs can worsen it. The need for the antipsychotic should also be reviewed, and a switch to a lower-risk drug such as clozapine considered.","why":["Beta blockers such as propranolol are used for akathisia.","Anticholinergic drugs treat acute dystonia and parkinsonism but can worsen tardive dyskinesia.","Correct: VMAT2 inhibitors (valbenazine, deutetrabenazine) are first-line drug treatments.","Benzodiazepines have weak evidence and cause sedation and dependence.","Dopamine agonists would worsen her psychosis and do not treat tardive dyskinesia."],"dsm":"DSM-5-TR Medication-induced movement disorders: Tardive dyskinesia (involuntary athetoid or choreiform movements developing after at least a few months of a dopamine receptor-blocking drug, or sooner in older people).","icd":"ICD-11 classifies drug-induced movement disorders in the diseases of the nervous system, outside the mental disorders chapter.","refs":"APA practice guideline for schizophrenia (2020); valbenazine and deutetrabenazine prescribing information.","check":"VMAT2 inhibitors are FDA-approved; availability varies in other countries.","review":"pending"},{"id":"psy2-s1-09","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Antipsychotics","stem":"A 19-year-old man is brought to the emergency department in a first episode of psychosis with severe agitation. He receives haloperidol 5 mg intramuscularly and becomes calmer. Three hours later he complains that he cannot move his neck. His head is turned forcefully to the right, his eyes are fixed in an upward gaze and he is frightened but fully alert and oriented. Temperature is 37.1°C (98.8°F), pulse is 104/min and blood pressure is 132/80 mm Hg. Muscle tone in the limbs is normal, and there is no tremor. He has no history of seizures.","question":"The most appropriate immediate treatment acts by which of the following mechanisms?","options":["Antagonism of muscarinic acetylcholine receptors","Antagonism of serotonin 5-HT2A receptors","Blockade of beta-adrenergic receptors","Inhibition of calcium release from the sarcoplasmic reticulum","Inhibition of vesicular monoamine transporter 2"],"answer":0,"explanation":"Sustained involuntary contraction causing torticollis and an oculogyric crisis within hours of a high-potency antipsychotic indicates acute dystonia, the earliest extrapyramidal reaction; young men are at highest risk. Dopamine D2 blockade in the nigrostriatal pathway leaves cholinergic activity relatively unopposed. A parenteral anticholinergic such as benztropine, or diphenhydramine, reverses it within minutes. Laryngeal dystonia can threaten the airway.","why":["Correct: benztropine (or diphenhydramine) reverses acute dystonia within minutes.","5-HT2A antagonism is part of how atypical antipsychotics work, not a treatment for dystonia.","Beta blockers are used for akathisia.","Dantrolene acts this way and is used for malignant hyperthermia; he has no fever or rigidity syndrome.","VMAT2 inhibitors treat tardive dyskinesia, a late complication."],"dsm":"DSM-5-TR Medication-induced movement disorders: Medication-induced acute dystonia (abnormal sustained muscle contraction developing within a few days of starting or increasing a dopamine-blocking drug).","icd":"ICD-11 classifies drug-induced movement disorders in the diseases of the nervous system, outside the mental disorders chapter.","refs":"","check":"","review":"pending"},{"id":"psy2-s1-10","subj":"Psychiatry","sec":"Emergencies and mental health law","topic":"Neuroleptic malignant syndrome","stem":"A 28-year-old man was admitted to a psychiatric ward 3 days ago with acute psychosis and treated with haloperidol 10 mg twice daily. He is now confused and drenched in sweat. Temperature is 40.2°C (104.4°F), pulse is 128/min and blood pressure fluctuates between 98/60 and 176/104 mm Hg. Examination shows generalized 'lead-pipe' rigidity of all limbs. Deep tendon reflexes are normal, there is no clonus and the pupils are of normal size. Laboratory studies show a leukocyte count of 14,200/µL, creatine kinase of 18,400 U/L (reference range 25–90 U/L) and creatinine of 2.1 mg/dL. A urine dipstick is positive for blood, but no red cells are seen on microscopy.","question":"Which of the following is the primary initiating mechanism of this patient's condition?","options":["Blockade of central dopamine D2 receptors","Blockade of central muscarinic receptors","Excess serotonergic activity in the brainstem","Increased calcium release from skeletal muscle","Reduced GABA-A receptor stimulation"],"answer":0,"explanation":"Fever, lead-pipe rigidity, altered mental status and autonomic instability with a very high creatine kinase soon after starting a high-potency antipsychotic indicate neuroleptic malignant syndrome. Dopamine D2 blockade in the hypothalamus impairs temperature regulation, and blockade in the nigrostriatal pathway causes rigidity. Rhabdomyolysis causes myoglobinuria and acute kidney injury. Treatment is stopping the antipsychotic, cooling and fluids, and considering dantrolene or bromocriptine.","why":["Correct: D2 blockade in the hypothalamus and basal ganglia causes neuroleptic malignant syndrome.","Anticholinergic toxicity causes hot, dry skin and no rigidity.","Serotonin syndrome causes hyperreflexia and clonus rather than lead-pipe rigidity.","Uncontrolled calcium release from a ryanodine receptor defect causes malignant hyperthermia after anesthetic agents.","Alcohol or benzodiazepine withdrawal causes tremor and seizures, not lead-pipe rigidity with this creatine kinase."],"dsm":"DSM-5-TR Medication-induced movement disorders: Neuroleptic malignant syndrome (exposure to a dopamine antagonist within the previous 72 hours; hyperthermia; generalized rigidity; raised creatine kinase; altered mental status; autonomic instability).","icd":"ICD-11 classifies neuroleptic malignant syndrome as a drug-induced condition outside the mental disorders chapter.","refs":"","check":"","review":"pending"},{"id":"psy2-s1-11","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Antipsychotics","stem":"A 32-year-old man with schizophrenia comes for follow-up. His psychotic symptoms have remitted since he began olanzapine 15 mg daily 6 months ago. He reports constant hunger and has gained 13 kg (29 lb); his BMI has risen from 24 to 28 kg/m². He does not smoke or drink alcohol. Blood pressure is 134/86 mm Hg. Laboratory studies show a fasting glucose of 118 mg/dL, triglycerides of 260 mg/dL and HDL cholesterol of 34 mg/dL.","question":"Blockade of which of the following receptors contributes most to his weight gain?","options":["Alpha-1 adrenergic and muscarinic M1","Dopamine D2 in the tuberoinfundibular pathway","Histamine H1 and serotonin 5-HT2C","Serotonin 5-HT1A and dopamine D3","Serotonin 5-HT3 and neurokinin-1"],"answer":2,"explanation":"Second-generation antipsychotics with strong histamine H1 and serotonin 5-HT2C antagonism, especially olanzapine and clozapine, increase appetite and cause weight gain, insulin resistance and dyslipidemia. He now has features of the metabolic syndrome. Weight, waist circumference, blood pressure, glucose and lipids should be monitored. Options include lifestyle support, adding metformin or switching to a lower-risk drug such as aripiprazole, lurasidone or ziprasidone.","why":["Alpha-1 blockade causes postural hypotension, and M1 blockade causes anticholinergic effects.","Tuberoinfundibular D2 blockade causes raised prolactin.","Correct: H1 and 5-HT2C antagonism increase appetite and weight.","These receptors are not the main drivers of antipsychotic weight gain.","5-HT3 and NK-1 antagonists are antiemetics."],"dsm":"Not a diagnostic question (adverse drug effect).","icd":"Not a diagnostic question (adverse drug effect).","refs":"ADA/APA consensus statement on antipsychotic drugs and obesity and diabetes (2004); antipsychotic receptor pharmacology.","check":"","review":"pending"},{"id":"psy2-s1-12","subj":"Psychiatry","sec":"Psychotic disorders","topic":"Schizophrenia","stem":"A 19-year-old man is admitted with his first episode of psychosis. For 3 months he has heard voices threatening him and has believed that his neighbors spy on him through his television. He has no history of depressive or manic episodes, and a urine drug screen is negative. Physical examination and laboratory studies are normal. He improves with an antipsychotic, and at review 6 months after the onset of symptoms the diagnosis of schizophrenia is confirmed. His parents ask which features of an illness like his are linked to a better long-term outcome.","question":"Which of the following findings, if present, would most strongly suggest a better long-term prognosis?","options":["Abrupt onset over 2 weeks after a clear stressor","Enlarged lateral ventricles on MRI","Gradual decline in school performance over 2 years","Persistent apathy and social withdrawal","Regular daily cannabis use"],"answer":0,"explanation":"Better prognosis in schizophrenia is associated with acute onset, a clear precipitating factor, later onset, good premorbid functioning, prominent mood symptoms, female sex, being married, good social support and mainly positive symptoms. Poorer prognosis is associated with early and insidious onset, a long prodrome, prominent negative symptoms, poor premorbid functioning, male sex, a family history of schizophrenia, structural brain abnormalities and ongoing substance use.","why":["Correct: acute onset with a clear precipitating stressor is associated with a better outcome.","Structural brain abnormalities such as ventricular enlargement are associated with a poorer outcome.","A long, insidious prodrome with declining functioning is associated with a poorer outcome.","Prominent negative symptoms are associated with a poorer outcome.","Continued cannabis use is associated with more relapses and a poorer outcome."],"dsm":"DSM-5-TR Schizophrenia: 'Development and Course' and 'Risk and Prognostic Factors' sections.","icd":"ICD-11 6A20 Schizophrenia.","refs":"Prognostic factors summarized from standard psychiatry texts (e.g., Kaplan & Sadock's Synopsis of Psychiatry) and WHO international follow-up studies of schizophrenia.","check":"","review":"pending"},{"id":"psy2-s1-13","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Antipsychotics","stem":"A 26-year-old woman with schizophrenia has had a good response to an antipsychotic started 5 months ago. She now reports that her menstrual periods stopped 3 months ago and that she has noticed a milky discharge from both nipples. She also reports reduced sexual interest. She takes no other medications. Vital signs are normal. Examination shows bilateral expressible galactorrhea and full visual fields. Laboratory studies show a negative serum β-hCG, serum prolactin of 96 ng/mL (reference range under 20 ng/mL), TSH of 1.8 µU/mL and creatinine of 0.8 mg/dL.","question":"Which of the following antipsychotics is she most likely taking?","options":["Aripiprazole","Clozapine","Olanzapine","Quetiapine","Risperidone"],"answer":4,"explanation":"Dopamine released into the tuberoinfundibular pathway inhibits prolactin secretion from the anterior pituitary. Potent D2 blockade there causes hyperprolactinemia, with amenorrhea, galactorrhea, sexual dysfunction and reduced bone density. Risperidone and its metabolite paliperidone raise prolactin most among second-generation antipsychotics, partly because they act strongly on the pituitary, which lies outside the blood-brain barrier. Switching to, or adding, aripiprazole can lower prolactin.","why":["Aripiprazole, a D2 partial agonist, tends to lower prolactin.","Clozapine causes little or no rise in prolactin.","Olanzapine can raise prolactin modestly, much less than risperidone.","Quetiapine causes little or no rise in prolactin.","Correct: risperidone raises prolactin more than other second-generation antipsychotics."],"dsm":"Not a diagnostic question (adverse drug effect).","icd":"Not a diagnostic question (adverse drug effect).","refs":"Antipsychotic prescribing information; Maudsley Prescribing Guidelines in Psychiatry (hyperprolactinaemia).","check":"","review":"pending"},{"id":"psy2-s1-14","subj":"Psychiatry","sec":"Mood disorders","topic":"Major depressive disorder","stem":"A 64-year-old man comes to his physician 3 months after his wife died of breast cancer. His daughter says that since the funeral he has stopped attending church, eats little and has lost 7 kg (15 lb). He wakes at 3 a.m. every day, moves and speaks slowly, and says he feels worthless and 'a burden to everyone.' He believes he deserves to die but has no plan. He says he feels 'empty all the time' and no longer enjoys visits from his grandchildren, whom he used to adore. He has no history of manic or hypomanic episodes. Vital signs are normal. Physical examination shows psychomotor slowing and no other abnormalities. A complete blood count, TSH, vitamin B12 and serum calcium are normal.","question":"Which of the following is the most likely diagnosis?","options":["Adjustment disorder with depressed mood","Major depressive disorder","Normal bereavement","Persistent depressive disorder","Prolonged grief disorder"],"answer":1,"explanation":"Grief typically comes in waves ('pangs') of longing for the person who died, and self-esteem is preserved. This patient instead has pervasive low mood and loss of pleasure, with worthlessness, psychomotor slowing, weight loss, early waking and thoughts of death for more than 2 weeks. His belief that he deserves to die also needs a careful suicide risk assessment. DSM-5 removed the bereavement exclusion, so major depressive disorder is diagnosed when criteria are met after a loss. Prolonged grief disorder requires at least 12 months since the death in adults under DSM-5-TR.","why":["Adjustment disorder is not diagnosed when criteria for another disorder, such as major depressive disorder, are met.","Correct: 5 or more depressive symptoms for over 2 weeks, with worthlessness and psychomotor slowing.","Normal grief comes in waves of longing, with self-esteem preserved.","Persistent depressive disorder requires at least 2 years of symptoms.","Prolonged grief disorder requires at least 12 months since the death under DSM-5-TR."],"dsm":"DSM-5-TR Major depressive disorder: Criterion A (5 or more of 9 symptoms for at least 2 weeks, including depressed mood or loss of interest); the bereavement exclusion was removed in DSM-5, with guidance on distinguishing grief from a depressive episode.","icd":"ICD-11 6A70 Single episode depressive disorder (at least 5 of 10 symptoms, including low mood or loss of interest, for at least 2 weeks). Difference: ICD-11 6B42 Prolonged grief disorder needs only 6 months after the loss, compared with 12 months in DSM-5-TR.","refs":"","check":"","review":"pending"},{"id":"psy2-s1-15","subj":"Psychiatry","sec":"Mood disorders","topic":"Persistent depressive disorder","stem":"A 45-year-old civil servant comes to his physician because his wife says he is 'always gloomy.' He says a low mood has been 'there in the background' on most days for at least 3 years, and he cannot remember feeling well for more than a few weeks at a time. He is tired of 'always feeling flat' and says it is straining his marriage. He has little energy, thinks poorly of himself and finds it hard to make decisions at work. He sleeps 7 hours a night, his appetite is unchanged, he still enjoys his weekly soccer match and he has never thought of harming himself. He has never missed work because of his mood. He has no history of elevated mood, substance use or medical illness. Vital signs and physical examination are normal. TSH and a complete blood count are normal.","question":"Which of the following is the most likely diagnosis?","options":["Adjustment disorder with depressed mood","Cyclothymic disorder","Generalized anxiety disorder","Major depressive disorder, recurrent","Persistent depressive disorder"],"answer":4,"explanation":"Persistent depressive disorder (dysthymia) requires depressed mood on most days for at least 2 years in adults, with at least 2 of: poor appetite or overeating, insomnia or hypersomnia, low energy, low self-esteem, poor concentration or indecisiveness, and hopelessness. The person is never without symptoms for more than 2 months at a time. If full major depressive episodes also occur, this is recorded with a specifier rather than as a separate diagnosis.","why":["Adjustment disorder follows an identifiable stressor and usually resolves within 6 months of it ending.","Cyclothymic disorder requires periods of hypomanic symptoms as well as depressive symptoms.","His main problem is low mood, not excessive worry about many areas of life.","He has never met full criteria for a major depressive episode.","Correct: depressed mood most days for over 2 years, with 2 or more associated symptoms."],"dsm":"DSM-5-TR Persistent depressive disorder: Criterion A (depressed mood most days for at least 2 years), Criterion B (2 or more of 6 symptoms), Criterion C (never without symptoms for more than 2 months).","icd":"ICD-11 6A72 Dysthymic disorder: persistent depressed mood for at least 2 years, with no 2-week period during the first 2 years that meets the requirements for a depressive episode. Difference: DSM-5-TR allows full depressive episodes within persistent depressive disorder (with a specifier); ICD-11 does not during the first 2 years.","refs":"","check":"","review":"pending"},{"id":"psy2-s1-16","subj":"Psychiatry","sec":"Mood disorders","topic":"Bipolar disorders","stem":"A 27-year-old man is brought to the emergency department by police after he tried to buy a bank 'for cash.' For 9 days he has slept 2 hours a night without feeling tired, spent his savings on two cars and told his family that he has been chosen to lead the nation. He talks rapidly and cannot be interrupted. Two years ago he was treated for a depressive episode, during which he attempted suicide by overdose. Temperature is 37.0°C (98.6°F), pulse is 102/min and blood pressure is 128/80 mm Hg. Physical examination is normal. Laboratory studies, including TSH, a complete blood count and a urine drug screen, are normal; creatinine is 0.9 mg/dL. He is admitted, and his symptoms improve with treatment.","question":"Which of the following is the most appropriate long-term maintenance medication to reduce both relapse and suicide risk?","options":["Clonazepam","Lamotrigine","Lithium","Sertraline","Topiramate"],"answer":2,"explanation":"A distinct period of elevated mood and increased energy for at least 1 week, with grandiosity, decreased need for sleep, pressured speech and reckless spending causing marked impairment, is a manic episode, which establishes bipolar I disorder. Lithium is a first-line maintenance treatment: it prevents both manic and depressive relapse and has the strongest evidence for reducing suicide in mood disorders. Serum levels, kidney and thyroid function, and calcium must be monitored.","why":["Benzodiazepines help acute agitation and sleep but do not prevent mood episodes.","Lamotrigine mainly prevents depressive relapse and does not adequately prevent mania.","Correct: lithium prevents manic and depressive relapse and has the strongest evidence for reducing suicide.","An antidepressant alone may trigger mania and does not prevent manic relapse.","Topiramate has no proven efficacy as a mood stabilizer."],"dsm":"DSM-5-TR Bipolar I disorder: at least 1 manic episode. Manic episode Criteria A–D (abnormally elevated, expansive or irritable mood and increased energy for at least 1 week; 3 or more symptoms, or 4 if mood is only irritable; marked impairment, psychosis or hospitalization).","icd":"ICD-11 6A60 Bipolar type I disorder: at least 1 manic or mixed episode; mania lasts at least 1 week unless shortened by treatment. Difference: ICD-11 can diagnose mania from increased activity or energy with other symptoms, and recognizes mixed episodes as a separate episode type.","refs":"CANMAT/ISBD guidelines for the management of bipolar disorder (2018).","check":"","review":"pending"},{"id":"psy2-s1-17","subj":"Psychiatry","sec":"Mood disorders","topic":"Bipolar disorders","stem":"A 31-year-old woman seeks treatment for her third episode of depression, with low mood, anhedonia, hypersomnia and poor concentration for the past month. On further questioning, she describes two earlier periods, each lasting about 5 days, when she felt unusually confident and energetic, needed only 4 hours of sleep, started several new business plans and talked more than usual. Her friends noticed the change, but she continued working effectively and was never hospitalized. She has never had psychotic symptoms. She drinks alcohol occasionally and does not use drugs. Vital signs and physical examination are normal. TSH is normal.","question":"Which of the following is the most likely diagnosis?","options":["Bipolar I disorder","Bipolar II disorder","Borderline personality disorder","Cyclothymic disorder","Major depressive disorder, recurrent"],"answer":1,"explanation":"Bipolar II disorder requires at least 1 hypomanic episode and at least 1 major depressive episode, with no history of mania. Hypomania lasts at least 4 consecutive days, is observable by others and does not cause marked impairment, psychosis or hospitalization. Asking about past hypomania matters because antidepressants used alone may destabilize mood. Quetiapine has evidence for bipolar depression, and lamotrigine for preventing depressive relapse.","why":["Bipolar I disorder requires a manic episode with marked impairment, psychosis or hospitalization.","Correct: hypomanic episodes of at least 4 days plus major depressive episodes.","Borderline personality disorder involves mood shifts over hours, not discrete episodes lasting days.","Cyclothymic disorder does not include full major depressive episodes.","Her past hypomanic episodes exclude unipolar major depressive disorder."],"dsm":"DSM-5-TR Bipolar II disorder: at least 1 hypomanic episode (at least 4 consecutive days) and at least 1 major depressive episode; never a manic episode.","icd":"ICD-11 6A61 Bipolar type II disorder: at least 1 hypomanic episode and at least 1 depressive episode, with no history of manic or mixed episodes. Difference: ICD-11 requires hypomania to last 'at least several days' rather than a fixed 4 days.","refs":"CANMAT/ISBD guidelines for the management of bipolar disorder (2018).","check":"","review":"pending"},{"id":"psy2-s1-18","subj":"Psychiatry","sec":"Mood disorders","topic":"Bipolar disorders","stem":"A 24-year-old woman began sertraline 50 mg daily 4 weeks ago for her first major depressive episode. Her mother brings her to the clinic because for 9 days she has been euphoric and irritable, has slept about 3 hours a night, has spent large sums on clothes and is speaking very fast. She has no psychotic symptoms and does not use drugs. Vital signs are normal. Physical examination shows no abnormalities. Laboratory studies, including TSH and a urine drug screen, are normal, and a pregnancy test is negative.","question":"In addition to stopping sertraline, which of the following is the most appropriate medication for her current episode?","options":["Bupropion","Gabapentin","Lamotrigine","Quetiapine","Topiramate"],"answer":3,"explanation":"A full manic episode that emerges during antidepressant treatment and persists at a fully syndromal level beyond the drug's physiological effect counts as a manic episode, establishing bipolar I disorder. The antidepressant should be stopped and an antimanic agent started: a second-generation antipsychotic such as quetiapine, olanzapine, risperidone or aripiprazole, or lithium or valproate. A benzodiazepine can help agitation and sleep short term but does not treat mania.","why":["Bupropion is an antidepressant and does not treat mania.","Gabapentin has no proven antimanic effect.","Lamotrigine helps prevent bipolar depression but has no acute antimanic effect.","Correct: second-generation antipsychotics such as quetiapine are first-line antimanic treatments.","Topiramate has no proven antimanic effect."],"dsm":"DSM-5-TR Manic episode, note to Criterion D: a full manic episode that emerges during antidepressant treatment and persists beyond the physiological effect of that treatment is sufficient for a manic episode and a bipolar I diagnosis.","icd":"ICD-11 6A60 Bipolar type I disorder (at least 1 manic or mixed episode).","refs":"CANMAT/ISBD guidelines for the management of bipolar disorder (2018).","check":"","review":"pending"},{"id":"psy2-s1-19","subj":"Psychiatry","sec":"Emergencies and mental health law","topic":"Lithium toxicity","stem":"A 50-year-old man with bipolar I disorder has been stable on lithium for 4 years, with serum levels of 0.6 to 0.8 mEq/L. Three weeks ago his family physician started a new medication for hypertension. For 3 days he has had vomiting, diarrhea and unsteadiness, and today his wife noticed that he was confused. Temperature is 37.1°C (98.8°F), pulse is 64/min and blood pressure is 128/78 mm Hg. Examination shows a coarse tremor of both hands, ataxia, increased tone and brisk reflexes. Laboratory studies show sodium of 133 mEq/L, potassium of 3.4 mEq/L, creatinine of 1.6 mg/dL (baseline 1.0 mg/dL) and a serum lithium level of 2.6 mEq/L (therapeutic range 0.6–1.2 mEq/L).","question":"Which of the following newly prescribed medications most likely caused this presentation?","options":["Amlodipine","Clonidine","Doxazosin","Hydralazine","Hydrochlorothiazide"],"answer":4,"explanation":"Thiazide diuretics cause mild volume depletion, which increases sodium and lithium reabsorption in the proximal tubule, reducing lithium clearance and raising serum levels by roughly 25 to 40 percent. ACE inhibitors, angiotensin receptor blockers and NSAIDs have similar effects. Lithium toxicity causes gastrointestinal symptoms, coarse tremor, ataxia, hyperreflexia and confusion; severe toxicity with neurological signs or kidney impairment may need hemodialysis.","why":["Amlodipine does not meaningfully change lithium clearance.","Clonidine does not meaningfully change lithium clearance.","Doxazosin does not meaningfully change lithium clearance.","Hydralazine does not meaningfully change lithium clearance.","Correct: thiazides reduce lithium clearance and commonly precipitate toxicity."],"dsm":"Not a diagnostic question (drug toxicity).","icd":"Not a diagnostic question (drug toxicity).","refs":"Lithium prescribing information (drug interactions); EXTRIP workgroup recommendations on extracorporeal treatment for lithium poisoning (2015).","check":"","review":"pending"},{"id":"psy2-s1-20","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Mood stabilizers","stem":"A 40-year-old woman with bipolar I disorder reports passing large volumes of urine and drinking about 6 liters of water a day for 6 months. She has taken lithium for 10 years, and her latest serum level was 0.8 mEq/L. Blood pressure is 118/74 mm Hg, and her mucous membranes are dry. Laboratory studies show sodium of 144 mEq/L, glucose of 92 mg/dL, calcium of 9.4 mg/dL and creatinine of 1.0 mg/dL. During a supervised water deprivation test her urine osmolality stays at 190 mOsm/kg, and 2 hours after desmopressin it is 205 mOsm/kg. She and her psychiatrist agree that lithium should continue because it has prevented relapse.","question":"Which of the following is the most appropriate treatment for her urinary symptoms?","options":["Amiloride","Demeclocycline","Desmopressin","Fluid restriction","Tolvaptan"],"answer":0,"explanation":"Dilute urine that fails to concentrate after water deprivation or desmopressin, with high-normal sodium, indicates nephrogenic diabetes insipidus. Lithium enters collecting duct cells through the epithelial sodium channel (ENaC) and reduces their response to antidiuretic hormone by downregulating aquaporin-2 channels. Amiloride blocks ENaC, limiting lithium entry and improving concentrating ability, so it is preferred when lithium must continue. Thiazides also reduce urine volume but raise lithium levels.","why":["Correct: amiloride blocks lithium entry into collecting duct cells through ENaC.","Demeclocycline itself causes nephrogenic diabetes insipidus.","Her kidneys do not respond to desmopressin.","Fluid restriction would cause dangerous dehydration and hypernatremia.","Tolvaptan blocks ADH receptors and would worsen water loss."],"dsm":"Not a diagnostic question (adverse drug effect).","icd":"Not a diagnostic question (adverse drug effect).","refs":"Lithium prescribing information; nephrology reviews of lithium-induced nephrogenic diabetes insipidus.","check":"","review":"pending"},{"id":"psy2-s1-21","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Mood stabilizers","stem":"A 29-year-old woman with bipolar I disorder has been maintained on valproate. Lamotrigine was added 16 days ago for recurrent depressive episodes, at 25 mg daily for 2 weeks and then 50 mg daily. She also takes a combined oral contraceptive. She now has fever, painful erosions of the lips and mouth, red eyes and a spreading dusky rash with blisters. Temperature is 38.9°C (102°F). Examination shows target-like macules with epidermal detachment over about 8% of her body surface area and a positive Nikolsky sign.","question":"Which of the following most increased her risk of this reaction?","options":["Age under 30 years","Bipolar disorder as the indication","Combined oral contraceptive use","Concomitant valproate therapy","Taking lamotrigine with meals"],"answer":3,"explanation":"Painful mucosal erosions with epidermal detachment over less than 10% of body surface area indicate Stevens-Johnson syndrome. The risk of serious rash with lamotrigine is highest in the first 8 weeks and rises with a high starting dose, rapid titration and concomitant valproate, which inhibits lamotrigine glucuronidation and roughly doubles its levels. With valproate, the starting dose is 25 mg every other day, half the usual schedule she was given. Lamotrigine must be stopped permanently.","why":["Children, not young adults, have a higher risk.","The indication does not change the risk; dose and titration do.","Estrogen-containing contraceptives lower lamotrigine levels.","Correct: valproate roughly doubles lamotrigine levels, and she was started at the full dose.","Food does not change lamotrigine levels in a way that affects rash risk."],"dsm":"Not a diagnostic question (adverse drug effect).","icd":"Not a diagnostic question (adverse drug effect).","refs":"Lamotrigine prescribing information (boxed warning on serious skin rashes); SJS/TEN classification by body surface area (SJS under 10%, TEN over 30%).","check":"","review":"pending"},{"id":"psy2-s1-22","subj":"Psychiatry","sec":"Mood disorders","topic":"Suicide risk assessment","stem":"A 68-year-old widower with major depressive disorder is seen in the clinic for follow-up. He lives alone in a rural village, drinks about 6 standard drinks of alcohol daily and was recently diagnosed with prostate cancer. He owns a shotgun for hunting. Two years ago he was admitted to intensive care after an intentional overdose of his amlodipine tablets. He currently denies suicidal intent. His PHQ-9 score is 18. Vital signs are normal, and physical examination shows no abnormalities.","question":"Which of the following is the strongest single predictor of future death by suicide in this patient?","options":["Alcohol use","Living alone","Older age","Previous suicide attempt","Recent cancer diagnosis"],"answer":3,"explanation":"A previous suicide attempt is the strongest single predictor of death by suicide. This patient has many additional risk factors: male sex, older age, depression, alcohol use, serious physical illness, social isolation and access to a firearm. Denial of current intent does not remove risk. He needs a thorough risk assessment, a safety plan, removal of access to lethal means (the shotgun) and close follow-up.","why":["Alcohol use raises risk, but less than a previous attempt.","Living alone raises risk, but less than a previous attempt.","Older age raises risk, but less than a previous attempt.","Correct: a previous attempt is the strongest single predictor of death by suicide.","Serious physical illness raises risk, but less than a previous attempt."],"dsm":"DSM-5-TR lists current and past suicidal behavior as conditions that may be a focus of clinical attention; this is not a diagnostic question.","icd":"Not a diagnostic question.","refs":"WHO, Preventing Suicide: A Global Imperative (2014); APA practice guideline for the assessment and treatment of patients with suicidal behaviors.","check":"","review":"pending"},{"id":"psy2-s1-23","subj":"Psychiatry","sec":"Emergencies and mental health law","topic":"Involuntary admission","stem":"A 35-year-old woman with major depressive disorder tells her psychiatrist that she has saved 60 tablets of amitriptyline and plans to take them all tonight because 'everyone would be better off without me.' She has written farewell letters to her children and given away her jewellery. She is alert and oriented, and her thinking is logical. She refuses voluntary admission, saying she will 'find a way' if she is stopped today. Her husband is in the waiting room.","question":"Which of the following is the most appropriate next step in management?","options":["Arrange emergency involuntary psychiatric admission","Ask her husband to remove the tablets and supervise her at home","Discharge her with a written safety plan and review in 1 week","Increase her antidepressant dose and review in 2 days","Refer her urgently for outpatient cognitive behavioral therapy"],"answer":0,"explanation":"She has a specific plan, access to a lethal method, preparatory acts (farewell letters, giving away possessions) and stated intent, which together indicate imminent risk. When a person at imminent risk of harm because of a mental disorder refuses voluntary treatment, emergency involuntary admission under mental health law is justified to keep her safe. Intact orientation and logical thinking do not prevent involuntary admission; the test is imminent risk due to a mental disorder, not capacity alone. Tricyclic antidepressants are especially lethal in overdose because of cardiac toxicity.","why":["Correct: imminent risk from a mental disorder, with refusal of voluntary care, justifies involuntary admission.","Supervision at home cannot reliably keep her safe at this level of risk.","A safety plan is not enough for someone with a plan, the means, preparation and intent.","Antidepressants take weeks to work and do not address imminent risk.","Outpatient therapy does not address imminent risk."],"dsm":"Not a diagnostic question (risk management and law).","icd":"Not a diagnostic question (risk management and law).","refs":"Civil commitment criteria under local mental health legislation (for example, US state laws; Nigeria's National Mental Health Act 2021); APA practice guideline for patients with suicidal behaviors.","check":"Legal criteria and procedures for involuntary admission vary by country and state.","review":"pending"},{"id":"psy2-s1-24","subj":"Psychiatry","sec":"Psychiatric treatment","topic":"Electroconvulsive therapy","stem":"A 72-year-old woman with severe major depressive disorder is admitted because she has refused food and fluids for 5 days. She lies in bed, rarely speaks and says her intestines have 'rotted away.' She has lost 8 kg (18 lb) in 1 month. Two adequate antidepressant trials in the past year were ineffective. Pulse is 108/min and blood pressure is 102/64 mm Hg. Her mucous membranes are dry. Laboratory studies show sodium of 149 mEq/L and creatinine of 1.9 mg/dL (baseline 0.9 mg/dL). After rehydration, the team recommends the treatment most likely to produce a rapid and full response.","question":"Which of the following is the most common clinically significant adverse effect of the recommended treatment?","options":["Memory impairment","Persistent seizure disorder","Serotonin syndrome","Tardive dyskinesia","Weight gain"],"answer":0,"explanation":"Severe depression with nihilistic delusions, refusal of food and fluids and failure of 2 antidepressant trials calls for electroconvulsive therapy, the fastest and most effective treatment for severe or psychotic depression. Headache is its commonest minor side effect; its most common clinically significant adverse effects are confusion just after treatment and memory impairment, both for new information and for events around the treatment period, which usually improves within weeks. Headache and muscle aches are also common.","why":["Correct: temporary confusion and memory impairment are the most common adverse effects of ECT.","ECT does not cause a lasting seizure disorder.","Serotonin syndrome is caused by serotonergic drugs, not ECT.","Tardive dyskinesia is caused by long-term dopamine blockade.","Weight gain is a side effect of some medications, not ECT."],"dsm":"DSM-5-TR Major depressive disorder, severe, with mood-congruent psychotic features.","icd":"ICD-11 6A70/6A71 Depressive disorder, current episode severe, with psychotic symptoms.","refs":"APA Task Force report on the practice of ECT (2001); NICE technology appraisal on ECT.","check":"","review":"pending"},{"id":"psy2-s1-25","subj":"Psychiatry","sec":"Mood disorders","topic":"Major depressive disorder","stem":"A 60-year-old woman is brought to her physician by her son because of 6 weeks of low mood, waking at 3 a.m., weight loss of 5 kg (11 lb) and marked guilt. For the past 2 weeks she has insisted that she committed an unforgivable sin and that her family will be punished because of her. Her pastor says the belief is not part of their church's teaching and that she has done nothing wrong. The belief began after her mood became low, and she has never had psychotic symptoms when well. She is eating and drinking adequately and denies thoughts of suicide. She has no history of mania. Vital signs and physical examination are normal. A complete blood count, TSH, calcium, vitamin B12 and CT of the head are normal.","question":"Which of the following is the most appropriate initial pharmacotherapy?","options":["Haloperidol alone","Lithium with lorazepam","Mirtazapine alone","Sertraline with olanzapine","Venlafaxine with propranolol"],"answer":3,"explanation":"Major depressive disorder with mood-congruent psychotic features, here delusions of guilt and deserved punishment, responds poorly to an antidepressant or antipsychotic alone. First-line medication is an antidepressant combined with an antipsychotic, such as sertraline with olanzapine. Electroconvulsive therapy is an equally effective alternative, preferred when a rapid response is needed (refusing food or high suicide risk); she is eating and not suicidal, so medication is a reasonable start. A belief is delusional only if it is out of keeping with the person's culture and faith community.","why":["An antipsychotic alone does not adequately treat the depression.","Lithium is not first-line for unipolar psychotic depression, and lorazepam does not treat it.","An antidepressant alone is less effective when psychotic features are present.","Correct: an antidepressant plus an antipsychotic is first-line medication for psychotic depression.","Propranolol does not treat psychosis, so this combination is incomplete."],"dsm":"DSM-5-TR Major depressive disorder, single episode, severe, with mood-congruent psychotic features.","icd":"ICD-11 6A70 Single episode depressive disorder, current episode severe, with psychotic symptoms.","refs":"APA practice guidelin
